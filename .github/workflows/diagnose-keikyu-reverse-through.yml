name: Diagnose Keikyu reverse through attachment
on:
  pull_request:
    paths:
      - 'scripts/*keikyu*'
      - 'scripts/*sengakuji*'
      - '.github/workflows/diagnose-keikyu-reverse-through.yml'
      - '.github/workflows/update-transit-timetables.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies for legacy regression fixtures
        run: pip install pdfplumber==0.11.7 PyMuPDF==1.26.4 requests==2.32.5
      - name: Test exact terminal and legacy fail-closed repair paths
        run: |
          python scripts/test_keikyu_generated_evidence.py
          python scripts/test_repair_keikyu_sengakuji_terminal_idempotent.py
          python scripts/test_keikyu_exact_terminal.py
      - name: Verify terminal rows without synthesizing exact timetable events
        run: |
          python scripts/repair_keikyu_sengakuji_terminal.py
          python scripts/repair_keikyu_sengakuji_terminal_idempotent.py
          python scripts/diagnose_keikyu_reverse_through.py
          python scripts/verify_sengakuji_runtime.py --verify-current-source
          python scripts/verify_keikyu_through_materialization.py
      - uses: actions/upload-artifact@v4
        with:
          name: keikyu-reverse-through-diagnostic
          path: |
            /tmp/keikyu-reverse-diagnostic.json
            /tmp/keikyu-sengakuji-repair.json
          if-no-files-found: error
