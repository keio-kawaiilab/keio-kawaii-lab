name: Archive Fukutoshin 2016 official timetable source

# Historical diagnostic only. The retained Tokyo Metro e-book path is a 2016 source
# and currently returns HTTP 403 from GitHub-hosted runners, so it must never refresh
# or classify the current 2026 through-service database automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explain archival status
        run: |
          echo 'This workflow is manual-only.'
          echo 'The e-book_160326 source is historical and is not a current 2026 train-identity source.'
          echo 'Current Line 13 identity work uses current official sources and exact per-train evidence only.'
      - name: Validate collector syntax only
        run: python -m py_compile scripts/collect_fukutoshin_official_through_timetable.py
