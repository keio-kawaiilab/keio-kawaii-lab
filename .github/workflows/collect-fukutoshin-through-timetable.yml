name: Collect Fukutoshin official through timetable

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/collect_fukutoshin_official_through_timetable.py'
      - '.github/workflows/collect-fukutoshin-through-timetable.yml'

permissions:
  contents: write

concurrency:
  group: collect-fukutoshin-through-timetable
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect Tokyo Metro official five-operator timetable source
        run: python scripts/collect_fukutoshin_official_through_timetable.py
      - name: Validate strict source policy
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/transit/fukutoshin/official-through-pages.json',encoding='utf-8'))
          r=json.load(open('data/transit/fukutoshin/official-through-report.json',encoding='utf-8'))
          policy=p['identityPolicy']
          assert policy['singlePublishedTrainColumnMayEstablishIdentity'] is True
          assert policy['timeProximityMayEstablishIdentity'] is False
          assert policy['trainNumberAloneMayEstablishIdentity'] is False
          assert policy['destinationAloneMayEstablishIdentity'] is False
          assert r['pageCount'] == 121
          assert r['timetablePages'] >= 20
          assert r['uniqueTrainNumberCellsByPage'] >= 100
          print(json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - name: Commit retained official source
        run: |
          git add data/transit/fukutoshin/official-through-pages.json data/transit/fukutoshin/official-through-report.json
          if git diff --cached --quiet; then
            echo 'No official source changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '418982318+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Retain official Fukutoshin through timetable source'
          git pull --rebase origin main
          git push
