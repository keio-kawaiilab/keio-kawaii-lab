name: Apply Keikyu publication-number typography fix

on:
  push:
    branches:
      - work/keikyu-prev-page-evidence-20260906
    paths:
      - '.github/workflows/apply-keikyu-page-number-font-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch publication-number detector and tests
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          replacement = base64.b64decode('').decode()
          addition = base64.b64decode('').decode()

          detector = Path('scripts/audit_keikyu_previous_publication_refs.py')
          text = detector.read_text(encoding='utf-8')
          start = text.index('def detect_printed_page_number(')
          end = text.index('\n\ndef build_audit(', start)
          detector.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          tests = Path('scripts/test_keikyu_previous_publication_refs.py')
          text = tests.read_text(encoding='utf-8')
          marker = '    def test_footer_detector_does_not_accept_interior_number(self):\n'
          if marker not in text:
              raise SystemExit('test insertion marker missing')
          tests.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')
          PY
      - name: Commit script-only patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit_keikyu_previous_publication_refs.py scripts/test_keikyu_previous_publication_refs.py
          git commit -m "Use Keikyu footer typography for page numbers"
          git pull --rebase origin work/keikyu-prev-page-evidence-20260906
          git push origin HEAD:work/keikyu-prev-page-evidence-20260906
