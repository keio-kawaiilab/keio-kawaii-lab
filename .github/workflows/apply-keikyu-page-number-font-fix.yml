name: Apply Keikyu publication-number typography fix

on:
  push:
    branches:
      - work/keikyu-prev-page-evidence-20260906
    paths:
      - '.github/workflows/apply-keikyu-page-number-font-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch publication-number detector and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/audit_keikyu_previous_publication_refs.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def detect_printed_page_number(')
          end = text.index('\n\ndef build_audit(', start)
          replacement = '''def detect_printed_page_number(width: float, height: float, words: list[Word]) -> int | None:
    """Detect the printed publication page number from its official typography.

    The current official PDF prints publication numbers in a visibly larger
    footer font than timetable times and continuation metadata.  Auditing normal
    pages plus special printed pages 32 and 62 shows the publication glyph box at
    about 12.9 pt high, while timetable integers are about 6.0 pt and the special
    continuation-page labels remain about 8.3 pt.  We therefore require both the
    outer footer geometry and the large official page-number typography first.
    A narrow legacy bottom-edge fallback remains fail-closed.  No PDF-page offset
    or inferred sequence is ever used.
    """
    large_values: set[int] = set()
    for word in words:
        if word.y < height * 0.82:
            continue
        if not (word.x < width * 0.12 or word.x > width * 0.88):
            continue
        if (word.y_max - word.y_min) < 10.0:
            continue
        value = _parse_printed_page(word.text)
        if value is not None:
            large_values.add(value)
    if len(large_values) == 1:
        return next(iter(large_values))
    if len(large_values) > 1:
        return None

    strict_bottom = _footer_page_candidates(
        width,
        height,
        words,
        min_y_fraction=0.94,
        edge_fraction=0.12,
    )
    if len(strict_bottom) == 1:
        return next(iter(strict_bottom))
    return None
'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          tests = Path('scripts/test_keikyu_previous_publication_refs.py')
          text = tests.read_text(encoding='utf-8')
          marker = '''    def test_footer_detector_does_not_accept_interior_number(self):
        words = [word("62", 500.0, 910.0)]
        self.assertIsNone(detect_printed_page_number(1000.0, 1000.0, words))
'''
          addition = '''    def test_large_official_page_number_beats_smaller_table_integer(self):
        words = [
            word("62", 50.0, 960.0, height=13.0),
            word("744", 950.0, 900.0, height=6.0),
            word("807", 950.0, 970.0, height=6.0),
        ]
        self.assertEqual(detect_printed_page_number(1000.0, 1000.0, words), 62)

    def test_special_page_32_ignores_smaller_previous_page_labels(self):
        words = [
            word("32", 50.0, 960.0, height=13.0),
            word("62", 950.0, 970.0, height=8.3),
        ]
        self.assertEqual(detect_printed_page_number(1000.0, 1000.0, words), 32)

'''
          if marker not in text:
              raise SystemExit('test insertion marker missing')
          tests.write_text(text.replace(marker, addition + marker), encoding='utf-8')
          PY
      - name: Commit script-only patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit_keikyu_previous_publication_refs.py scripts/test_keikyu_previous_publication_refs.py
          git commit -m "Use Keikyu footer typography for page numbers"
          git pull --rebase origin work/keikyu-prev-page-evidence-20260906
          git push origin HEAD:work/keikyu-prev-page-evidence-20260906
