name: One-off fix Ogawa birthday duplicates

on:
  push:
    paths:
      - ".github/workflows/oneoff-fix-ogawa-birthday.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove impossible birthday rows and harden ticket semantics
        run: |
          python scripts/guard_birthday_year_consistency.py --data data/live-events.json
          python scripts/harden_ticket_semantics.py --data data/live-events.json

      - name: Commit corrected calendar data
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/live-events.json; then
            echo "No calendar cleanup required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-events.json
          git commit -m "Fix duplicate birthday schedule data"
          git pull --rebase origin main
          git push origin HEAD:main
