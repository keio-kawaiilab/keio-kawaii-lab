name: Update Keikyu official through-train DB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/keikyu_*.py'
      - 'scripts/test_keikyu_*.py'
      - 'scripts/verify_keikyu_*.py'
      - 'scripts/audit_keikyu_*.py'
      - 'scripts/build_keikyu_*.py'
      - 'scripts/repair_keikyu_*.py'
      - 'scripts/build_transit_v2.py'
      - 'scripts/finalize_transit_v2.py'
      - 'scripts/reviewed_train_evidence.py'
      - 'data/transit-v2/service-boundaries.json'
      - '.github/workflows/update-keikyu-official-through-evidence.yml'
  schedule:
    - cron: '17 20 * * 6'

permissions:
  contents: write

concurrency:
  group: transit-db-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      ODPT_API_KEY: ${{ secrets.ODPT_API_KEY }}
      ODPT_CHALLENGE_API_KEY: ${{ secrets.ODPT_CHALLENGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync checkout to latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install pdfplumber==0.11.7 requests==2.32.5

      - name: Test fail-closed identity rules
        run: |
          python -m py_compile \
            scripts/keikyu_generated_evidence.py \
            scripts/verify_keikyu_through_materialization.py \
            scripts/repair_keikyu_sengakuji_terminal_idempotent.py \
            scripts/keikyu_internal_official_evidence.py \
            scripts/keikyu_internal_generated_evidence.py \
            scripts/verify_keikyu_internal_materialization.py \
            scripts/build_keikyu_official_stop_times.py \
            scripts/audit_keikyu_previous_publication_refs.py \
            scripts/build_keikyu_cross_page_identity_audit.py \
            scripts/build_keikyu_independent_mother_set_audit.py
          python scripts/test_keikyu_official_train_evidence.py
          python scripts/test_keikyu_generated_evidence.py
          python scripts/test_repair_keikyu_sengakuji_terminal_idempotent.py
          python scripts/test_keikyu_internal_official_evidence.py
          python scripts/test_keikyu_internal_generated_evidence.py
          python scripts/test_keikyu_official_stop_times.py
          python scripts/test_keikyu_previous_publication_refs.py
          python scripts/test_keikyu_cross_page_identity_audit.py
          python scripts/test_keikyu_independent_mother_set_audit.py

      - name: Audit full official timetable mother set
        run: |
          python scripts/build_keikyu_official_stop_times.py \
            --output /tmp/keikyu-official-stop-times.json
          python scripts/verify_keikyu_official_stop_times.py \
            /tmp/keikyu-official-stop-times.json
          python scripts/audit_keikyu_previous_publication_refs.py \
            --output /tmp/keikyu-previous-publication-refs.json
          python scripts/build_keikyu_cross_page_identity_audit.py \
            /tmp/keikyu-official-stop-times.json \
            /tmp/keikyu-previous-publication-refs.json \
            --output /tmp/keikyu-cross-page-identity-audit.json
          python scripts/verify_keikyu_cross_page_identity_audit.py \
            /tmp/keikyu-cross-page-identity-audit.json
          python scripts/audit_keikyu_empty_fragments.py \
            /tmp/keikyu-official-stop-times.json \
            /tmp/keikyu-cross-page-identity-audit.json \
            --output /tmp/keikyu-empty-fragments.json
          python scripts/build_keikyu_independent_mother_set_audit.py \
            /tmp/keikyu-official-stop-times.json \
            /tmp/keikyu-cross-page-identity-audit.json \
            --output /tmp/keikyu-independent-mother-set.json
          python scripts/verify_keikyu_independent_mother_set_audit.py \
            /tmp/keikyu-independent-mother-set.json

      - name: Repair missing Keikyu inbound Sengakuji board
        run: python scripts/repair_keikyu_sengakuji_terminal_idempotent.py

      - name: Rebuild strict transit v2 fragments
        run: python scripts/build_transit_v2.py

      - name: Extract official weekday and holiday boundary candidates
        run: |
          python scripts/keikyu_official_train_evidence.py \
            --calendar weekday \
            --output /tmp/keikyu-weekday.json
          python scripts/keikyu_official_train_evidence.py \
            --calendar holiday \
            --output /tmp/keikyu-holiday.json
          python scripts/merge_keikyu_official_evidence.py \
            /tmp/keikyu-weekday.json \
            /tmp/keikyu-holiday.json \
            --output data/transit-v2/keikyu-official-train-evidence.json
          python scripts/keikyu_internal_official_evidence.py

      - name: Re-finalize strict transit DB
        run: |
          python scripts/finalize_transit_v2.py
          python scripts/audit_transit_v2.py

      - name: Verify safe cross-boundary runtime materialization
        run: |
          python scripts/verify_keikyu_through_materialization.py
          python scripts/verify_keikyu_internal_materialization.py

      - name: Commit refreshed strict DB
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/transit/keikyu \
            data/transit-v2/fragments/keikyu.json \
            data/transit-v2/keikyu-official-train-evidence.json \
            data/transit-v2/keikyu-internal-official-train-evidence.json \
            data/transit-v2/same-train-edges.json \
            data/transit-v2/runtime-same-train.json \
            data/transit-v2/coverage.json \
            data/transit-v2/index.json \
            data/transit-v2/unresolved-summary.json
          if git diff --cached --quiet; then
            echo "No intended Keikyu transit DB changes."
            exit 0
          fi
          git commit -m "Refresh Keikyu official through-train evidence"
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev '^data/transit(-v2)?/' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected non-transit working-tree changes after DB commit:"
            echo "$unexpected"
            exit 1
          fi
          git restore --worktree -- data/transit data/transit-v2
          git clean -fd -- data/transit data/transit-v2
          git pull --rebase origin main
          git push origin HEAD:main
