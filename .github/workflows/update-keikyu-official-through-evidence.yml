name: Update Keikyu official through-train DB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_keikyu_sengakuji_terminal.py'
      - 'scripts/repair_keikyu_sengakuji_terminal_idempotent.py'
      - 'scripts/test_repair_keikyu_sengakuji_terminal_idempotent.py'
      - 'scripts/build_transit_v2.py'
      - 'scripts/keikyu_official_train_evidence.py'
      - 'scripts/merge_keikyu_official_evidence.py'
      - 'scripts/keikyu_generated_evidence.py'
      - 'scripts/test_keikyu_official_train_evidence.py'
      - 'scripts/test_keikyu_generated_evidence.py'
      - 'scripts/verify_keikyu_through_materialization.py'
      - 'scripts/keikyu_internal_official_evidence.py'
      - 'scripts/keikyu_internal_generated_evidence.py'
      - 'scripts/test_keikyu_internal_official_evidence.py'
      - 'scripts/test_keikyu_internal_generated_evidence.py'
      - 'scripts/verify_keikyu_internal_materialization.py'
      - 'scripts/reviewed_train_evidence.py'
      - 'scripts/keikyu_official_pdf.py'
      - 'scripts/audit_keikyu_official_columns.py'
      - 'scripts/audit_keikyu_station_time_resolution.py'
      - 'scripts/probe_keikyu_station_rows.py'
      - 'scripts/keikyu_connected_station_catalog.py'
      - 'scripts/build_keikyu_official_stop_times.py'
      - 'scripts/verify_keikyu_official_stop_times.py'
      - 'scripts/test_keikyu_official_stop_times.py'
      - 'scripts/audit_keikyu_previous_publication_refs.py'
      - 'scripts/test_keikyu_previous_publication_refs.py'
      - 'scripts/build_keikyu_cross_page_identity_audit.py'
      - 'scripts/verify_keikyu_cross_page_identity_audit.py'
      - 'scripts/test_keikyu_cross_page_identity_audit.py'
      - '.github/workflows/update-keikyu-official-through-evidence.yml'
  schedule:
    - cron: '17 20 * * 6'

permissions:
  contents: write

concurrency:
  group: transit-db-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      ODPT_API_KEY: ${{ secrets.ODPT_API_KEY }}
      ODPT_CHALLENGE_API_KEY: ${{ secrets.ODPT_CHALLENGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync checkout to latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install pdfplumber==0.11.7 requests==2.32.5
      - name: Gate on full official Keikyu timetable and cross-page identity audit
        run: |
          python -m py_compile \
            scripts/keikyu_official_pdf.py \
            scripts/audit_keikyu_official_columns.py \
            scripts/audit_keikyu_station_time_resolution.py \
            scripts/keikyu_connected_station_catalog.py \
            scripts/build_keikyu_official_stop_times.py \
            scripts/verify_keikyu_official_stop_times.py \
            scripts/test_keikyu_official_stop_times.py \
            scripts/audit_keikyu_previous_publication_refs.py \
            scripts/test_keikyu_previous_publication_refs.py \
            scripts/build_keikyu_cross_page_identity_audit.py \
            scripts/verify_keikyu_cross_page_identity_audit.py \
            scripts/test_keikyu_cross_page_identity_audit.py
          python scripts/test_keikyu_official_stop_times.py
          python scripts/test_keikyu_previous_publication_refs.py
          python scripts/test_keikyu_cross_page_identity_audit.py
          python scripts/build_keikyu_official_stop_times.py \
            --output /tmp/keikyu-official-stop-times.json
          python scripts/verify_keikyu_official_stop_times.py \
            /tmp/keikyu-official-stop-times.json
          python scripts/audit_keikyu_previous_publication_refs.py \
            --output /tmp/keikyu-previous-publication-refs.json
          python scripts/build_keikyu_cross_page_identity_audit.py \
            /tmp/keikyu-official-stop-times.json \
            /tmp/keikyu-previous-publication-refs.json \
            --output /tmp/keikyu-cross-page-identity-audit.json
          python scripts/verify_keikyu_cross_page_identity_audit.py \
            /tmp/keikyu-cross-page-identity-audit.json
          python - <<'PY'
          import json
          from pathlib import Path

          stop_times = json.loads(Path('/tmp/keikyu-official-stop-times.json').read_text(encoding='utf-8'))
          refs = json.loads(Path('/tmp/keikyu-previous-publication-refs.json').read_text(encoding='utf-8'))
          graph = json.loads(Path('/tmp/keikyu-cross-page-identity-audit.json').read_text(encoding='utf-8'))

          totals = stop_times.get('totals') or {}
          stop_policy = stop_times.get('identityPolicy') or {}
          pages = stop_times.get('pages') or []
          source = int(totals.get('sourceTimeCells') or 0)
          resolved = int(totals.get('resolvedTimeCells') or 0)
          unresolved = int(totals.get('unresolvedTimeCells') or 0)
          fragments = int(totals.get('trainColumnFragments') or 0)
          complete_refs = int(refs.get('completePreviousReferenceCount') or 0)
          unique_refs = int(refs.get('uniqueExplicitReferenceCandidateCount') or 0)
          missing_page_numbers = int(refs.get('pagesWithoutDetectedPrintedPageNumber') or 0)
          statuses = refs.get('targetStatusCounts') or {}
          graph_policy = graph.get('identityPolicy') or {}

          print('FULL_TIMETABLE_PAGES', len(pages))
          print('FULL_TIMETABLE_FRAGMENTS', fragments)
          print('FULL_TIMETABLE_SOURCE_CELLS', source)
          print('FULL_TIMETABLE_RESOLVED_CELLS', resolved)
          print('FULL_TIMETABLE_UNRESOLVED_CELLS', unresolved)
          print('FULL_TIMETABLE_RESOLUTION_RATE', round(resolved / source, 6) if source else 0)
          print('PREVIOUS_REFERENCE_COMPLETE', complete_refs)
          print('PREVIOUS_REFERENCE_UNIQUE', unique_refs)
          print('PRINTED_PAGE_NUMBERS_MISSING', missing_page_numbers)
          print('PREVIOUS_REFERENCE_STATUSES', json.dumps(statuses, ensure_ascii=False, sort_keys=True))
          print('IDENTITY_GRAPH_EDGES', graph.get('materializedCandidateEdgeCount'))
          print('IDENTITY_GRAPH_NODES', graph.get('nodeCount'))
          print('IDENTITY_GRAPH_COMPONENTS', graph.get('identityComponentCount'))
          print('IDENTITY_GRAPH_BRANCHING', len(graph.get('branchingTargets') or {}))
          print('IDENTITY_GRAPH_MULTIPLE_PREVIOUS', len(graph.get('multiplePreviousSources') or {}))
          print('IDENTITY_GRAPH_CYCLES', len(graph.get('cycles') or []))
          print('IDENTITY_GRAPH_ISSUES', len(graph.get('issues') or []))
          print('NEW_RUNTIME_SAME_TRAIN_PROMOTIONS', graph_policy.get('runtimeSameTrainPromotions'))

          assert pages, 'no timetable pages parsed'
          assert fragments > 0, 'no train-column fragments parsed'
          assert source > 0, 'no timetable cells parsed'
          assert resolved > 0, 'no timetable cells semantically resolved'
          assert resolved + unresolved == source, 'source cell accounting mismatch'
          assert stop_policy.get('crossPageIdentityEstablished') is False
          assert stop_policy.get('runtimeSameTrainPromotions') == 0
          assert missing_page_numbers == 0, 'official printed page number missing on parsed page'
          assert complete_refs > 0, 'no official previous-page references found'
          assert unique_refs == complete_refs, 'some complete official previous-page references are unresolved'
          assert set(statuses).issubset({'no-reference', 'unique-explicit-reference-candidate'}), statuses
          assert int(graph.get('candidateReferenceCount') or 0) == complete_refs
          assert int(graph.get('materializedCandidateEdgeCount') or 0) == complete_refs
          assert not graph.get('branchingTargets')
          assert not graph.get('multiplePreviousSources')
          assert not graph.get('cycles')
          assert not graph.get('issues')
          assert graph_policy.get('crossPageIdentityEstablished') is False
          assert graph_policy.get('runtimeSameTrainPromotions') == 0
          PY
      - name: Test fail-closed extraction and consumer rules
        run: |
          python -m py_compile \
            scripts/verify_keikyu_through_materialization.py \
            scripts/repair_keikyu_sengakuji_terminal_idempotent.py \
            scripts/keikyu_internal_official_evidence.py \
            scripts/keikyu_internal_generated_evidence.py \
            scripts/verify_keikyu_internal_materialization.py
          python scripts/test_keikyu_official_train_evidence.py
          python scripts/test_keikyu_generated_evidence.py
          python scripts/test_repair_keikyu_sengakuji_terminal_idempotent.py
          python scripts/test_keikyu_internal_official_evidence.py
          python scripts/test_keikyu_internal_generated_evidence.py
      - name: Repair missing Keikyu inbound Sengakuji board
        run: python scripts/repair_keikyu_sengakuji_terminal_idempotent.py
      - name: Rebuild strict transit v2 fragments
        run: python scripts/build_transit_v2.py
      - name: Extract official weekday and holiday evidence
        run: |
          python scripts/keikyu_official_train_evidence.py --calendar weekday --output /tmp/keikyu-weekday.json
          python scripts/keikyu_official_train_evidence.py --calendar holiday --output /tmp/keikyu-holiday.json
          python scripts/merge_keikyu_official_evidence.py \
            /tmp/keikyu-weekday.json \
            /tmp/keikyu-holiday.json \
            --output data/transit-v2/keikyu-official-train-evidence.json
          python scripts/keikyu_internal_official_evidence.py
      - name: Re-finalize strict transit DB
        run: |
          python scripts/finalize_transit_v2.py
          python scripts/audit_transit_v2.py
      - name: Validate generated same-train edges in both directions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          v2 = Path('data/transit-v2')
          evidence = json.loads((v2 / 'keikyu-official-train-evidence.json').read_text(encoding='utf-8'))
          entries = evidence.get('entries') or []
          edges = json.loads((v2 / 'same-train-edges.json').read_text(encoding='utf-8')).get('edges') or []
          generated = [edge for edge in edges if 'keikyu-official-connection-timetable-same-column' in (edge.get('evidence') or [])]
          runtime = json.loads((v2 / 'runtime-same-train.json').read_text(encoding='utf-8')).get('edges') or []
          coverage = json.loads((v2 / 'coverage.json').read_text(encoding='utf-8'))
          directions = {}
          for row in entries:
              key = str(row.get('direction') or '')
              directions[key] = directions.get(key, 0) + 1
          production_pairs = {(str(row.get('fromFragment') or ''), str(row.get('toFragment') or '')) for row in entries}
          generated_pairs = {(str(row.get('fromFragment') or ''), str(row.get('toFragment') or '')) for row in generated}
          pair_direction = {(str(row.get('fromFragment') or ''), str(row.get('toFragment') or '')): str(row.get('direction') or '') for row in entries}
          generated_directions = {'keikyu-to-toei': 0, 'toei-to-keikyu': 0}
          for pair in generated_pairs:
              direction = pair_direction.get(pair)
              if direction in generated_directions:
                  generated_directions[direction] += 1
          missing_pairs = production_pairs - generated_pairs
          print('PRODUCTION_EVIDENCE', len(entries))
          print('PRODUCTION_DIRECTIONS', directions)
          print('GENERATED_SAME_TRAIN_EDGES', len(generated))
          print('GENERATED_DIRECTIONS', generated_directions)
          print('MISSING_PRODUCTION_PAIRS', len(missing_pairs))
          print('RUNTIME_SAME_TRAIN_EDGES', len(runtime))
          print('COVERAGE', json.dumps(coverage.get('summary') or {}, ensure_ascii=False, indent=2))
          assert entries
          assert generated
          assert directions.get('keikyu-to-toei', 0) > 0
          assert directions.get('toei-to-keikyu', 0) > 0
          assert generated_directions['keikyu-to-toei'] > 0
          assert generated_directions['toei-to-keikyu'] > 0
          assert not missing_pairs
          assert all(row.get('matchStatus') == 'matched-singleton' for row in entries)
          assert all(edge.get('identityLevel') == 'evidence-backed' for edge in generated)
          PY
      - name: Verify route runtime materialization
        run: |
          python scripts/verify_keikyu_through_materialization.py
          python scripts/verify_keikyu_internal_materialization.py
      - name: Commit refreshed strict DB
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/transit/keikyu \
            data/transit-v2/fragments/keikyu.json \
            data/transit-v2/keikyu-official-train-evidence.json \
            data/transit-v2/keikyu-internal-official-train-evidence.json \
            data/transit-v2/same-train-edges.json \
            data/transit-v2/runtime-same-train.json \
            data/transit-v2/coverage.json \
            data/transit-v2/index.json \
            data/transit-v2/unresolved-summary.json
          if git diff --cached --quiet; then
            echo "No intended Keikyu transit DB changes."
            exit 0
          fi
          git commit -m "Refresh Keikyu official through-train evidence"
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev '^data/transit(-v2)?/' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected non-transit working-tree changes after DB commit:"
            echo "$unexpected"
            exit 1
          fi
          git restore --worktree -- data/transit data/transit-v2
          git clean -fd -- data/transit data/transit-v2
          git pull --rebase origin main
          git push origin HEAD:main
