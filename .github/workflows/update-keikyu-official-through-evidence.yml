name: Update Keikyu official through-train DB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_keikyu_sengakuji_terminal.py'
      - 'scripts/repair_keikyu_sengakuji_terminal_idempotent.py'
      - 'scripts/test_repair_keikyu_sengakuji_terminal_idempotent.py'
      - 'scripts/build_transit_v2.py'
      - 'scripts/keikyu_official_train_evidence.py'
      - 'scripts/merge_keikyu_official_evidence.py'
      - 'scripts/keikyu_generated_evidence.py'
      - 'scripts/test_keikyu_official_train_evidence.py'
      - 'scripts/test_keikyu_generated_evidence.py'
      - 'scripts/verify_keikyu_through_materialization.py'
      - 'scripts/keikyu_internal_official_evidence.py'
      - 'scripts/keikyu_internal_generated_evidence.py'
      - 'scripts/test_keikyu_internal_official_evidence.py'
      - 'scripts/test_keikyu_internal_generated_evidence.py'
      - 'scripts/verify_keikyu_internal_materialization.py'
      - 'scripts/reviewed_train_evidence.py'
      - '.github/workflows/update-keikyu-official-through-evidence.yml'
  schedule:
    - cron: '17 20 * * 6'

permissions:
  contents: write

concurrency:
  group: transit-db-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      ODPT_API_KEY: ${{ secrets.ODPT_API_KEY }}
      ODPT_CHALLENGE_API_KEY: ${{ secrets.ODPT_CHALLENGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync checkout to latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pdfplumber==0.11.7 requests==2.32.5
      - name: Test fail-closed extraction and consumer rules
        run: |
          python -m py_compile \
            scripts/verify_keikyu_through_materialization.py \
            scripts/repair_keikyu_sengakuji_terminal_idempotent.py \
            scripts/keikyu_internal_official_evidence.py \
            scripts/keikyu_internal_generated_evidence.py \
            scripts/verify_keikyu_internal_materialization.py
          python scripts/test_keikyu_official_train_evidence.py
          python scripts/test_keikyu_generated_evidence.py
          python scripts/test_repair_keikyu_sengakuji_terminal_idempotent.py
          python scripts/test_keikyu_internal_official_evidence.py
          python scripts/test_keikyu_internal_generated_evidence.py
      - name: Repair missing Keikyu inbound Sengakuji board
        run: python scripts/repair_keikyu_sengakuji_terminal_idempotent.py
      - name: Rebuild strict transit v2 fragments
        run: python scripts/build_transit_v2.py
      - name: Extract official weekday and holiday evidence
        run: |
          python scripts/keikyu_official_train_evidence.py --calendar weekday --output /tmp/keikyu-weekday.json
          python scripts/keikyu_official_train_evidence.py --calendar holiday --output /tmp/keikyu-holiday.json
          python scripts/merge_keikyu_official_evidence.py \
            /tmp/keikyu-weekday.json \
            /tmp/keikyu-holiday.json \
            --output data/transit-v2/keikyu-official-train-evidence.json
          python scripts/keikyu_internal_official_evidence.py
      - name: Re-finalize strict transit DB
        run: |
          python scripts/finalize_transit_v2.py
          python scripts/audit_transit_v2.py
      - name: Validate generated same-train edges in both directions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          v2 = Path('data/transit-v2')
          evidence = json.loads((v2 / 'keikyu-official-train-evidence.json').read_text(encoding='utf-8'))
          entries = evidence.get('entries') or []
          edges = json.loads((v2 / 'same-train-edges.json').read_text(encoding='utf-8')).get('edges') or []
          generated = [edge for edge in edges if 'keikyu-official-connection-timetable-same-column' in (edge.get('evidence') or [])]
          runtime = json.loads((v2 / 'runtime-same-train.json').read_text(encoding='utf-8')).get('edges') or []
          coverage = json.loads((v2 / 'coverage.json').read_text(encoding='utf-8'))
          directions = {}
          for row in entries:
              key = str(row.get('direction') or '')
              directions[key] = directions.get(key, 0) + 1
          production_pairs = {(str(row.get('fromFragment') or ''), str(row.get('toFragment') or '')) for row in entries}
          generated_pairs = {(str(row.get('fromFragment') or ''), str(row.get('toFragment') or '')) for row in generated}
          pair_direction = {(str(row.get('fromFragment') or ''), str(row.get('toFragment') or '')): str(row.get('direction') or '') for row in entries}
          generated_directions = {'keikyu-to-toei': 0, 'toei-to-keikyu': 0}
          for pair in generated_pairs:
              direction = pair_direction.get(pair)
              if direction in generated_directions:
                  generated_directions[direction] += 1
          missing_pairs = production_pairs - generated_pairs
          print('PRODUCTION_EVIDENCE', len(entries))
          print('PRODUCTION_DIRECTIONS', directions)
          print('GENERATED_SAME_TRAIN_EDGES', len(generated))
          print('GENERATED_DIRECTIONS', generated_directions)
          print('MISSING_PRODUCTION_PAIRS', len(missing_pairs))
          print('RUNTIME_SAME_TRAIN_EDGES', len(runtime))
          print('COVERAGE', json.dumps(coverage.get('summary') or {}, ensure_ascii=False, indent=2))
          assert entries
          assert generated
          assert directions.get('keikyu-to-toei', 0) > 0
          assert directions.get('toei-to-keikyu', 0) > 0
          assert generated_directions['keikyu-to-toei'] > 0
          assert generated_directions['toei-to-keikyu'] > 0
          assert not missing_pairs
          assert all(row.get('matchStatus') == 'matched-singleton' for row in entries)
          assert all(edge.get('identityLevel') == 'evidence-backed' for edge in generated)
          PY
      - name: Verify route runtime materialization
        run: |
          python scripts/verify_keikyu_through_materialization.py
          python scripts/verify_keikyu_internal_materialization.py
      - name: Commit refreshed strict DB
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/transit/keikyu \
            data/transit-v2/fragments/keikyu.json \
            data/transit-v2/keikyu-official-train-evidence.json \
            data/transit-v2/keikyu-internal-official-train-evidence.json \
            data/transit-v2/same-train-edges.json \
            data/transit-v2/runtime-same-train.json \
            data/transit-v2/coverage.json \
            data/transit-v2/index.json \
            data/transit-v2/unresolved-summary.json
          if git diff --cached --quiet; then
            echo "No intended Keikyu transit DB changes."
            exit 0
          fi
          git commit -m "Refresh Keikyu official through-train evidence"
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev '^data/transit(-v2)?/' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected non-transit working-tree changes after DB commit:"
            echo "$unexpected"
            exit 1
          fi
          git restore --worktree -- data/transit data/transit-v2
          git clean -fd -- data/transit data/transit-v2
          git pull --rebase origin main
          git push origin HEAD:main
