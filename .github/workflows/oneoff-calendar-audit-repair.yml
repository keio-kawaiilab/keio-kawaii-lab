name: One-off calendar self-healing repair

on:
  push:
    paths:
      - ".github/workflows/oneoff-calendar-audit-repair.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: oneoff-calendar-audit-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch calendar trigger isolation and one-shot recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/update-live-calendar-distributed.yml')
          text = path.read_text(encoding='utf-8')

          # Unrelated transit work under scripts/ must not start/queue calendar refreshes.
          text = text.replace('      - "scripts/**"\n', '')

          # A failed refresh gets one immediate retry. Further failures are left to
          # the watchdog so a deterministic bug cannot create an infinite retry loop.
          if 'recovery_attempt:' not in text:
              text = text.replace(
                  '  workflow_dispatch:\n',
                  '  workflow_dispatch:\n'
                  '    inputs:\n'
                  '      recovery_attempt:\n'
                  '        description: "Internal one-shot recovery attempt"\n'
                  '        required: false\n'
                  '        default: "0"\n',
                  1,
              )

          permissions = 'permissions:\n  contents: write\n  issues: write\n'
          hardened_permissions = 'permissions:\n  contents: write\n  issues: write\n  actions: write\n'
          if hardened_permissions not in text:
              if permissions not in text:
                  raise SystemExit('calendar permissions block not found')
              text = text.replace(permissions, hardened_permissions, 1)

          retry_step = '''\n      - name: Retry failed refresh once\n        if: ${{ github.event_name != 'workflow_dispatch' || inputs.recovery_attempt != '1' }}\n        env:\n          GH_TOKEN: ${{ github.token }}\n        shell: bash\n        run: |\n          echo "Current refresh failed; queueing one immediate recovery attempt on latest main."\n          gh workflow run update-live-calendar-distributed.yml --ref main -f recovery_attempt=1\n'''
          if 'name: Retry failed refresh once' not in text:
              needle = '''          else\n            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"\n          fi\n'''
              pos = text.rfind(needle)
              if pos == -1:
                  raise SystemExit('report-failure insertion point not found')
              end = pos + len(needle)
              text = text[:end] + retry_step + text[end:]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify workflow patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/update-live-calendar-distributed.yml').read_text(encoding='utf-8')
          assert '- "scripts/**"' not in text
          assert 'recovery_attempt:' in text
          assert 'name: Retry failed refresh once' in text
          assert 'actions: write' in text
          print('calendar self-healing workflow patch verified')
          PY

      - name: Commit self-healing repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/update-live-calendar-distributed.yml; then
            echo "Self-healing repair already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/update-live-calendar-distributed.yml
          git commit -m "Harden calendar refresh self-recovery"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
