name: One-off calendar audit repair

on:
  push:
    paths:
      - ".github/workflows/oneoff-calendar-audit-repair.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: oneoff-calendar-audit-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm quarantine convergence budget
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/audit_schedule_release_grouped.py")
          text = path.read_text(encoding="utf-8")
          old = "def repair_local_errors(previous: dict, candidate: dict, now: datetime, max_rounds: int = 6):"
          new = "def repair_local_errors(previous: dict, candidate: dict, now: datetime, max_rounds: int = 64):"
          if new not in text:
              if old not in text:
                  raise SystemExit("expected repair_local_errors signature not found")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Run grouped release tests
        run: python scripts/test_audit_schedule_release_grouped.py

      - name: Commit repair if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/audit_schedule_release_grouped.py; then
            echo "Repair already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit_schedule_release_grouped.py
          git commit -m "Fix calendar quarantine convergence"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1

      - name: Dispatch distributed calendar refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-live-calendar-distributed.yml --ref main
