name: Preserve identity-only timetable fragments

on:
  push:
    paths:
      - '.github/workflows/advance-transit-v2-boundaries.yml'

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve exact one-stop timetable fragments
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/import_odpt_timetables.py')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)

          found_short = False
          found_zero = False
          for i in range(len(lines) - 1):
              if lines[i] == '        if len(stops) < 2:\n' and lines[i + 1] == '            continue\n':
                  lines[i:i+2] = [
                      '        # Keep one-stop exact timetable fragments. They cannot provide a\n',
                      '        # ride edge by themselves, but ODPT previous/nextTrainTimetable\n',
                      '        # can use them as authoritative same-train identity bridges.\n',
                      '        if not stops:\n',
                      '            continue\n',
                  ]
                  found_short = True
                  break
          if not found_short:
              raise SystemExit('short-stop filter not found')

          for i in range(len(lines) - 1):
              if lines[i] == '        if not usable_connections:\n' and lines[i + 1] == '            continue\n':
                  del lines[i:i+2]
                  found_zero = True
                  break
          if not found_zero:
              raise SystemExit('zero-connection filter not found')
          path.write_text(''.join(lines), encoding='utf-8')

          test = Path('scripts/test_import_odpt_timetables.py')
          text = test.read_text(encoding='utf-8')
          marker = '    def test_station_timetables_are_joined_into_trips(self):\n'
          if marker not in text:
              raise SystemExit('test insertion marker not found')
          addition = '''    def test_compact_line_timetable_keeps_single_stop_identity_fragment(self):
              item = {
                  "odpt:calendar": "odpt.Calendar:Weekday",
                  "odpt:trainType": "odpt.TrainType:Test.Local",
                  "odpt:trainNumber": "6752",
                  "owl:sameAs": "odpt.TrainTimetable:Test.Main.6752.Weekday",
                  "odpt:train": "odpt.Train:Test.6752",
                  "odpt:destinationStation": ["station:through-destination"],
                  "odpt:trainTimetableObject": [
                      {"odpt:departureStation": "station:boundary", "odpt:departureTime": "10:00"},
                  ],
              }
              compact, connections = importer.compact_line_timetable("railway:test", [item])
              self.assertEqual(connections, 0)
              self.assertEqual(len(compact["trips"]), 1)
              self.assertEqual(compact["trips"][0][3], [[0, None, 600]])
              self.assertEqual(compact["trips"][0][4], "station:through-destination")
              self.assertEqual(compact["trips"][0][5], "odpt.Train:Test.6752")
              self.assertEqual(compact["trips"][0][6], "odpt.TrainTimetable:Test.Main.6752.Weekday")

          '''
          text = text.replace(marker, addition + marker, 1)
          test.write_text(text, encoding='utf-8')
          PY
      - name: Validate importer behavior
        run: |
          python -m py_compile scripts/import_odpt_timetables.py scripts/test_import_odpt_timetables.py
          python scripts/test_import_odpt_timetables.py
      - name: Commit importer fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/import_odpt_timetables.py scripts/test_import_odpt_timetables.py
          git commit -m "Preserve identity-only timetable fragments"
          git pull --rebase origin main
          git push origin HEAD:main
