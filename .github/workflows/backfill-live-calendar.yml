name: Backfill live ticket calendar

on:
  pull_request:
    paths:
      - "scripts/update_live_events_deep.py"
      - "scripts/test_update_live_events_deep.py"
      - ".github/workflows/backfill-live-calendar.yml"
  push:
    branches:
      - "feature/live-ticket-calendar"
    paths:
      - "scripts/update_live_events_deep.py"
      - "scripts/test_update_live_events_deep.py"
      - ".github/workflows/backfill-live-calendar.yml"
  schedule:
    - cron: "41 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backfill-live-ticket-calendar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run deep discovery tests
        working-directory: scripts
        run: python -m unittest -v test_update_live_events_deep.py test_update_live_events_v2.py test_sanitize_live_events.py

      - name: Verify deep official-source scan on pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/update_live_events_deep.py --check

      - name: Deep backfill calendar data
        if: github.event_name != 'pull_request'
        run: |
          python scripts/update_live_events_deep.py
          python scripts/sanitize_live_events.py

      - name: Commit when data changed
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- data/live-events.json; then
            echo "No deep-backfill changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-events.json
          git commit -m "chore: deep backfill live ticket calendar"
          git push
