name: Backfill live ticket calendar

on:
  pull_request:
    paths:
      - "scripts/update_live_events_deep.py"
      - "scripts/update_sukisuki_events.py"
      - "scripts/test_update_live_events_deep.py"
      - ".github/workflows/backfill-live-calendar.yml"
  push:
    branches:
      - "feature/live-ticket-calendar"
    paths:
      - "scripts/update_live_events_deep.py"
      - "scripts/update_sukisuki_events.py"
      - "scripts/test_update_live_events_deep.py"
      - ".github/workflows/backfill-live-calendar.yml"
  schedule:
    - cron: "41 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Production backfill writes the same canonical schedule data as the regular
# publisher and therefore shares its lock. Pull-request validation is read-only,
# so keep it on a separate lock and never let development checks block ingestion.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('backfill-pr-{0}', github.event.pull_request.number) || 'distributed-live-calendar' }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run deep discovery tests
        working-directory: scripts
        run: python -m unittest -v test_update_live_events_deep.py test_update_live_events_v2.py test_sanitize_live_events.py

      - name: Verify deep official and SUKISUKI source scan on pull requests
        if: github.event_name == 'pull_request'
        run: |
          python scripts/update_live_events_deep.py --check
          python scripts/update_sukisuki_events.py --check

      - name: Deep backfill calendar data
        if: github.event_name != 'pull_request'
        run: |
          python scripts/update_live_events_deep.py
          python scripts/update_sukisuki_events.py
          python scripts/sanitize_live_events.py
          python scripts/update_official_schedule.py
          python scripts/apply_event_scopes.py
          python scripts/audit_official_schedule_coverage.py

      - name: Commit when data changed
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- data/live-events.json data/official-schedule-index.json; then
            echo "No deep-backfill changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-events.json data/official-schedule-index.json
          git commit -m "chore: deep backfill live ticket calendar"
          git push
