name: Verify Yahoo reviewed transit evidence

on:
  push:
    branches:
      - 'work/yahoo-reviewed-evidence-20260924'
    paths:
      - 'scripts/reviewed_train_evidence.py'
      - 'scripts/test_reviewed_train_evidence.py'
      - 'data/transit-v2/reviewed-train-evidence.json'
      - '.github/workflows/verify-yahoo-reviewed-evidence.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test reviewed evidence logic
        run: |
          python -m py_compile scripts/reviewed_train_evidence.py scripts/finalize_transit_v2.py scripts/audit_transit_v2.py
          python scripts/test_reviewed_train_evidence.py
      - name: Rebuild strict identity snapshot
        run: |
          python scripts/finalize_transit_v2.py
          python scripts/audit_transit_v2.py
      - name: Require seven exact Yahoo-reviewed promotions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          v2 = Path('data/transit-v2')
          coverage = json.loads((v2 / 'coverage.json').read_text(encoding='utf-8'))
          audit = json.loads((v2 / 'unresolved-summary.json').read_text(encoding='utf-8'))
          edges = json.loads((v2 / 'same-train-edges.json').read_text(encoding='utf-8')).get('edges') or []

          expected = {
              'odakyu-enoshima-0801-weekday-yahoo',
              'odakyu-enoshima-1810-weekday-yahoo',
              'odakyu-tama-2032-weekday-yahoo',
              'odakyu-tama-1718-weekday-yahoo',
              'seibu-haijima-0512-weekday-yahoo',
              'seibu-haijima-1610-weekday-yahoo',
              'seibu-haijima-liner7-2015-weekday-yahoo',
          }
          yahoo_edges = [
              edge for edge in edges
              if (edge.get('evidence') or [None])[0] == 'third-party-route-result:yahoo-transit-zero-transfer'
          ]
          ids = {str((edge.get('evidence') or ['', ''])[1]) for edge in yahoo_edges}
          assert ids == expected, (ids, expected)
          assert len(yahoo_edges) == 7, len(yahoo_edges)
          assert int(coverage['summary']['unresolved']) == 3808, coverage['summary']
          assert int(audit['totalUnresolved']) == 3808, audit['totalUnresolved']
          assert not [
              row for row in coverage.get('unresolved') or []
              if str(row.get('evidenceId') or '') in expected
          ]
          print(json.dumps({
              'unresolved': coverage['summary']['unresolved'],
              'yahooReviewedEdges': len(yahoo_edges),
              'evidenceIds': sorted(ids),
          }, ensure_ascii=False, indent=2))
          PY
