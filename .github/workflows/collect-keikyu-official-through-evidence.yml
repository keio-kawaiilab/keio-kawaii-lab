name: Collect Keikyu official through-train evidence

on:
  pull_request:
    paths:
      - 'scripts/keikyu_official_train_evidence.py'
      - 'scripts/test_keikyu_official_train_evidence.py'
      - '.github/workflows/collect-keikyu-official-through-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: pip install pdfplumber==0.11.7 requests==2.32.5
      - name: Test fail-closed extraction rules
        run: python scripts/test_keikyu_official_train_evidence.py
      - name: Extract current weekday Sengakuji evidence
        run: |
          python scripts/keikyu_official_train_evidence.py \
            --calendar weekday \
            --output /tmp/keikyu-official-train-evidence.json
      - name: Audit extraction result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/keikyu-official-train-evidence.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          summary=data.get('summary') or {}
          entries=data.get('entries') or []
          print('SUMMARY', json.dumps(summary, ensure_ascii=False, indent=2))
          print('SAMPLE', json.dumps(entries[:12], ensure_ascii=False, indent=2))
          assert int(summary.get('officialColumnCandidates') or 0) > 0, summary
          # Matching may legitimately remain zero if the current compact fragment
          # set does not expose a singleton on one side. That must fail closed,
          # not be promoted from time or train number alone.
          for row in entries:
              if row.get('matchStatus') == 'matched-singleton':
                  assert row.get('fromFragment') and row.get('toFragment'), row
                  assert row.get('boundaryId') == 'toei-keikyu-sengakuji', row
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: keikyu-official-through-evidence
          path: /tmp/keikyu-official-train-evidence.json
          if-no-files-found: error
