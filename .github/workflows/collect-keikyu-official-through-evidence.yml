name: Collect Keikyu official through-train evidence
on:
  pull_request:
    paths:
      - 'scripts/*keikyu*'
      - 'scripts/*sengakuji*'
      - 'data/transit-v2/**'
      - '.github/workflows/collect-keikyu-official-through-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source parser dependencies
        run: pip install pdfplumber==0.11.7 PyMuPDF==1.26.4 requests==2.32.5
      - name: Test strict identity and rejection of legacy same-column evidence
        run: |
          python -m unittest discover -s scripts -p 'test_keikyu_*.py'
          python scripts/test_sengakuji_independent_reconciliation.py
      - name: Validate all current published columns before materialization
        run: python scripts/verify_sengakuji_runtime.py --verify-current-source
      - name: Re-materialize exact evidence and verify every positive and negative
        run: |
          python scripts/finalize_transit_v2.py
          python scripts/audit_transit_v2.py
          python scripts/verify_sengakuji_runtime.py
          python scripts/verify_keikyu_internal_materialization.py
          node scripts/test_keikyu_internal_routes.js
          node scripts/test_route_runtime_same_train.js
      - uses: actions/upload-artifact@v4
        with:
          name: keikyu-official-through-evidence
          path: |
            docs/transit/sengakuji-published-sequence-audit.json
            docs/transit/sengakuji-unfiltered-column-audit.json
            data/transit-v2/same-train-edges.json
            data/transit-v2/runtime-same-train.json
            data/transit-v2/coverage.json
          if-no-files-found: error
