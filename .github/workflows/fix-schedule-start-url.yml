name: Fix schedule home screen start URL

on:
  push:
    paths:
      - '.github/workflows/fix-schedule-start-url.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point schedule page to its own manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('schedule.html')
          s = p.read_text(encoding='utf-8')
          old = '<link rel="manifest" href="./site.webmanifest">'
          new = '<link rel="manifest" href="./schedule.webmanifest">'
          if old not in s and new not in s:
              raise SystemExit('manifest link not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -F '<link rel="manifest" href="./schedule.webmanifest">' schedule.html
          grep -F '"start_url": "/keio-kawaii-lab/schedule.html"' schedule.webmanifest
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-schedule-start-url.yml
          git add schedule.html schedule.webmanifest
          git commit -m 'Open schedule when launched from home screen [skip ci]'
          git push
