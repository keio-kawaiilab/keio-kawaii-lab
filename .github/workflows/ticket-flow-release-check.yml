name: Ticket flow release check

on:
  push:
    branches: [main]
    paths:
      - "ticket-flow.js"
      - "ticket-flow-sync.js"
      - "scripts/test_ticket_flow_sync_aliases.js"
      - "ticket-resale-ui.js"
      - "going-highlight-soften.js"
      - "train-status.js"
      - "scripts/build_schedule_snapshot.py"
      - ".github/workflows/update-resale-fast.yml"
      - "scripts/test_ticket_resale_ui.js"
      - "scripts/test_archive_ticket_history.py"
      - "scripts/archive_ticket_history.py"
      - "scripts/test_ticket_flow_history_runtime.js"
      - ".github/workflows/ticket-flow-release-check.yml"
  pull_request:
    paths:
      - "ticket-flow.js"
      - "ticket-resale-ui.js"
      - "going-highlight-soften.js"
      - "train-status.js"
      - "scripts/build_schedule_snapshot.py"
      - ".github/workflows/update-resale-fast.yml"
      - "scripts/test_ticket_resale_ui.js"
      - "scripts/archive_ticket_history.py"
      - "scripts/test_archive_ticket_history.py"
      - "ticket-flow.css"
      - "going-highlight-soften.js"
      - "scripts/test_ticket_flow_release.py"
      - ".github/workflows/ticket-flow-release-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check JavaScript syntax
        run: |
          node --check ticket-flow.js
          node --check ticket-flow-sync.js
          node --check ticket-resale-ui.js
          node --check going-highlight-soften.js

      - name: Verify additive fail-closed release guards
        run: python -m unittest -v scripts.test_ticket_flow_release

      - name: Verify history independent of application visibility
        run: |
          node scripts/test_ticket_flow_history_runtime.js
          node scripts/test_ticket_flow_sync_aliases.js

      - name: Verify presale category and source-backed history retraction
        env:
          PYTHONPATH: scripts
        run: |
          node scripts/test_ticket_resale_ui.js
          python -m unittest -v test_archive_ticket_history

