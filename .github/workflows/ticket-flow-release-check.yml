name: Ticket flow release check

on:
  pull_request:
    paths:
      - "ticket-flow.js"
      - "ticket-flow.css"
      - "going-highlight-soften.js"
      - "scripts/test_ticket_flow_release.py"
      - ".github/workflows/ticket-flow-release-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check JavaScript syntax
        run: |
          node --check ticket-flow.js
          node --check going-highlight-soften.js

      - name: Verify additive fail-closed release guards
        run: python -m unittest -v scripts.test_ticket_flow_release
