name: Distributed live ticket calendar

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-live-calendar-distributed.yml"
      - "data/live-events.json"
      - "data/official-schedule-index.json"
      - "scripts/continuous_official_discovery.py"
      - "scripts/update_live_events*.py"
      - "scripts/update_official_schedule*.py"
      - "scripts/update_playguide_events*.py"
      - "scripts/sanitize_live_events.py"
      - "scripts/resolve_source_priority.py"
      - "scripts/reapply_calendar_observations.py"
      - "scripts/audit_discovery_publication.py"
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: distributed-live-calendar
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.base.outputs.base_sha }}
      frozen: ${{ steps.freeze.outputs.frozen }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Pin one base revision for every collector
        id: base
        run: echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read emergency freeze control
        id: freeze
        shell: bash
        run: |
          frozen="$(python - <<'PY'
          import json
          from pathlib import Path

          controls = (
              (Path('data/schedule-control.json'), 'freeze'),
              (Path('data/schedule-refresh-freeze.json'), 'frozen'),
          )
          for path, key in controls:
              if not path.exists():
                  continue
              try:
                  payload = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  raise SystemExit(f'invalid freeze control: {path}')
              if payload.get(key) is True:
                  print('true')
                  break
          else:
              print('false')
          PY
          )"
          echo "frozen=$frozen" >> "$GITHUB_OUTPUT"

  collect-core:
    needs: prepare
    if: needs.prepare.outputs.frozen != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    outputs:
      degraded: ${{ steps.collect.outputs.degraded }}
    steps:
      - name: Checkout pinned base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Test official schedule auto-add and parallel collector
        working-directory: scripts
        run: python -m unittest -v test_update_official_schedule.py test_update_official_schedule_parallel.py test_update_live_events_v2.py test_continuous_official_discovery.py test_reapply_calendar_observations.py

      - name: Collect official, PIA and official schedule data
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          degraded=""
          mark_degraded() {
            degraded="${degraded}${degraded:+,}$1"
          }
          cp data/live-events.json /tmp/live-events-last-good.json
          cp data/live-events.json /tmp/live-events-before-pia.json

          # Network/source failures and hung requests are isolated to that source.
          # A timed-out source falls back to its previous known-good rows while
          # unrelated collectors continue and remain publishable.
          if ! timeout --signal=TERM --kill-after=10s 420s python scripts/update_live_events_v2.py; then
            echo "::warning::Core official fetch failed or timed out; retaining previous official rows for this refresh."
            cp /tmp/live-events-last-good.json data/live-events.json
            mark_degraded "group-official-news"
          fi
          if python -c 'import json; d=json.load(open("data/live-events.json")).get("ticketCollectorDiagnostics") or {}; raise SystemExit(0 if d.get("failureCount") or d.get("pendingReview") else 1)'; then
            mark_degraded "official-news-partial"
          fi

          cp data/live-events.json /tmp/live-events-before-pia.json
          python scripts/clean_pia_refresh.py --drop-all
          python scripts/sanitize_live_events.py
          python scripts/enrich_official_performance_times.py
          python scripts/enrich_event_metadata.py

          if ! timeout --signal=TERM --kill-after=10s 90s python scripts/update_pia_events.py; then
            echo "::warning::PIA fetch failed or timed out; retaining the previous PIA snapshot."
            cp /tmp/live-events-before-pia.json data/live-events.json
            mark_degraded "pia"
          else
            python scripts/reconcile_pia_retention.py --previous /tmp/live-events-before-pia.json
          fi
          python scripts/harden_pia_events.py
          python scripts/resolve_source_priority.py
          python scripts/enrich_event_metadata.py
          python scripts/harden_pia_events.py --check

          cp data/live-events.json /tmp/live-events-before-official-schedule.json
          cp data/official-schedule-index.json /tmp/official-schedule-index-before-refresh.json
          if ! timeout --signal=TERM --kill-after=10s 180s python scripts/update_official_schedule_parallel.py --workers 10; then
            echo "::warning::Official schedule fetch failed or timed out; retaining the previous official schedule source while publishing other sources."
            cp /tmp/live-events-before-official-schedule.json data/live-events.json
            cp /tmp/official-schedule-index-before-refresh.json data/official-schedule-index.json
            mark_degraded "group-official-schedule"
          fi
          if python -c 'import json; d=json.load(open("data/official-schedule-index.json")); raise SystemExit(0 if d.get("failures") else 1)'; then
            mark_degraded "official-schedule-partial"
          fi

          python scripts/apply_event_scopes.py
          python scripts/prepare_release_candidate.py --previous /tmp/live-events-last-good.json
          echo "degraded=$degraded" >> "$GITHUB_OUTPUT"

      - name: Upload core snapshot
        uses: actions/upload-artifact@v4
        with:
          name: calendar-core-snapshot
          path: |
            data/live-events.json
            data/official-schedule-index.json
            data/official-discovery-state.json
            data/ticket-history.json
          retention-days: 1
          if-no-files-found: error

  collect-playguide:
    needs: prepare
    if: needs.prepare.outputs.frozen != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      degraded: ${{ steps.collect.outputs.degraded }}
    steps:
      - name: Checkout pinned base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Test and collect playguides in parallel
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          cd scripts
          python -m unittest -v test_update_playguide_events.py test_update_playguide_events_parallel.py
          cd ..

          cp data/live-events.json /tmp/live-events-before-playguide.json
          playguide_ok=false
          for attempt in 1 2; do
            echo "Parallel playguide attempt ${attempt}/2"
            if ! timeout --signal=TERM --kill-after=10s 90s python scripts/update_playguide_events_parallel.py --workers 10; then
              echo "::warning::Playguide collector attempt ${attempt} failed or timed out."
              cp /tmp/live-events-before-playguide.json data/live-events.json
              if [ "$attempt" = "1" ]; then sleep 15; fi
              continue
            fi

            playguide_ok=true
            failure_count="$(python - <<'PY'
          import json
          with open('data/live-events.json', encoding='utf-8') as f:
              d = json.load(f).get('playguideDiagnostics') or {}
          print(len(d.get('failures') or []))
          PY
            )"
            if [ "$failure_count" = "0" ]; then break; fi
            if [ "$attempt" = "1" ]; then sleep 15; fi
          done

          if [ "$playguide_ok" != "true" ]; then
            echo "::warning::All playguide attempts failed; retaining the previous playguide snapshot while other sources continue."
            cp /tmp/live-events-before-playguide.json data/live-events.json
            echo "degraded=playguides" >> "$GITHUB_OUTPUT"
          elif ! python scripts/audit_playguide_collection.py; then
            echo "::warning::Some playguide sources are degraded; collector retained their previous rows while healthy provider updates remain publishable."
            echo "degraded=playguides" >> "$GITHUB_OUTPUT"
          elif python -c 'import json; d=json.load(open("data/live-events.json")).get("playguideDiagnostics") or {}; raise SystemExit(0 if d.get("failureCount") or d.get("stillActiveMissingCount") else 1)'; then
            echo "degraded=playguides-partial" >> "$GITHUB_OUTPUT"
          else
            echo "degraded=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload playguide snapshot
        uses: actions/upload-artifact@v4
        with:
          name: calendar-playguide-snapshot
          path: data/live-events.json
          retention-days: 1
          if-no-files-found: error

  collect-sukisuki:
    needs: prepare
    if: needs.prepare.outputs.frozen != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      degraded: ${{ steps.collect.outputs.degraded }}
    steps:
      - name: Checkout pinned base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Test and collect SUKISUKI data
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          cd scripts
          python -m unittest -v test_update_sukisuki_events.py test_update_sukisuki_events_parallel.py
          cd ..
          cp data/live-events.json /tmp/live-events-before-sukisuki.json
          if ! timeout --signal=TERM --kill-after=10s 120s python scripts/update_sukisuki_events_parallel.py --workers 5; then
            echo "::warning::SUKISUKI fetch failed or timed out; retaining its previous known-good rows while other sources continue."
            cp /tmp/live-events-before-sukisuki.json data/live-events.json
            echo "degraded=sukisuki" >> "$GITHUB_OUTPUT"
          else
            echo "degraded=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SUKISUKI snapshot
        uses: actions/upload-artifact@v4
        with:
          name: calendar-sukisuki-snapshot
          path: data/live-events.json
          retention-days: 1
          if-no-files-found: error

  collect-special:
    needs: prepare
    if: needs.prepare.outputs.frozen != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      degraded: ${{ steps.collect.outputs.degraded }}
    steps:
      - name: Checkout pinned base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Test and collect special-event data
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          cd scripts
          python -m unittest -v test_update_special_events.py test_update_official_x_events.py
          cd ..
          degraded=""
          cp data/live-events.json /tmp/live-events-before-special.json
          if ! timeout --signal=TERM --kill-after=10s 120s python scripts/update_special_events.py; then
            echo "::warning::Special-event fetch failed or timed out; retaining its previous known-good rows."
            cp /tmp/live-events-before-special.json data/live-events.json
            degraded="special-events"
          fi

          cp data/live-events.json /tmp/live-events-before-official-x.json
          if ! timeout --signal=TERM --kill-after=10s 120s python scripts/update_official_x_events.py; then
            echo "::warning::Official X fallback fetch failed or timed out; retaining its previous known-good rows."
            cp /tmp/live-events-before-official-x.json data/live-events.json
            degraded="${degraded}${degraded:+,}official-x"
          fi
          echo "degraded=$degraded" >> "$GITHUB_OUTPUT"

      - name: Upload special-event snapshot
        uses: actions/upload-artifact@v4
        with:
          name: calendar-special-snapshot
          path: data/live-events.json
          retention-days: 1
          if-no-files-found: error

  merge-publish:
    needs: [prepare, collect-core, collect-playguide, collect-sukisuki, collect-special]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.frozen != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned base
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Preserve previous release for fail-closed audit
        shell: bash
        run: |
          cp data/live-events.json /tmp/live-events-last-good.json
          if [ -f data/official-schedule-index.json ]; then
            cp data/official-schedule-index.json /tmp/official-schedule-index-last-good.json
          else
            echo '{"entries":[],"groups":{}}' > /tmp/official-schedule-index-last-good.json
          fi
          mkdir -p /tmp/calendar-base
          cp data/live-events.json data/official-schedule-index.json data/ticket-history.json /tmp/calendar-base/

      - name: Seed last-known-good fallback for every collector
        shell: bash
        run: |
          set -euo pipefail
          for source in core playguide sukisuki special; do
            mkdir -p "/tmp/calendar-${source}"
            cp /tmp/live-events-last-good.json "/tmp/calendar-${source}/live-events.json"
          done
          cp /tmp/official-schedule-index-last-good.json /tmp/calendar-core/official-schedule-index.json

      - name: Download core snapshot when available
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: calendar-core-snapshot
          path: /tmp/calendar-core

      - name: Download playguide snapshot when available
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: calendar-playguide-snapshot
          path: /tmp/calendar-playguide

      - name: Download SUKISUKI snapshot when available
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: calendar-sukisuki-snapshot
          path: /tmp/calendar-sukisuki

      - name: Download special-event snapshot when available
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: calendar-special-snapshot
          path: /tmp/calendar-special

      - name: Report collector isolation boundary
        shell: bash
        env:
          CORE_RESULT: ${{ needs.collect-core.result }}
          PLAYGUIDE_RESULT: ${{ needs.collect-playguide.result }}
          SUKISUKI_RESULT: ${{ needs.collect-sukisuki.result }}
          SPECIAL_RESULT: ${{ needs.collect-special.result }}
        run: |
          set -euo pipefail
          for item in \
            "core:$CORE_RESULT" \
            "playguide:$PLAYGUIDE_RESULT" \
            "sukisuki:$SUKISUKI_RESULT" \
            "special:$SPECIAL_RESULT"; do
            source="${item%%:*}"
            result="${item#*:}"
            if [ "$result" != "success" ]; then
              echo "::warning::Collector ${source} ended as ${result}; only that source uses the last-known-good fallback."
            fi
          done

      - name: Merge source snapshots and reconnect official index
        shell: bash
        run: |
          set -euo pipefail
          cd scripts
          python -m unittest -v test_merge_distributed_schedule_snapshots.py test_reconcile_official_schedule_index.py test_audit_schedule_release_grouped.py test_prepare_release_candidate.py test_schedule_scope.py test_audit_official_schedule_coverage.py test_promoter_general_sale_guard.py test_audit_ticket_sources.py
          cd ..
          cp /tmp/calendar-core/official-schedule-index.json data/official-schedule-index.json
          if [ -f /tmp/calendar-core/ticket-history.json ]; then
            cp /tmp/calendar-core/ticket-history.json data/ticket-history.json
          fi
          if [ -f /tmp/calendar-core/official-discovery-state.json ]; then
            cp /tmp/calendar-core/official-discovery-state.json data/official-discovery-state.json
          elif [ ! -f data/official-discovery-state.json ]; then
            echo '{"status":"degraded","failureCount":1,"failures":[{"error":"Core discovery snapshot unavailable"}],"observations":[]}' > data/official-discovery-state.json
          fi
          python scripts/merge_distributed_schedule_snapshots.py \
            --core /tmp/calendar-core/live-events.json \
            --playguide /tmp/calendar-playguide/live-events.json \
            --sukisuki /tmp/calendar-sukisuki/live-events.json \
            --special /tmp/calendar-special/live-events.json \
            --output data/live-events.json \
            --report /tmp/distributed-merge.json
          python scripts/resolve_source_priority.py
          python scripts/enrich_event_metadata.py
          python scripts/apply_event_scopes.py
          # Promoter pages are matched against the freshly merged canonical
          # performance list. This is part of every 15-minute discovery pass,
          # not a once-daily birthday-only repair.
          python scripts/promoter_general_sale_guard.py
          python scripts/prepare_release_candidate.py --previous /tmp/live-events-last-good.json
          python scripts/reconcile_official_schedule_index.py \
            --data data/live-events.json \
            --index data/official-schedule-index.json \
            --report /tmp/official-index-reconcile.json

      - name: Integrated release audit with event-level isolation
        shell: bash
        run: |
          if ! python scripts/audit_playguide_collection.py; then
            echo "::warning::Merged playguide source-health is degraded; event-level release isolation remains authoritative for public data."
          fi
          python scripts/audit_schedule_release_grouped.py \
            --previous /tmp/live-events-last-good.json \
            --candidate data/live-events.json \
            --report data/schedule-health.json
          python scripts/audit_official_schedule_coverage.py \
            --previous-index /tmp/official-schedule-index-last-good.json
          python scripts/archive_ticket_history.py
          python scripts/audit_ticket_sources.py --report /tmp/ticket-source-audit.json
          # Record complete source/history coverage without freezing unrelated
          # healthy updates on a transient endpoint failure.
          python scripts/audit_ticket_collection_continuity.py \
            --report data/ticket-collection-health.json \
            --no-fail

      - name: Build final public schedule
        run: |
          python scripts/build_schedule_snapshot.py
          python scripts/fix_schedule_shell.py
          python scripts/strip_schedule_explanations.py
          node --check /tmp/schedule-inline.js
          node scripts/test_schedule_band_grouping.js
          node scripts/test_schedule_scope_ui.js
          python scripts/build_live_runtime_fallback.py
          python scripts/audit_discovery_publication.py

      - name: Commit one audited integrated release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/calendar-collected
          cp data/live-events.json data/official-schedule-index.json data/ticket-history.json data/ticket-collection-health.json /tmp/calendar-collected/
          if [ -f data/official-discovery-state.json ]; then cp data/official-discovery-state.json /tmp/calendar-collected/; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              # Collected observations remain in /tmp. Reapply their structured
              # delta on latest main, then rebuild and audit the resulting UI.
              git reset --hard origin/main
              cp data/live-events.json /tmp/calendar-latest-main.json
              python scripts/reapply_calendar_observations.py --base /tmp/calendar-base --collected /tmp/calendar-collected
              python scripts/reconcile_official_schedule_index.py
              python scripts/audit_schedule_release_grouped.py --previous /tmp/calendar-latest-main.json --candidate data/live-events.json --report data/schedule-health.json
              python scripts/build_schedule_snapshot.py
              python scripts/fix_schedule_shell.py
              python scripts/strip_schedule_explanations.py
              python scripts/archive_ticket_history.py
              python scripts/build_live_runtime_fallback.py
              python scripts/audit_discovery_publication.py
              node --check /tmp/schedule-inline.js
              node scripts/test_schedule_band_grouping.js
              node scripts/test_schedule_scope_ui.js
            fi
            git add data/live-events.json data/official-schedule-index.json data/schedule-health.json data/ticket-history.json data/ticket-collection-health.json data/official-discovery-state.json data/discovery-publication-health.json schedule.html live-runtime-fallback.js
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore: publish distributed audited calendar"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "Unable to publish integrated calendar after 4 attempts."
          exit 1

      - name: Close resolved distributed incident after publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="🚨 Distributed schedule refresh blocked"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "統合処理・監査・mainへの公開が完了しました。取得元の未解決事項は別途保持します。"
          fi

  report-source-health:
    needs: [prepare, collect-core, collect-playguide, collect-sukisuki, collect-special, merge-publish]
    if: always() && needs.prepare.outputs.frozen != 'true' && needs.merge-publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Track source-level fallbacks
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_DEGRADED: ${{ needs.collect-core.outputs.degraded }}
          PLAYGUIDE_DEGRADED: ${{ needs.collect-playguide.outputs.degraded }}
          SUKISUKI_DEGRADED: ${{ needs.collect-sukisuki.outputs.degraded }}
          SPECIAL_DEGRADED: ${{ needs.collect-special.outputs.degraded }}
          CORE_RESULT: ${{ needs.collect-core.result }}
          PLAYGUIDE_RESULT: ${{ needs.collect-playguide.result }}
          SUKISUKI_RESULT: ${{ needs.collect-sukisuki.result }}
          SPECIAL_RESULT: ${{ needs.collect-special.result }}
        shell: bash
        run: |
          set -euo pipefail
          degraded="$(printf '%s\n' \
            "$CORE_DEGRADED" \
            "$PLAYGUIDE_DEGRADED" \
            "$SUKISUKI_DEGRADED" \
            "$SPECIAL_DEGRADED" \
            | sed '/^$/d' | paste -sd, -)"

          append_degraded() {
            degraded="${degraded}${degraded:+,}$1"
          }
          [ "$CORE_RESULT" = "success" ] || append_degraded "collector-core-job"
          [ "$PLAYGUIDE_RESULT" = "success" ] || append_degraded "collector-playguide-job"
          [ "$SUKISUKI_RESULT" = "success" ] || append_degraded "collector-sukisuki-job"
          [ "$SPECIAL_RESULT" = "success" ] || append_degraded "collector-special-job"

          title="⚠️ Calendar source fallback active"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"

          if [ -n "$degraded" ]; then
            body="取得失敗または解析未解決の情報が残っています。該当範囲は前回データ・再試行対象を保持し、取得できた最新情報は公開しました。次回以降も15分ごとに再試行します。詳細はdata/official-discovery-state.jsonとdata/discovery-publication-health.jsonに記録しています。\n\ndegraded sources: ${degraded}\nrun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "全取得元の正常完了を確認しました。"
          fi

  report-failure:
    needs: [prepare, collect-core, collect-playguide, collect-sukisuki, collect-special, merge-publish]
    if: always() && (needs.prepare.result == 'failure' || needs.merge-publish.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Open or update incident issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="🚨 Distributed schedule refresh blocked"
          body="個別データではなく、統合・生成・公開などシステム全体の処理が失敗しました。Actions run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
