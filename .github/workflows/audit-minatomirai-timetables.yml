name: Audit Minatomirai timetables

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_minatomirai_downbound.py'
      - 'scripts/reconstruct_minatomirai_weekday_downbound.py'
      - 'scripts/reconstruct_minatomirai_weekday_downbound_v2.py'
      - 'scripts/reconstruct_minatomirai_weekday_downbound_v3.py'
      - 'scripts/reconstruct_minatomirai_weekday_downbound_v4.py'
      - 'scripts/reconstruct_shintakashima_downbound.py'
      - '.github/workflows/audit-minatomirai-timetables.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct weekday Minatomirai departures
        run: python scripts/reconstruct_minatomirai_weekday_downbound_v4.py
      - name: Reconstruct Shin-Takashima departures
        run: python scripts/reconstruct_shintakashima_downbound.py
      - name: Audit saved timetable snapshot
        run: python scripts/audit_minatomirai_downbound.py
      - name: Save audit and reconstruction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/transit/yokohama-minatomirai/downbound-audit.json \
            data/transit/yokohama-minatomirai/reconstructed-weekday-minatomirai.json \
            data/transit/yokohama-minatomirai/reconstructed-shintakashima-downbound.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Minatomirai timetable audit"
          git pull --rebase origin main
          git push origin HEAD:main
