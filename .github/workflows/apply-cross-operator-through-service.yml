name: Apply cross-operator through-service support

on:
  push:
    paths:
      - '.github/workflows/apply-cross-operator-through-service.yml'
      - 'scripts/apply_cross_operator_through_service.py'
      - 'scripts/test_cross_operator_through_service.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch destination-aware through-service logic
        run: python3 scripts/apply_cross_operator_through_service.py

      - name: Syntax check
        run: node --check route-core.js

      - name: Cross-operator through-service regression test
        run: node scripts/test_cross_operator_through_service.js

      - name: Commit route-core update
        shell: bash
        run: |
          if git diff --quiet -- route-core.js; then
            echo 'No route-core change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add route-core.js
          git commit -m 'Support destination-aware cross-operator through trains'
          git push
