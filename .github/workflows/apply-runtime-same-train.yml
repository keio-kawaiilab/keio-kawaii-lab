name: Apply runtime same-train integration

on:
  push:
    paths:
      - 'scripts/apply_runtime_same_train_patch.py'
      - 'scripts/patch_strict_route_core_test.py'
      - '.github/workflows/apply-runtime-same-train.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: |
          python scripts/apply_runtime_same_train_patch.py
          python scripts/patch_strict_route_core_test.py
      - name: Validate implementation
        run: |
          python -m py_compile scripts/build_transit_v2.py scripts/finalize_transit_v2.py
          node --check route-core.js
          node --check route.js
          node scripts/test_cross_operator_through_service.js
          node scripts/test_route_destination_display.js
          node scripts/test_route_core.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_transit_v2.py scripts/finalize_transit_v2.py route-core.js route.js scripts/test_cross_operator_through_service.js scripts/test_route_core.js
          git commit -m "Use strict same-train identity in route search"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
