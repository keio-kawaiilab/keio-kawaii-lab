name: Apply runtime same-train integration

on:
  push:
    paths:
      - '.github/workflows/apply-runtime-same-train.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch strict same-train runtime integration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing patch anchor in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Preserve the v1 source-trip ordinal in v2 fragments. This is a
          # deterministic identity hook for reconstructed station timetables.
          replace_once(
              'scripts/build_transit_v2.py',
              "                        'id': fragment_id,\n                        'sourceKind': 'exact-train-timetable',",
              "                        'id': fragment_id,\n                        'sourceTripIndex': trip_index,\n                        'sourceKind': 'exact-train-timetable',",
          )
          replace_once(
              'scripts/build_transit_v2.py',
              "                        'id': stable_id('inferred', slug, railway, calendar, direction, train_type, destination, trip_index, stops),\n                        'sourceKind': 'station-timetable-reconstruction',",
              "                        'id': stable_id('inferred', slug, railway, calendar, direction, train_type, destination, trip_index, stops),\n                        'sourceTripIndex': trip_index,\n                        'sourceKind': 'station-timetable-reconstruction',",
          )

          runtime_block = '''    fragment_by_id = {str(fragment.get('id') or ''): fragment for fragment in fragments if fragment.get('id')}

    def runtime_ref(fragment: dict[str, Any] | None) -> str:
        if not fragment:
            return ''
        if fragment.get('sourceKind') == 'exact-train-timetable':
            timetable_id = str(fragment.get('timetableId') or '')
            return f'tt:{timetable_id}' if timetable_id else ''
        if fragment.get('sourceKind') == 'station-timetable-reconstruction':
            trip_index = fragment.get('sourceTripIndex')
            railway = str(fragment.get('railway') or '')
            if isinstance(trip_index, int) and railway:
                return f'inf:{railway}:{trip_index}'
        return ''

    runtime_edges: list[list[str]] = []
    runtime_seen: set[tuple[str, str, str, str]] = set()
    for edge in edges:
        source = fragment_by_id.get(str(edge.get('fromFragment') or ''))
        target = fragment_by_id.get(str(edge.get('toFragment') or ''))
        source_ref = runtime_ref(source)
        target_ref = runtime_ref(target)
        from_railway = str((source or {}).get('railway') or '')
        to_railway = str((target or {}).get('railway') or '')
        key = (source_ref, target_ref, from_railway, to_railway)
        if not source_ref or not target_ref or not from_railway or not to_railway or key in runtime_seen:
            continue
        runtime_seen.add(key)
        runtime_edges.append(list(key))
    write_json(V2 / 'runtime-same-train.json', {
        'version': 1,
        'generatedAt': generated,
        'policy': {
            'runtimeInference': False,
            'unknownMayBePromotedToSameTrain': False,
            'trainNumberAloneMayResolve': False,
            'timeGapAloneMayResolve': False,
        },
        'edges': runtime_edges,
    })

'''
          replace_once(
              'scripts/finalize_transit_v2.py',
              '    coverage = {\n',
              runtime_block + '    coverage = {\n',
          )
          replace_once(
              'scripts/finalize_transit_v2.py',
              "    updated_index['finalizer'] = 'strict-train-identity-v2'\n",
              "    updated_index['finalizer'] = 'strict-train-identity-v2'\n    updated_index['runtimeSameTrain'] = 'runtime-same-train.json'\n",
          )

          # route-core: expose deterministic candidate identity and only waive
          # transfer time when the precomputed runtime index names the next trip.
          replace_once(
              'route-core.js',
              '    function timetableTrip(timetable,fromNodes,toNodes,earliest,service,latest){',
              '    function timetableTrip(timetable,fromNodes,toNodes,earliest,service,latest,requiredIdentityKeys){',
          )
          replace_once(
              'route-core.js',
              '      timetable.trips.forEach(function(trip){',
              '      timetable.trips.forEach(function(trip,tripIndex){',
          )
          replace_once(
              'route-core.js',
              '          var candidate={departure:departure,arrival:arrival,trainType:types[trip[1]]||"",trainNumber:String(trip[2]||""),destination:timetable.destinationAuthoritative===false?"":(trip.length>4?trip[4]:""),destinationAuthoritative:timetable.destinationAuthoritative!==false,timeBasis:timetable.timeBasis||"train-timetable"};\n',
              '          var identityKey=trip.length>6&&trip[6]?"tt:"+String(trip[6]):"";\n          var candidate={departure:departure,arrival:arrival,trainType:types[trip[1]]||"",trainNumber:String(trip[2]||""),destination:timetable.destinationAuthoritative===false?"":(trip.length>4?trip[4]:""),destinationAuthoritative:timetable.destinationAuthoritative!==false,identityKey:identityKey,sourceTripIndex:tripIndex,timeBasis:timetable.timeBasis||"train-timetable"};\n          if(requiredIdentityKeys&&(!identityKey||!requiredIdentityKeys.has(identityKey)))break;\n',
          )
          replace_once(
              'route-core.js',
              '    function stationDepartureTrip(table,fromNodes,toNodes,earliest,service,latest,requiredDestination){',
              '    function stationDepartureTrip(table,fromNodes,toNodes,earliest,service,latest,requiredDestination,requiredIdentityKeys){',
          )
          replace_once(
              'route-core.js',
              '      (table.inferredTrips||[]).forEach(function(trip){',
              '      (table.inferredTrips||[]).forEach(function(trip,tripIndex){',
          )
          replace_once(
              'route-core.js',
              '          var candidate={departure:departure,arrival:arrival,trainType:types[trip[2]]||"",destination:destinationAuthoritative?(destinations[trip[3]]||""):"",destinationAuthoritative:destinationAuthoritative,trainNumber:"",confidence:Number(trip[4])||0,timeBasis:"inferred-station-trip"};\n',
              '          var identityKey="inf:"+String(table.railway||"")+":"+String(tripIndex);\n          var candidate={departure:departure,arrival:arrival,trainType:types[trip[2]]||"",destination:destinationAuthoritative?(destinations[trip[3]]||""):"",destinationAuthoritative:destinationAuthoritative,identityKey:identityKey,sourceTripIndex:tripIndex,trainNumber:"",confidence:Number(trip[4])||0,timeBasis:"inferred-station-trip"};\n',
          )
          replace_once(
              'route-core.js',
              '          var typeIndex=Number(row[1]),destinationIndex=row.length>2?Number(row[2]):-1;\n',
              '          var typeIndex=Number(row[1]),destinationIndex=row.length>2&&row[2]!=null?Number(row[2]):-1;\n',
          )
          replace_once(
              'route-core.js',
              '          if(requiredDestination&&candidate.destination!==requiredDestination)return;\n          var windowed=Number.isFinite(latest);\n',
              '          if(requiredIdentityKeys&&(!candidate.identityKey||!requiredIdentityKeys.has(candidate.identityKey)))return;\n          if(requiredDestination&&candidate.destination!==requiredDestination)return;\n          var windowed=Number.isFinite(latest);\n',
          )
          replace_once(
              'route-core.js',
              '    function timedItinerary(path,timetablesByRailway,departureMinutes,service,transferMinutes,transferResolver){',
              '    function timedItinerary(path,timetablesByRailway,departureMinutes,service,transferMinutes,transferResolver,sameTrainResolver){',
          )
          old_pick = '''        var earliest=current+(i>0?interchangeBuffer:0);
        var trip=table&&table.timeBasis==="station-departure-only"?stationDepartureTrip(table,fromNodes,toNodes,earliest,service):timetableTrip(table,fromNodes,toNodes,earliest,service);
        if(!trip||!Number.isFinite(trip.arrival))return null;
'''
          new_pick = '''        var trip=null;
        if(previous&&typeof sameTrainResolver==="function"&&previous.identityKey){
          var expectedSameTrain=sameTrainResolver(previous.identityKey,previous.railway,segment.railway);
          if(expectedSameTrain&&expectedSameTrain.size){
            var throughLatest=current+10;
            trip=table&&table.timeBasis==="station-departure-only"?stationDepartureTrip(table,fromNodes,toNodes,current,service,throughLatest,null,expectedSameTrain):timetableTrip(table,fromNodes,toNodes,current,service,throughLatest,expectedSameTrain);
            if(trip)trip.throughFromPrevious=true;
          }
        }
        if(!trip){
          var earliest=current+(i>0?interchangeBuffer:0);
          trip=table&&table.timeBasis==="station-departure-only"?stationDepartureTrip(table,fromNodes,toNodes,earliest,service):timetableTrip(table,fromNodes,toNodes,earliest,service);
        }
        if(!trip||!Number.isFinite(trip.arrival))return null;
'''
          replace_once('route-core.js', old_pick, new_pick)

          # route.js: load only the compact runtime edge index, not the huge v2
          # fragment database, and expose it as a strict directed resolver.
          replace_once(
              'route.js',
              '  var transferRulesByKey=new Map();\n  var blockedStationPairs=[];\n',
              '  var transferRulesByKey=new Map();\n  var sameTrainNextByKey=new Map();\n  var blockedStationPairs=[];\n',
          )
          transfer_anchor = '''  function resolveTransferRule(context){
    if(!context)return null;
    return transferRulesByKey.get(transferRuleKey(context.fromStationId,context.toStationId,context.fromRailway,context.toRailway))||null;
  }
'''
          transfer_new = transfer_anchor + '''  function sameTrainLookupKey(identityKey,fromRailway,toRailway){return[identityKey,fromRailway,toRailway].join("\\u0001");}
  function indexSameTrainRuntime(payload){
    sameTrainNextByKey.clear();
    var edges=payload&&Array.isArray(payload.edges)?payload.edges:[];
    edges.forEach(function(row){
      if(!Array.isArray(row)||row.length<4)return;
      var fromIdentity=String(row[0]||""),toIdentity=String(row[1]||""),fromRailway=String(row[2]||""),toRailway=String(row[3]||"");
      if(!fromIdentity||!toIdentity||!fromRailway||!toRailway)return;
      var key=sameTrainLookupKey(fromIdentity,fromRailway,toRailway);
      if(!sameTrainNextByKey.has(key))sameTrainNextByKey.set(key,new Set());
      sameTrainNextByKey.get(key).add(toIdentity);
    });
  }
  function resolveSameTrain(identityKey,fromRailway,toRailway){
    return sameTrainNextByKey.get(sameTrainLookupKey(identityKey,fromRailway,toRailway))||null;
  }
'''
          replace_once('route.js', transfer_anchor, transfer_new)
          old_load = '''        return Promise.all([
          fetchJson("./data/transit/transfer-rules.json?v="+dataVersion).catch(function(error){console.warn(error);return{rules:[]};}),
          fetchJson("./data/transit/transfer-blocks.json?v="+dataVersion).catch(function(error){console.warn(error);return{blockedStationPairs:[]};})
        ]).then(function(payloads){
          indexTransferRules(payloads[0]);indexTransferBlocks(payloads[1]);return bundles;
        });
'''
          new_load = '''        return Promise.all([
          fetchJson("./data/transit/transfer-rules.json?v="+dataVersion).catch(function(error){console.warn(error);return{rules:[]};}),
          fetchJson("./data/transit/transfer-blocks.json?v="+dataVersion).catch(function(error){console.warn(error);return{blockedStationPairs:[]};}),
          fetchJson("./data/transit-v2/runtime-same-train.json?v="+dataVersion).catch(function(error){console.warn(error);return{edges:[]};})
        ]).then(function(payloads){
          indexTransferRules(payloads[0]);indexTransferBlocks(payloads[1]);indexSameTrainRuntime(payloads[2]);return bundles;
        });
'''
          replace_once('route.js', old_load, new_load)
          replace_once(
              'route.js',
              '    var normal=model.timedItinerary(path,timetables,earliest,service,5,resolveTransferRule);',
              '    var normal=model.timedItinerary(path,timetables,earliest,service,5,resolveTransferRule,resolveSameTrain);',
          )

          test = r'''const core=require('../route-core.js');

const S=(id,name,railways)=>({'owl:sameAs':id,'odpt:stationTitle':{ja:name},'odpt:railway':railways});
const R=(id,name,operator,stations)=>({'owl:sameAs':id,'odpt:railwayTitle':{ja:name},'odpt:operator':operator,'odpt:stationOrder':stations.map((station,index)=>({'odpt:index':index,'odpt:station':station}))});

const A='odpt.Railway:Test.A';
const B='odpt.Railway:Test.B';
const C='odpt.Railway:Test.C';
const A0='odpt.Station:Test.A.A0';
const X='odpt.Station:Test.X.X';
const Y='odpt.Station:Test.Y.Y';
const D='odpt.Station:Test.C.D';
const payload={
  Station:[S(A0,'A0',[A]),S(X,'X',[A,B]),S(Y,'Y',[B,C]),S(D,'D',[C])],
  Railway:[R(A,'A線','op:A',[A0,X]),R(B,'B線','op:B',[X,Y]),R(C,'C線','op:C',[Y,D])],
  TrainType:[]
};
const model=core.createModel([payload]);
const origin=model.resolveInput('A0').group;
const destination=model.resolveInput('D').group;
const path=model.shortestPath(origin,destination);
if(!path)throw new Error('Synthetic path was not created');

const exact=(railway,stations,number,timetableId,departure,arrival,destinationId)=>({
  version:1,railway,timeBasis:'train-timetable',stations,calendars:['weekday'],trainTypes:['odpt.TrainType:Test.Local'],
  trips:[[0,0,number,[[0,null,departure],[1,arrival,null]],destinationId,'train:'+number,timetableId]]
});
const tables={};
tables[A]=exact(A,[A0,X],'777','tt:A',600,605,D);
tables[B]=exact(B,[X,Y],'777','tt:B',610,615,D);
tables[C]=exact(C,[Y,D],'777','tt:C',620,625,D);

const ordinary=model.timedItinerary(path,tables,600,'weekday',5,null,null);
if(!ordinary)throw new Error('Ordinary itinerary missing');
if(ordinary.transfers!==2)throw new Error(`Same train number alone must not remove transfers: ${ordinary.transfers}`);

const links=new Map([
  [[`tt:tt:A`,A,B].join('\u0001'),new Set(['tt:tt:B'])],
  [[`tt:tt:B`,B,C].join('\u0001'),new Set(['tt:tt:C'])]
]);
const resolver=(identityKey,fromRailway,toRailway)=>links.get([identityKey,fromRailway,toRailway].join('\u0001'))||null;
const through=model.timedItinerary(path,tables,600,'weekday',5,null,resolver);
if(!through)throw new Error('Strict through itinerary missing');
if(through.transfers!==0)throw new Error(`Expected 0 transfers with explicit same-train edges, got ${through.transfers}`);
if(!through.segments[1].throughFromPrevious||!through.segments[2].throughFromPrevious)throw new Error('Explicit same-train boundaries were not marked through');
if(through.segments[1].identityKey!=='tt:tt:B'||through.segments[2].identityKey!=='tt:tt:C')throw new Error('Timetable identity was not propagated');
console.log('cross-operator strict same-train test passed');
'''
          Path('scripts/test_cross_operator_through_service.js').write_text(test, encoding='utf-8')
          PY

      - name: Validate runtime same-train implementation
        run: |
          python -m py_compile scripts/build_transit_v2.py scripts/finalize_transit_v2.py
          node --check route-core.js
          node --check route.js
          node scripts/test_cross_operator_through_service.js
          node scripts/test_route_destination_display.js
          node scripts/test_route_core.js

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_transit_v2.py scripts/finalize_transit_v2.py route-core.js route.js scripts/test_cross_operator_through_service.js
          git commit -m "Use strict same-train identity in route search"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
