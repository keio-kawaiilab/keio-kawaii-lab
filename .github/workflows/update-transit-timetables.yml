name: Update transit timetables

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_odpt_timetables.py'
      - 'scripts/collect_odpt_train_identity.py'
      - 'scripts/test_import_odpt_timetables.py'
      - 'scripts/test_odpt_train_identity_db.mjs'
      - 'scripts/enrich-through-service-db.mjs'
      - 'scripts/build_keisei_official_timetables.py'
      - 'scripts/build_keisei_network_timetable.py'
      - 'scripts/build_minatomirai_routing_timetable.py'
      - 'scripts/build_minatomirai_routing_timetable_v2.py'
      - 'scripts/build_transit_v2.py'
      - 'scripts/finalize_transit_v2.py'
      - 'scripts/audit_transit_v2.py'
      - 'scripts/test_route_runtime_same_train.js'
      - 'route-core.js'
      - 'route.js'
      - 'data/transit-sources/manual-topology.json'
      - 'scripts/test_transit_snapshot.js'
      - '.github/workflows/update-transit-timetables.yml'
  schedule:
    - cron: '20 18 * * 0'

permissions:
  contents: write

concurrency:
  group: update-transit-timetables
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      ODPT_API_KEY: ${{ secrets.ODPT_API_KEY }}
      ODPT_CHALLENGE_API_KEY: ${{ secrets.ODPT_CHALLENGE_API_KEY }}
      ALLOW_JR_EAST_CHALLENGE_DATA: ${{ vars.ALLOW_JR_EAST_CHALLENGE_DATA }}
      ODPT_IMPORT_TIMETABLES: ${{ vars.ODPT_IMPORT_TIMETABLES }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install importer dependency
        run: pip install requests==2.32.5

      - name: Test timetable importer and identity pipeline
        run: |
          node --check scripts/enrich-through-service-db.mjs
          node --check scripts/test_route_runtime_same_train.js
          node --check route-core.js
          node --check route.js
          python -m py_compile \
            scripts/collect_odpt_train_identity.py \
            scripts/build_keisei_official_timetables.py \
            scripts/build_keisei_network_timetable.py \
            scripts/build_minatomirai_routing_timetable.py \
            scripts/build_minatomirai_routing_timetable_v2.py \
            scripts/build_transit_v2.py \
            scripts/finalize_transit_v2.py \
            scripts/audit_transit_v2.py
          node scripts/test_odpt_train_identity_db.mjs
          node scripts/test_cross_operator_through_service.js
          node scripts/test_route_runtime_same_train.js
          python scripts/test_import_odpt_timetables.py

      - name: Import ODPT timetables
        id: import
        shell: bash
        run: |
          if [ -z "$ODPT_API_KEY" ]; then
            echo "ODPT_API_KEY is not configured; leaving timetable snapshot unchanged."
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/import_odpt_timetables.py
          echo "ran=true" >> "$GITHUB_OUTPUT"

      - name: Verify saturated Sotetsu Main timetable was fully recovered
        if: steps.import.outputs.ran == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('data/transit/sotetsu')
          index = json.loads((root / 'timetable-index.json').read_text(encoding='utf-8'))
          line = index['lines']['odpt.Railway:Sotetsu.Main']
          table = json.loads((root / line['file']).read_text(encoding='utf-8'))
          target = 'odpt.TrainTimetable:Sotetsu.Main.6752.Weekday'
          ids = {str(trip[6]) for trip in table.get('trips', []) if len(trip) > 6 and trip[6]}
          assert target in ids, 'Sotetsu Main is still truncated at the ODPT 1000-row result cap'
          assert len(table.get('trips', [])) > 1000, len(table.get('trips', []))
          print('Sotetsu Main complete trips:', len(table.get('trips', [])), 'target:', target)
          PY

      - name: Collect authoritative ODPT train identity
        if: steps.import.outputs.ran == 'true'
        run: python scripts/collect_odpt_train_identity.py

      - name: Restore reviewed special timetable sources
        if: steps.import.outputs.ran == 'true'
        run: |
          python scripts/build_keisei_official_timetables.py
          python scripts/build_keisei_network_timetable.py
          python scripts/build_minatomirai_routing_timetable_v2.py
          python - <<'PY'
          import json
          from pathlib import Path

          keisei_details = json.loads(Path('data/transit/keisei/official-train-details.json').read_text(encoding='utf-8'))
          keisei_network = json.loads(Path('data/transit/keisei/timetables/official-network.json').read_text(encoding='utf-8'))
          mm = json.loads(Path('data/transit/yokohama-minatomirai/timetables/minatomirai.json').read_text(encoding='utf-8'))

          source_trains = int(keisei_details.get('trainCount') or len(keisei_details.get('trains') or []))
          network_trips = len(keisei_network.get('trips') or [])
          mm_trips = len(mm.get('inferredTrips') or [])
          assert 3000 <= source_trains <= 7000, source_trains
          assert network_trips >= 3000, network_trips
          assert mm_trips >= 1000, mm_trips
          assert mm.get('destinationAuthoritative') is False
          print('special-source guard:', {'keiseiSourceTrains': source_trains, 'keiseiNetworkTrips': network_trips, 'minatomiraiTrips': mm_trips})
          PY

      - name: Test generated transit snapshot
        if: steps.import.outputs.ran == 'true'
        run: node scripts/test_transit_snapshot.js

      - name: Rebuild and audit strict transit v2
        if: steps.import.outputs.ran == 'true'
        run: |
          python scripts/build_transit_v2.py
          python scripts/finalize_transit_v2.py
          python scripts/audit_transit_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          coverage = json.loads(Path('data/transit-v2/coverage.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('data/transit-v2/unresolved-summary.json').read_text(encoding='utf-8'))
          runtime = json.loads(Path('data/transit-v2/runtime-same-train.json').read_text(encoding='utf-8'))
          policy = audit['policy']
          assert policy['unknownMayBePromotedToSameTrain'] is False
          assert policy['trainNumberAloneMayResolve'] is False
          assert policy['timeGapAloneMayResolve'] is False
          assert audit['totalUnresolved'] == int(coverage['summary'].get('unresolved') or 0)
          runtime_policy = runtime['policy']
          assert runtime_policy['runtimeInference'] is False
          assert runtime_policy['unknownMayBePromotedToSameTrain'] is False
          assert runtime_policy['trainNumberAloneMayResolve'] is False
          assert runtime_policy['timeGapAloneMayResolve'] is False
          runtime_edges = runtime.get('edges') or []
          assert len(runtime_edges) > 100, len(runtime_edges)
          expected_sotetsu = [
              'tt:odpt.TrainTimetable:Sotetsu.Izumino.6752.Weekday',
              'tt:odpt.TrainTimetable:Sotetsu.Main.6752.Weekday',
              'odpt.Railway:Sotetsu.Izumino',
              'odpt.Railway:Sotetsu.Main',
          ]
          assert expected_sotetsu in runtime_edges, 'authoritative Sotetsu 6752 continuation disappeared from runtime DB'
          print('strict transit-v2 unresolved:', audit['totalUnresolved'])
          print('runtime strict same-train edges:', len(runtime_edges))
          print('verified runtime continuation:', expected_sotetsu)
          PY

      - name: Commit refreshed transit data
        if: steps.import.outputs.ran == 'true'
        shell: bash
        run: |
          if git diff --quiet -- data/transit data/transit-v2; then
            echo "No transit data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transit data/transit-v2
          git commit -m "Update transit timetable snapshot"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Failed to push transit data after 3 attempts." >&2
          exit 1
