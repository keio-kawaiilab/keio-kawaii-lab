name: Fix strip schedule compatibility

on:
  push:
    paths:
      - ".github/workflows/oneoff-fix-strip-schedule-idempotency.yml"

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch strip schedule compatibility
        run: python scripts/oneoff_fix_strip_schedule_idempotency.py

      - name: Verify complete schedule build twice
        shell: bash
        run: |
          set -euo pipefail
          cp data/live-events.json /tmp/live-events-before-strip-test.json
          for pass in 1 2; do
            python scripts/build_schedule_snapshot.py
            python scripts/fix_schedule_shell.py
            python scripts/strip_schedule_explanations.py
            node --check /tmp/schedule-inline.js
            node scripts/test_schedule_band_grouping.js
            node scripts/test_schedule_scope_ui.js
          done
          cp /tmp/live-events-before-strip-test.json data/live-events.json

      - name: Commit tested compatibility fix and run real refresh
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/strip_schedule_explanations.py schedule.html
          if ! git diff --cached --quiet; then
            git commit -m "Make schedule cleanup compatible with current renderer"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
          gh workflow run update-live-calendar-distributed.yml --ref main
