name: Collect exact Seibu Line 13 through-train evidence

on:
  pull_request:
    paths:
      - 'scripts/probe_seibu_2026_fukutoshin_pages.py'
      - 'scripts/inspect_seibu_timetable_mechanics.py'
      - '.github/workflows/probe-seibu-2026-fukutoshin-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests==2.32.5 beautifulsoup4==4.13.4
      - name: Collect exact one-train timetable evidence
        run: |
          python scripts/probe_seibu_2026_fukutoshin_pages.py \
            --output /tmp/seibu-line13-through-trains.json
      - name: Audit strict identity policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/seibu-line13-through-trains.json').read_text(encoding='utf-8'))
          p=data['identityPolicy']; s=data['summary']
          print('SUMMARY', json.dumps(s, ensure_ascii=False, indent=2))
          assert p['singlePublishedOneTrainPageMayEstablishIdentity'] is True
          assert p['stationListingAloneMayEstablishIdentity'] is False
          assert p['timeProximityMayEstablishIdentity'] is False
          assert p['trainNumberAloneMayEstablishIdentity'] is False
          assert p['destinationAloneMayEstablishIdentity'] is False
          assert p['boundaryRequiresAdjacentPublishedStopsOnSameTrainPage'] is True
          assert s['trainDetailPagesFetched'] > 0
          assert s['exactThroughTrainPages'] > 0
          assert s['boundaryCounts']['seibu-metro-kotake-mukaihara'] > 0
          for row in data['authoritativeThroughTrains']:
              assert row['identityEvidence']=='single-published-one-train-page'
              assert row['stationCount'] >= 3
              assert row['boundaries']
          PY
      - name: Inspect timetable detail-link mechanics
        run: python scripts/inspect_seibu_timetable_mechanics.py > /tmp/seibu-timetable-mechanics.json
      - name: Show compact mechanics clues
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/seibu-timetable-mechanics.json').read_text(encoding='utf-8'))
          for page in data['pages']:
              print('MECHANICS_PAGE', page['url'])
              for form in page['forms']:
                  interesting=[i for i in form['inputs'] if i.get('name') or i.get('onclick') or i.get('data')]
                  if interesting:
                      print('FORM', json.dumps({'action':form['action'],'method':form['method'],'id':form['id'],'inputs':interesting[:35]}, ensure_ascii=False))
              for row in page['clickable'][:120]:
                  if row.get('onclick') or row.get('data') or ':' in row.get('text',''):
                      print('CLICK', json.dumps(row, ensure_ascii=False))
              for script in page['scripts']:
                  if script.get('src') or script.get('needleHits'):
                      print('SCRIPT', json.dumps(script, ensure_ascii=False))
              for ctx in page['contexts'][:30]:
                  print('CTX', json.dumps(ctx, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: seibu-line13-through-trains
          path: |
            /tmp/seibu-line13-through-trains.json
            /tmp/seibu-timetable-mechanics.json
          if-no-files-found: error
