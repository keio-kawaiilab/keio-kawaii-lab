name: Promote verified Hokuso route candidate fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-hokuso-route-limit.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified candidate expansion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('route.js')
          s=p.read_text(encoding='utf-8')
          old='{allowedRailways:Array.from(timetableLines.keys()),limit:5}'
          new='{allowedRailways:Array.from(timetableLines.keys()),limit:8}'
          if old in s:
              s=s.replace(old,new,1)
          assert new in s
          p.write_text(s,encoding='utf-8')
          PY
          python scripts/build_keisei_extended_network.py
          node scripts/test_keisei_route_ui.js
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-hokuso-route-limit.yml
          git add route.js
          git commit -m 'Prefer exact through trains across expanded route candidates'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1