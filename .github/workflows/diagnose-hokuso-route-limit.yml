name: Diagnose Hokuso exact route candidate limit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-hokuso-route-limit.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild exact network
        run: python scripts/build_keisei_extended_network.py
      - name: Try maximum candidate path count
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('route.js')
          s=p.read_text(encoding='utf-8')
          old='{allowedRailways:Array.from(timetableLines.keys()),limit:5}'
          assert old in s
          p.write_text(s.replace(old,'{allowedRailways:Array.from(timetableLines.keys()),limit:8}',1),encoding='utf-8')
          PY
          node scripts/test_keisei_route_ui.js