name: Immediate SWEET STEADY release detail refresh

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sweet-release-hotfix.yml"

permissions:
  contents: write

concurrency:
  group: update-live-ticket-calendar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Merge only the verified 9/5 SWEET STEADY detail
        run: |
          cp data/live-events.json /tmp/live-events-before-sweet.json
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          import requests
          from scripts.update_special_events import JST, parse_page

          path = Path("data/live-events.json")
          source_url = "https://sweetsteady.asobisystem.com/news/detail/88315"
          response = requests.get(source_url, timeout=20, headers={"User-Agent": "Mozilla/5.0"})
          response.raise_for_status()
          parsed = parse_page("SWEET STEADY", source_url, response.text)
          if len(parsed) != 1:
              raise SystemExit(f"Expected exactly one parsed event, got {len(parsed)}")
          fresh = parsed[0]
          if fresh.get("eventDate") != "2026-09-05" or fresh.get("eventCategory") != "release-event":
              raise SystemExit(f"Unexpected parsed event: {fresh}")
          if fresh.get("applyStart") != "2026-09-04T21:00" or fresh.get("applyEnd") != "2026-09-05T09:00":
              raise SystemExit(f"Unexpected application window: {fresh.get('applyStart')} - {fresh.get('applyEnd')}")

          payload = json.loads(path.read_text(encoding="utf-8"))
          matches = []
          for index, event in enumerate(payload.get("events", [])):
              if not isinstance(event, dict):
                  continue
              if (
                  event.get("group") == "SWEET STEADY"
                  and str(event.get("eventDate") or "")[:10] == "2026-09-05"
                  and event.get("sourceType") == "official-schedule"
                  and (event.get("eventCategory") == "release-event" or "リリースイベント" in str(event.get("title") or ""))
              ):
                  matches.append(index)
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one schedule placeholder, got {len(matches)}")

          index = matches[0]
          old = payload["events"][index]
          merged = dict(fresh)
          merged["id"] = old.get("id") or fresh.get("id")
          official_schedule_url = str(old.get("officialScheduleUrl") or old.get("url") or "").strip()
          links = []
          for value in [*(fresh.get("urls") or []), fresh.get("url"), *(old.get("urls") or []), official_schedule_url]:
              if value and value not in links:
                  links.append(value)
          merged["urls"] = links
          if official_schedule_url:
              merged["officialScheduleUrl"] = official_schedule_url
          merged["eventScope"] = old.get("eventScope") or "kawaii-lab"
          payload["events"][index] = merged
          payload["updatedAt"] = datetime.now(JST).replace(microsecond=0).isoformat()
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "id": merged["id"],
              "title": merged.get("displayTitle"),
              "eventDate": merged.get("eventDate"),
              "applyStart": merged.get("applyStart"),
              "applyEnd": merged.get("applyEnd"),
              "salesStartTime": merged.get("salesStartTime"),
              "gatheringTime": merged.get("gatheringTime"),
              "startTime": merged.get("startTime"),
              "ticketBenefits": merged.get("ticketBenefits"),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Audit refreshed data
        run: |
          python scripts/audit_schedule_release.py \
            --previous /tmp/live-events-before-sweet.json \
            --candidate data/live-events.json \
            --report /tmp/sweet-release-health.json

      - name: Rebuild public schedule snapshot
        run: |
          python scripts/build_schedule_snapshot.py
          python scripts/fix_schedule_shell.py
          python scripts/strip_schedule_explanations.py
          node --check /tmp/schedule-inline.js

      - name: Publish release-event refresh
        shell: bash
        run: |
          if git diff --quiet -- data/live-events.json schedule.html; then
            echo "No release-event changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-events.json schedule.html
          git commit -m "fix: publish SWEET STEADY release event details"
          git push
