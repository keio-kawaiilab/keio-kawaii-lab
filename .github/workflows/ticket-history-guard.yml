name: Ticket History Guard

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/ticket_history_pia_guard.py"
      - "scripts/ticket_classification_guard_v2.py"
      - "scripts/test_ticket_history_pia_guard.py"
      - "scripts/test_ticket_classification_guard_v2.py"
      - "data/ticket-source-registry.json"
      - ".github/workflows/ticket-history-guard.yml"
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: write

concurrency:
  group: ticket-history-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Regression tests
        env:
          PYTHONPATH: scripts
        run: |
          python -m unittest scripts/test_ticket_classification_guard_v2.py
          python -m unittest scripts/test_ticket_history_pia_guard.py

      - name: Quarantine unsupported ticket classifications
        env:
          PYTHONPATH: scripts
        run: python scripts/ticket_classification_guard_v2.py

      - name: Preserve ended and sold-out Ticket Pia sales
        env:
          PYTHONPATH: scripts
        run: python scripts/ticket_history_pia_guard.py

      - name: Archive verified ticket observations
        env:
          PYTHONPATH: scripts
        run: python scripts/archive_ticket_history.py

      - name: Commit guarded data against latest main
        shell: bash
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Guarded data publish attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main

            # Recreate the guarded changes from the newest main instead of
            # rebasing generated JSON, which is unsafe during concurrent runs.
            python scripts/ticket_classification_guard_v2.py
            python scripts/ticket_history_pia_guard.py
            python scripts/archive_ticket_history.py

            if git diff --quiet -- data/live-events.json data/ticket-history.json; then
              echo "No guarded ticket data changes."
              exit 0
            fi

            git add data/live-events.json data/ticket-history.json
            git commit -m "Guard ticket sale history"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "::warning::main advanced during guarded publish; retrying from latest main."
            sleep 10
          done

          echo "::error::Could not publish guarded ticket data after 3 attempts."
          exit 1
