name: Ticket History Guard

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/ticket_history_guard.py"
      - "scripts/ticket_history_pia_guard.py"
      - "scripts/ticket_classification_guard.py"
      - "scripts/test_ticket_history_guard.py"
      - "scripts/test_ticket_history_pia_guard.py"
      - "data/ticket-source-registry.json"
      - ".github/workflows/ticket-history-guard.yml"
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: write

concurrency:
  group: ticket-history-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Regression tests
        env:
          PYTHONPATH: scripts
        run: |
          python -m unittest scripts/test_ticket_history_guard.py
          python -m unittest scripts/test_ticket_history_pia_guard.py

      - name: Quarantine unsupported ticket classifications
        env:
          PYTHONPATH: scripts
        run: python scripts/ticket_classification_guard.py

      - name: Preserve ended and sold-out Ticket Pia sales
        env:
          PYTHONPATH: scripts
        run: python scripts/ticket_history_pia_guard.py

      - name: Archive verified ticket observations
        env:
          PYTHONPATH: scripts
        run: python scripts/archive_ticket_history.py

      - name: Commit guarded data
        shell: bash
        run: |
          if git diff --quiet -- data/live-events.json data/ticket-history.json; then
            echo "No guarded ticket data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-events.json data/ticket-history.json
          git commit -m "Guard ticket sale history"
          git pull --rebase origin main
          git push origin HEAD:main
