name: Diagnose Sotetsu identity-only links

on:
  push:
    paths:
      - '.github/workflows/diagnose-sotetsu-identity.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      ODPT_API_KEY: ${{ secrets.ODPT_API_KEY }}
      ODPT_CHALLENGE_API_KEY: ${{ secrets.ODPT_CHALLENGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - name: Probe exact timetable filters
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import requests

          manifest=json.loads(Path('data/transit/manifest.json').read_text(encoding='utf-8'))
          meta=manifest['operators']['sotetsu']
          base=str(meta.get('api') or manifest.get('api') or '').rstrip('/')
          operator=str(meta['operator'])
          key=os.environ['ODPT_CHALLENGE_API_KEY'] if 'challenge' in base else os.environ['ODPT_API_KEY']
          url=base+'/odpt:TrainTimetable'
          target='odpt.TrainTimetable:Sotetsu.Main.6752.Weekday'
          railway='odpt.Railway:Sotetsu.Main'
          probes={
            'operator': {'odpt:operator':operator},
            'railway': {'odpt:operator':operator,'odpt:railway':railway},
            'sameAs': {'owl:sameAs':target},
            'number': {'odpt:operator':operator,'odpt:railway':railway,'odpt:trainNumber':'6752'},
            'train': {'odpt:operator':operator,'odpt:railway':railway,'odpt:train':'odpt.Train:Sotetsu.Main.6752'},
          }
          results={}
          for name,extra in probes.items():
            params={'acl:consumerKey':key,**extra}
            r=requests.get(url,params=params,timeout=90)
            print('PROBE_STATUS',name,r.status_code,r.url.replace(key,'***'))
            r.raise_for_status()
            rows=r.json()
            ids=[str(x.get('owl:sameAs') or '') for x in rows if isinstance(x,dict)]
            results[name]={'count':len(rows),'hasTarget':target in ids,'first':ids[:2],'last':ids[-2:]}
            if target in ids:
              raw=next(x for x in rows if str(x.get('owl:sameAs') or '')==target)
              print('TARGET_META',name,json.dumps({k:raw.get(k) for k in ['owl:sameAs','odpt:railway','odpt:train','odpt:trainNumber','odpt:calendar','odpt:originStation','odpt:destinationStation','odpt:previousTrainTimetable','odpt:nextTrainTimetable']},ensure_ascii=False,sort_keys=True))
              objects=raw.get('odpt:trainTimetableObject') or []
              print('TARGET_OBJECT_COUNT',name,len(objects))
              print('TARGET_OBJECTS',name,json.dumps(objects[:12],ensure_ascii=False,sort_keys=True))
          print('PROBES',json.dumps(results,ensure_ascii=False,sort_keys=True))
          PY
