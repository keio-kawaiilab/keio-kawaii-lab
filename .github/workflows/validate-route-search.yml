name: Validate route search

on:
  workflow_dispatch:
  push:
    paths:
      - 'route.js'
      - 'route-core.js'
      - 'preview/transfer-guide/**'
      - 'scripts/test_keisei_route_ui.js'
      - 'scripts/test_route_preview_smoke.js'
      - 'data/transit/**/entities.json'
      - 'data/transit/**/timetable-index.json'
      - 'data/transit/**/timetables/**'
      - 'data/transit/manifest.json'
      - '.github/workflows/validate-route-search.yml'

permissions:
  contents: read

jobs:
  route-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check route-core.js
          node --check route.js
          node --check preview/transfer-guide/preview.js
          node --check scripts/test_keisei_route_ui.js
          node --check scripts/test_route_preview_smoke.js
      - name: Exercise exact Keisei through route in the browser logic
        run: node scripts/test_keisei_route_ui.js
      - name: Exercise preview routes across operators
        run: node scripts/test_route_preview_smoke.js
