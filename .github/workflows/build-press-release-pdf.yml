name: Build press release PDF

on:
  push:
    paths:
      - 'press/20260824-live-ticket-calendar.html'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Japanese fonts and WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install weasyprint

      - name: Build PDF
        run: |
          python -m weasyprint \
            press/20260824-live-ticket-calendar.html \
            press/20260824-live-ticket-calendar.pdf

      - name: Commit generated PDF
        run: |
          if git diff --quiet -- press/20260824-live-ticket-calendar.pdf; then
            echo 'PDF is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add press/20260824-live-ticket-calendar.pdf
          git commit -m 'Generate press release PDF'
          git push
