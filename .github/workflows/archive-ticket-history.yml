name: Archive verified ticket history

on:
  push:
    branches:
      - main
    paths:
      - "data/live-events.json"
      - "data/ticket-source-registry.json"
      - "data/ticket-history-backfill-sources.json"
      - "data/ticket-history-backfill-oneoffs.json"
      - "scripts/backfill_ticket_history.py"
      - "scripts/backfill_ticket_history_oneoffs.py"
      - "scripts/archive_ticket_history.py"
      - "scripts/audit_ticket_sources.py"
      - "scripts/audit_ticket_collection_continuity.py"
      - "scripts/audit_playguide_collection.py"
      - "scripts/update_live_events_v2.py"
      - "scripts/update_pia_events.py"
      - "scripts/update_playguide_events.py"
      - ".github/workflows/archive-ticket-history.yml"
  schedule:
    - cron: "32 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: archive-ticket-history
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install collector dependencies
        run: pip install -r scripts/requirements.txt

      - name: Test append-only history rules
        working-directory: scripts
        run: python -m unittest -v test_archive_ticket_history.py test_update_live_events_v2.py test_update_playguide_events.py

      - name: Backfill verified historical ticket phases
        run: python scripts/backfill_ticket_history.py

      - name: Backfill verified one-off ticket phases
        run: python scripts/backfill_ticket_history_oneoffs.py

      - name: Collect ticket observations independently of public release
        id: independent_collect
        shell: bash
        run: |
          # This workflow is a second collection lane. Even when the public schedule release is
          # blocked, verified ticket windows can still be archived instead of being lost.
          cp data/live-events.json /tmp/live-events-public.json
          cp data/live-events.json /tmp/live-events-before-independent-pia.json

          official_rc=0
          pia_rc=0
          playguide_rc=0

          set +e
          python scripts/update_live_events_v2.py
          official_rc=$?

          # Work only on this runner's temporary copy. data/live-events.json is restored before commit.
          cp data/live-events.json /tmp/live-events-before-independent-pia.json
          python scripts/clean_pia_refresh.py --drop-all
          python scripts/sanitize_live_events.py
          python scripts/enrich_official_performance_times.py
          python scripts/enrich_event_metadata.py
          python scripts/update_pia_events.py
          pia_rc=$?
          python scripts/reconcile_pia_retention.py --previous /tmp/live-events-before-independent-pia.json

          python scripts/update_playguide_events.py
          playguide_rc=$?
          if [ "$playguide_rc" -eq 0 ]; then
            python scripts/audit_playguide_collection.py
            playguide_rc=$?
          fi
          set -e

          echo "official_rc=$official_rc" >> "$GITHUB_OUTPUT"
          echo "pia_rc=$pia_rc" >> "$GITHUB_OUTPUT"
          echo "playguide_rc=$playguide_rc" >> "$GITHUB_OUTPUT"
          echo "Independent collector exit codes: official=$official_rc pia=$pia_rc playguide=$playguide_rc"

      - name: Archive every verified direct-source observation
        run: python scripts/archive_ticket_history.py

      - name: Fail closed on unknown or weak sources
        id: source_audit
        continue-on-error: true
        run: python scripts/audit_ticket_sources.py --report data/ticket-source-health.json

      - name: Audit continuous source and history coverage
        shell: bash
        run: |
          extra=""
          # 03:32 JST run: re-open every source URL used by future ticket history once per day.
          if [ "$(date -u +%H)" = "18" ]; then
            extra="--deep-links"
          fi
          python scripts/audit_ticket_collection_continuity.py \
            --report data/ticket-collection-health.json \
            --no-fail \
            $extra

      - name: Merge independent collector state into continuity report
        env:
          OFFICIAL_RC: ${{ steps.independent_collect.outputs.official_rc }}
          PIA_RC: ${{ steps.independent_collect.outputs.pia_rc }}
          PLAYGUIDE_RC: ${{ steps.independent_collect.outputs.playguide_rc }}
          SOURCE_AUDIT_OUTCOME: ${{ steps.source_audit.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path('data/ticket-collection-health.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          collector = {
              'officialExitCode': int(os.environ.get('OFFICIAL_RC') or 0),
              'piaExitCode': int(os.environ.get('PIA_RC') or 0),
              'playguideExitCode': int(os.environ.get('PLAYGUIDE_RC') or 0),
              'sourceAuditOutcome': os.environ.get('SOURCE_AUDIT_OUTCOME') or 'unknown',
          }
          report['independentCollector'] = collector
          independent_errors = []
          if collector['officialExitCode'] != 0:
              independent_errors.append('independent official/FC collector failed')
          if collector['piaExitCode'] != 0:
              independent_errors.append('independent Pia collector failed')
          if collector['playguideExitCode'] != 0:
              independent_errors.append('independent eplus/Lawson collector or post-collection audit failed')
          if collector['sourceAuditOutcome'] != 'success':
              independent_errors.append('direct-source registry/history audit failed')
          if independent_errors:
              report['status'] = 'degraded'
              report['safeForTicketFlowPublication'] = False
              errors = list(report.get('errors') or [])
              for message in independent_errors:
                  if message not in errors:
                      errors.append(message)
              report['errors'] = errors
          path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'independentCollector': collector, 'status': report.get('status')}, ensure_ascii=False, indent=2))
          PY

      - name: Restore public schedule data before any commit
        if: always()
        run: |
          if [ -f /tmp/live-events-public.json ]; then
            cp /tmp/live-events-public.json data/live-events.json
          fi

      - name: Commit append-only history and health snapshots
        shell: bash
        run: |
          if git diff --quiet -- data/ticket-history.json data/ticket-source-health.json data/ticket-collection-health.json; then
            echo "No ticket-history or health changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Other calendar lanes write main frequently. Keep this run's verified
          # observations, but rebuild its commit on the newest main after a push
          # race instead of dropping the whole archive run.
          cp data/ticket-history.json /tmp/ticket-history-incoming.json
          cp data/ticket-source-health.json /tmp/ticket-source-health-incoming.json
          cp data/ticket-collection-health.json /tmp/ticket-collection-health-incoming.json

          for attempt in 1 2 3; do
            echo "Ticket archive publish attempt ${attempt}/3"
            if [ "$attempt" -gt 1 ]; then
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/ticket-source-health-incoming.json data/ticket-source-health.json
              cp /tmp/ticket-collection-health-incoming.json data/ticket-collection-health.json
              PYTHONPATH=scripts python - <<'PY'
          import json
          from pathlib import Path

          from archive_ticket_history import clean, merge_entry

          latest_path = Path("data/ticket-history.json")
          incoming_path = Path("/tmp/ticket-history-incoming.json")
          latest = json.loads(latest_path.read_text(encoding="utf-8"))
          incoming = json.loads(incoming_path.read_text(encoding="utf-8"))
          now = max(str(latest.get("updatedAt") or ""), str(incoming.get("updatedAt") or ""))

          by_id = {
              str(row["id"]): dict(row)
              for row in latest.get("entries", [])
              if isinstance(row, dict) and row.get("id")
          }
          for row in incoming.get("entries", []):
              if not isinstance(row, dict) or not row.get("id"):
                  continue
              key = str(row["id"])
              current = by_id.get(key)
              if current is None:
                  by_id[key] = dict(row)
                  continue
              merged = merge_entry(current, row, now)
              first_seen = [
                  str(value) for value in (current.get("firstSeenAt"), row.get("firstSeenAt")) if value
              ]
              last_seen = [
                  str(value) for value in (current.get("lastSeenAt"), row.get("lastSeenAt")) if value
              ]
              if first_seen:
                  merged["firstSeenAt"] = min(first_seen)
              if last_seen:
                  merged["lastSeenAt"] = max(last_seen)
              by_id[key] = merged

          entries = list(by_id.values())
          entries.sort(key=lambda row: (
              clean(row.get("eventDate")) or "9999",
              clean(row.get("applyStart")) or clean(row.get("applyEnd")) or "9999",
              clean(row.get("group")),
              clean(row.get("ticketType")),
          ))
          latest.update({
              "version": max(int(latest.get("version") or 1), int(incoming.get("version") or 1)),
              "updatedAt": now,
              "sourceRegistryVersion": incoming.get("sourceRegistryVersion") or latest.get("sourceRegistryVersion"),
              "entries": entries,
          })
          latest_path.write_text(json.dumps(latest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
              python scripts/audit_ticket_sources.py --report data/ticket-source-health.json
              python scripts/audit_ticket_collection_continuity.py \
                --report data/ticket-collection-health.json \
                --no-fail
            fi

            git add data/ticket-history.json data/ticket-source-health.json data/ticket-collection-health.json
            if git diff --cached --quiet; then
              echo "No ticket-history or health changes after refreshing main."
              exit 0
            fi
            git commit -m "chore: archive verified ticket history"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::main advanced during ticket archive publish; rebuilding on latest main."
            sleep 10
          done

          echo "::error::Could not publish ticket history after 3 attempts."
          exit 1

      - name: Add ticket collection health to summary
        if: always()
        shell: bash
        run: |
          if [ -f data/ticket-collection-health.json ]; then
            echo "### Ticket collection continuity" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/ticket-collection-health.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify ticket collection is not degraded
        id: continuity
        continue-on-error: true
        run: python scripts/audit_ticket_collection_continuity.py --report data/ticket-collection-health.json --verify-report

      - name: Open or refresh ticket collection incident
        if: steps.continuity.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="🚨 Ticket collection degraded"
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          {
            echo "@keio-kawaiilab"
            echo
            echo "チケット情報収集の継続監査で異常を検出しました。"
            echo "**異常が解消するまで、販売の流れ機能を安全扱いにしません。**"
            echo
            echo '```json'
            cat data/ticket-collection-health.json
            echo '```'
            echo
            echo "Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/ticket-collection-incident.md
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/ticket-collection-incident.md
            gh issue edit "$existing" --add-assignee "keio-kawaiilab" || true
          else
            gh issue create --title "$title" --body-file /tmp/ticket-collection-incident.md --assignee "keio-kawaiilab"
          fi

      - name: Close resolved ticket collection incident
        if: steps.continuity.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="🚨 Ticket collection degraded"
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "チケット収集の継続監査が正常に戻りました。"
          fi

      - name: Fail job when ticket collection is degraded
        if: steps.continuity.outcome == 'failure'
        run: |
          echo "Ticket collection continuity is degraded; public data was not modified by this workflow."
          exit 1
