name: Finalize transit v2 strict identity

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/finalize_transit_v2.py'
      - 'scripts/audit_transit_v2.py'
      - 'data/transit-v2/service-boundaries.json'
      - '.github/workflows/finalize-transit-v2.yml'

permissions:
  contents: write

concurrency:
  group: finalize-transit-v2
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Finalize strict train identity database
        run: |
          python -m py_compile scripts/build_transit_v2.py scripts/finalize_transit_v2.py scripts/audit_transit_v2.py
          python scripts/finalize_transit_v2.py
          python scripts/audit_transit_v2.py

      - name: Validate strict identity invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          edges=json.loads(Path('data/transit-v2/same-train-edges.json').read_text(encoding='utf-8'))
          coverage=json.loads(Path('data/transit-v2/coverage.json').read_text(encoding='utf-8'))
          audit=json.loads(Path('data/transit-v2/unresolved-summary.json').read_text(encoding='utf-8'))
          policy=edges['policy']
          assert policy['runtimeInference'] is False
          assert policy['timeGapMayEstablishTrainIdentity'] is False
          assert policy['trainNumberMayEstablishTrainIdentity'] is False
          assert policy['genericSameOperatorSharedStationMayEstablishPath'] is False
          assert coverage['summary']['fragments'] > 0
          assert coverage['summary']['fragmentsWithDestination'] > 0
          assert audit['totalUnresolved'] == coverage['summary']['unresolved']
          for edge in edges['edges']:
              evidence='|'.join(edge.get('evidence') or []).lower()
              assert 'train-number' not in evidence
              assert edge.get('identityLevel') in {'authoritative','evidence-backed'}
          print(json.dumps(coverage['summary'], ensure_ascii=False, indent=2))
          PY

      - name: Commit finalized transit v2 snapshot
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/transit-v2)" ]; then
            echo "No finalized transit-v2 changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transit-v2
          git commit -m "Finalize strict train identity transit v2"
          git pull --rebase origin main
          git push origin HEAD:main
