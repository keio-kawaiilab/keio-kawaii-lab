name: Diagnose Line 8 and Line 13 exact sources

on:
  workflow_dispatch:
  push:
    branches:
      - fix/line8-line13-exact-corridors
    paths:
      - 'scripts/diagnose_line8_line13_odpt_endpoints.mjs'
      - 'scripts/diagnose_strain_pdf_layout.py'
      - '.github/workflows/diagnose-line8-line13-endpoints.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 pdfplumber==0.11.7
      - name: Inspect exact ODPT endpoint metadata
        run: node scripts/diagnose_line8_line13_odpt_endpoints.mjs
      - name: Print S-TRAIN source SHA256
        run: |
          python - <<'PY'
          import hashlib, requests
          u='https://www.seiburailway.jp/railway/reservedtrain/file/20260314_S-TRAIN_timetable.pdf'
          b=requests.get(u,timeout=(20,90),headers={'User-Agent':'Mozilla/5.0 (compatible; KeioKawaiiLabTransitDB/9.0)'}).content
          print('PDF_SHA256',hashlib.sha256(b).hexdigest(),'PDF_BYTES',len(b))
          PY
      - name: Inspect S-TRAIN PDF text layout
        run: python scripts/diagnose_strain_pdf_layout.py
