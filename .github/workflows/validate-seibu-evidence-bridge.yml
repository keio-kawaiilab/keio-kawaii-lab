name: Validate Seibu exact evidence bridge

on:
  push:
    branches:
      - transit-v2-existing-seibu-evidence-bridge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and unit test
        run: |
          python -m py_compile scripts/existing_seibu_exact_evidence.py scripts/test_existing_seibu_exact_evidence.py scripts/finalize_transit_v2.py
          python scripts/test_existing_seibu_exact_evidence.py
      - name: Re-finalize checked-in transit v2
        run: |
          python scripts/finalize_transit_v2.py
          python scripts/audit_transit_v2.py
      - name: Measure bridge effect
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          edges=json.loads(Path('data/transit-v2/same-train-edges.json').read_text(encoding='utf-8')).get('edges') or []
          coverage=json.loads(Path('data/transit-v2/coverage.json').read_text(encoding='utf-8'))
          bridge=[e for e in edges if 'existing-seibu-exact-evidence-bridge' in (e.get('evidence') or [])]
          summary=coverage.get('summary') or {}
          print('BRIDGE_EDGES',len(bridge))
          print('UNRESOLVED',summary.get('unresolved'))
          print('SAME_TRAIN_EDGES',summary.get('sameTrainEdges'))
          assert len(bridge) >= 400, len(bridge)
          assert int(summary.get('unresolved') or 999999) < 3790, summary
          assert all(e.get('identityLevel')=='evidence-backed' for e in bridge)
          PY
