name: Harden live calendar after refresh

on:
  workflow_run:
    workflows: ["Distributed live ticket calendar"]
    types: [completed]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reapply publication guards after collector refresh
        shell: bash
        run: |
          set -euo pipefail
          python scripts/guard_candy_tune_tour_integrity.py --data data/live-events.json
          python scripts/guard_birthday_year_consistency.py --data data/live-events.json
          python scripts/harden_ticket_semantics.py --data data/live-events.json
          python scripts/reconcile_physical_performance_times.py --data data/live-events.json
          python scripts/normalize_special_event_entities.py --data data/live-events.json
          python scripts/prune_special_event_placeholders.py --data data/live-events.json
          python scripts/enforce_physical_performance_identity.py
          python -m json.tool data/live-events.json >/dev/null
          python scripts/guard_candy_tune_tour_integrity.py --data data/live-events.json

      - name: Rebuild and verify public snapshot
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_schedule_snapshot.py
          python scripts/fix_schedule_shell.py
          python scripts/prune_special_event_placeholders.py --data data/live-events.json
          python scripts/build_schedule_snapshot.py
          python scripts/strip_schedule_explanations.py
          python scripts/enforce_physical_performance_identity.py
          python scripts/guard_candy_tune_tour_integrity.py --data data/live-events.json --html schedule.html
          node --check /tmp/schedule-inline.js

      - name: Publish guarded calendar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_latest_main() {
            git fetch origin main
            git reset --hard origin/main
            python scripts/guard_candy_tune_tour_integrity.py --data data/live-events.json
            python scripts/guard_birthday_year_consistency.py --data data/live-events.json
            python scripts/harden_ticket_semantics.py --data data/live-events.json
            python scripts/reconcile_physical_performance_times.py --data data/live-events.json
            python scripts/normalize_special_event_entities.py --data data/live-events.json
            python scripts/prune_special_event_placeholders.py --data data/live-events.json
            python scripts/enforce_physical_performance_identity.py
            python -m json.tool data/live-events.json >/dev/null
            python scripts/guard_candy_tune_tour_integrity.py --data data/live-events.json
            python scripts/build_schedule_snapshot.py
            python scripts/fix_schedule_shell.py
            python scripts/prune_special_event_placeholders.py --data data/live-events.json
            python scripts/build_schedule_snapshot.py
            python scripts/strip_schedule_explanations.py
            python scripts/enforce_physical_performance_identity.py
            python scripts/guard_candy_tune_tour_integrity.py --data data/live-events.json --html schedule.html
            node --check /tmp/schedule-inline.js
          }

          for attempt in 1 2 3 4; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "main changed during guarded refresh; rebuilding from latest main (attempt ${attempt})."
              rebuild_latest_main
            fi

            if git diff --quiet -- data/live-events.json schedule.html; then
              echo "Published calendar already satisfies hardening rules."
              exit 0
            fi

            git add data/live-events.json schedule.html
            git commit -m "Reapply live calendar publication guards"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main changed before push; discarding stale result and retrying from latest main."
            rebuild_latest_main
          done

          echo "Could not publish after four concurrent-update retries." >&2
          exit 1
