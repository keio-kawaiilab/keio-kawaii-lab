name: Fix duplicate schedule band identity

on:
  push:
    paths:
      - ".github/workflows/oneoff-fix-sweet-band-identity.yml"

permissions:
  contents: write

concurrency:
  group: oneoff-fix-sweet-band-identity
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch persistent band identity and regression test
        shell: bash
        run: |
          python -c "import base64;exec(base64.b64decode(' é'))"

      - name: Rebuild page and run grouping regression tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fix_schedule_shell.py
          node --check /tmp/schedule-inline.js
          node scripts/test_schedule_band_grouping.js

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/fix_schedule_shell.py scripts/test_schedule_band_grouping.js schedule.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix duplicate schedule application bands"
          git pull --rebase origin main
          git push origin HEAD:main
