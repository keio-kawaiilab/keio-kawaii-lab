name: Diagnose Keikyu Kurihama official PDF

on:
  pull_request:
    paths:
      - 'scripts/diagnose_keikyu_kurihama_geometry.py'
      - '.github/workflows/diagnose-keikyu-kurihama.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pdfplumber==0.11.7 requests==2.32.5
      - run: python scripts/diagnose_keikyu_kurihama_geometry.py
