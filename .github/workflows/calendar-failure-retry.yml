name: Calendar immediate failure retry

on:
  workflow_run:
    workflows:
      - Distributed live ticket calendar
    types:
      - completed

permissions:
  actions: write
  contents: read

concurrency:
  group: calendar-immediate-failure-retry
  cancel-in-progress: false

jobs:
  retry-once:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch one immediate recovery refresh
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Distributed calendar run ${FAILED_RUN_ID} failed; dispatching one recovery refresh on latest main."
          gh workflow run update-live-calendar-distributed.yml --repo "$GITHUB_REPOSITORY" --ref main
