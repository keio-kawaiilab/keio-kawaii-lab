name: Add route transfer time rules

on:
  push:
    paths:
      - '.github/workflows/add-transfer-time-rules.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add transfer rule engine
        run: |
          python - <<'PY'
          from pathlib import Path

          core=Path('route-core.js')
          s=core.read_text()
          old='function timedItinerary(path,timetablesByRailway,departureMinutes,service,transferMinutes){'
          new='function timedItinerary(path,timetablesByRailway,departureMinutes,service,transferMinutes,transferResolver){'
          if old not in s:
              raise SystemExit('timedItinerary signature not found')
          s=s.replace(old,new,1)

          old_block='''        var interchangeBuffer=buffer;\n        if(previous){\n          var interchangeMeters=distanceMeters(stationById.get(previous.to),stationById.get(segment.from));\n          if(interchangeMeters!==null)interchangeBuffer=Math.max(buffer,Math.min(15,Math.ceil(interchangeMeters/75)+2));\n        }\n        var earliest=current+(i>0&&!throughCandidate?interchangeBuffer:0);'''
          new_block='''        var interchangeBuffer=buffer,transferRule=null;\n        if(previous){\n          var interchangeMeters=distanceMeters(stationById.get(previous.to),stationById.get(segment.from));\n          if(interchangeMeters!==null)interchangeBuffer=Math.max(buffer,Math.min(15,Math.ceil(interchangeMeters/75)+2));\n          if(typeof transferResolver==="function"){\n            var resolvedTransfer=transferResolver({\n              fromStationId:previous.to,toStationId:segment.from,\n              fromStationName:stationName(stationById.get(previous.to)),toStationName:stationName(stationById.get(segment.from)),\n              fromRailway:previous.railway,toRailway:segment.railway,\n              fromRailwayName:railwayName(railwayById.get(previous.railway)||{"owl:sameAs":previous.railway}),\n              toRailwayName:railwayName(railwayById.get(segment.railway)||{"owl:sameAs":segment.railway}),\n              fallbackMinutes:interchangeBuffer\n            });\n            if(resolvedTransfer&&Number.isFinite(Number(resolvedTransfer.minutes))){\n              interchangeBuffer=Math.max(0,Number(resolvedTransfer.minutes));\n              transferRule=resolvedTransfer;\n            }\n          }\n        }\n        var earliest=current+(i>0&&!throughCandidate?interchangeBuffer:0);'''
          if old_block not in s:
              raise SystemExit('interchange block not found')
          s=s.replace(old_block,new_block,1)

          old_store='if(i>0&&!trip.throughFromPrevious)trip.transferMinutes=interchangeBuffer;'
          new_store='''if(i>0&&!trip.throughFromPrevious){\n          trip.transferMinutes=interchangeBuffer;\n          if(transferRule){\n            trip.transferRule=String(transferRule.id||"");\n            trip.transferRuleLabel=String(transferRule.label||"");\n            trip.transferSamePlatform=Boolean(transferRule.samePlatform);\n          }\n        }'''
          if old_store not in s:
              raise SystemExit('transfer store marker not found')
          s=s.replace(old_store,new_store,1)
          core.write_text(s)

          rules=Path('preview/transfer-guide/transfer-rules.js')
          rules.write_text(r'''(function(root){
            "use strict";
            function stationMatches(context,name){
              return String(context&&context.fromStationName||"")===name&&String(context&&context.toStationName||"")===name;
            }
            function railwayHas(value,token){return String(value||"").indexOf(token)>=0;}
            function pair(context,a,b){
              return(railwayHas(context.fromRailway,a)&&railwayHas(context.toRailway,b))||(railwayHas(context.fromRailway,b)&&railwayHas(context.toRailway,a));
            }
            function isYokosukaFamily(value){
              var id=String(value||"");
              return id.indexOf("JR-East.Yokosuka")>=0||id.indexOf("JR-East.ShonanShinjuku")>=0||id.indexOf("JR-East.Sotetsu")>=0;
            }
            var rules=[
              {id:"musashi-kosugi-jr-yokosuka-tokyu",station:"武蔵小杉",minutes:10,label:"JR横須賀線系↔東急 長距離乗換",samePlatform:false},
              {id:"nakameguro-toyoko-hibiya",station:"中目黒",minutes:0,label:"東横線↔日比谷線 対面乗換",samePlatform:true}
            ];
            function resolve(context){
              if(!context)return null;
              if(stationMatches(context,"武蔵小杉")){
                var fromJR=isYokosukaFamily(context.fromRailway),toJR=isYokosukaFamily(context.toRailway);
                var fromTokyu=railwayHas(context.fromRailway,"Tokyu."),toTokyu=railwayHas(context.toRailway,"Tokyu.");
                if((fromJR&&toTokyu)||(toJR&&fromTokyu))return Object.assign({},rules[0]);
              }
              if(stationMatches(context,"中目黒")&&pair(context,"Tokyu.Toyoko","TokyoMetro.Hibiya"))return Object.assign({},rules[1]);
              return null;
            }
            root.RouteTransferRules={rules:rules,resolve:resolve};
          })(typeof window!=="undefined"?window:globalThis);
          ''')

          preview=Path('preview/transfer-guide/preview.js')
          p=preview.read_text()
          old='var normal=model.timedItinerary(path,timetables,earliest,service,5);'
          new='var normal=model.timedItinerary(path,timetables,earliest,service,5,window.RouteTransferRules&&window.RouteTransferRules.resolve);'
          if old not in p:
              raise SystemExit('preview timedItinerary call not found')
          p=p.replace(old,new,1)

          old_render='''    function renderLeg(segment,index,total){\n      var color=safeColor(segment.color),label=esc(segment.label||"鉄道路線"),train=esc(trainLabel(segment)),from=esc(stationLabel(segment.from)),to=esc(stationLabel(segment.to));\n      var detail=[];if(train)detail.push("<strong>"+train+"</strong>");if(segment.stops)detail.push(segment.stops+"駅");if(segment.networkDirect)detail.push("直通運転");if(isEstimated(segment))detail.push("到着時刻は目安");\n      var html='<div class="route-leg"><div class="leg-clock"><span>発</span>'+formatTime(segment.departure)+'<span style="margin-top:42px">着</span>'+formatTime(segment.arrival)+'</div><div class="leg-rail" style="--route-color:'+color+'"></div><div class="leg-main"><h3>'+from+' → '+to+'</h3><div class="leg-line"><span class="line-dot" style="--route-color:'+color+'"></span><span>'+label+'</span></div><div class="leg-detail">'+detail.map(function(d){return'<span>'+d+'</span>';}).join("")+'</div></div></div>';\n      if(index<total-1&&!segment.throughFromPrevious)html+='<div class="transfer-row">↳ 乗換'+(segment.transferMinutes?"・目安 "+segment.transferMinutes+"分":"")+'</div>';\n      return html;\n    }'''
          new_render='''    function renderLeg(segment,index,total,nextSegment){\n      var color=safeColor(segment.color),label=esc(segment.label||"鉄道路線"),train=esc(trainLabel(segment)),from=esc(stationLabel(segment.from)),to=esc(stationLabel(segment.to));\n      var detail=[];if(train)detail.push("<strong>"+train+"</strong>");if(segment.stops)detail.push(segment.stops+"駅");if(segment.networkDirect)detail.push("直通運転");if(isEstimated(segment))detail.push("到着時刻は目安");\n      var html='<div class="route-leg"><div class="leg-clock"><span>発</span>'+formatTime(segment.departure)+'<span style="margin-top:42px">着</span>'+formatTime(segment.arrival)+'</div><div class="leg-rail" style="--route-color:'+color+'"></div><div class="leg-main"><h3>'+from+' → '+to+'</h3><div class="leg-line"><span class="line-dot" style="--route-color:'+color+'"></span><span>'+label+'</span></div><div class="leg-detail">'+detail.map(function(d){return'<span>'+d+'</span>';}).join("")+'</div></div></div>';\n      if(index<total-1&&nextSegment&&!nextSegment.throughFromPrevious){\n        var transferText="";\n        if(nextSegment.transferSamePlatform)transferText="・対面乗換";\n        else if(Number.isFinite(Number(nextSegment.transferMinutes)))transferText="・目安 "+Number(nextSegment.transferMinutes)+"分";\n        if(nextSegment.transferRuleLabel)transferText+=' <small>'+esc(nextSegment.transferRuleLabel)+'</small>';\n        html+='<div class="transfer-row">↳ 乗換'+transferText+'</div>';\n      }\n      return html;\n    }'''
          if old_render not in p:
              raise SystemExit('renderLeg block not found')
          p=p.replace(old_render,new_render,1)
          old_map='timed.segments.map(function(segment,i){return renderLeg(segment,i,timed.segments.length);}).join("")'
          new_map='timed.segments.map(function(segment,i){return renderLeg(segment,i,timed.segments.length,timed.segments[i+1]||null);}).join("")'
          if old_map not in p:
              raise SystemExit('renderLeg map not found')
          p=p.replace(old_map,new_map,1)
          preview.write_text(p)

          idx=Path('preview/transfer-guide/index.html')
          t=idx.read_text()
          t=t.replace('20260903-9','20260903-10')
          old_scripts='<script src="../../route-core.js?v=20260903-10"></script><script src="./route-diversity.js?v=20260903-10"></script><script src="./preview.js?v=20260903-10"></script>'
          new_scripts='<script src="../../route-core.js?v=20260903-10"></script><script src="./route-diversity.js?v=20260903-10"></script><script src="./transfer-rules.js?v=20260903-10"></script><script src="./preview.js?v=20260903-10"></script>'
          if old_scripts not in t:
              raise SystemExit('index script sequence not found')
          t=t.replace(old_scripts,new_scripts,1)
          idx.write_text(t)

          test=Path('scripts/test_transfer_rules.js')
          test.write_text(r'''global.window=global;
          require('../preview/transfer-guide/transfer-rules.js');
          const rules=global.RouteTransferRules;
          function expect(condition,message){if(!condition)throw new Error(message);}
          const musashi=rules.resolve({fromStationName:'武蔵小杉',toStationName:'武蔵小杉',fromRailway:'odpt.Railway:JR-East.Yokosuka',toRailway:'odpt.Railway:Tokyu.Toyoko'});
          expect(musashi&&musashi.minutes===10,'武蔵小杉のJR横須賀線系→東急が10分になっていない');
          const naka=rules.resolve({fromStationName:'中目黒',toStationName:'中目黒',fromRailway:'odpt.Railway:Tokyu.Toyoko',toRailway:'odpt.Railway:TokyoMetro.Hibiya'});
          expect(naka&&naka.minutes===0&&naka.samePlatform===true,'中目黒の対面乗換が同一分接続になっていない');
          expect(rules.resolve({fromStationName:'北千住',toStationName:'北千住',fromRailway:'odpt.Railway:MIR.TsukubaExpress',toRailway:'odpt.Railway:TokyoMetro.Hibiya'})===null,'未登録駅でルールを捏造している');
          const core=require('../route-core.js');
          const source=require('fs').readFileSync(require('path').join(__dirname,'..','route-core.js'),'utf8');
          expect(source.includes('transferResolver'),'route-coreに乗換ルールresolverがない');
          const preview=require('fs').readFileSync(require('path').join(__dirname,'..','preview','transfer-guide','preview.js'),'utf8');
          expect(preview.includes('RouteTransferRules&&window.RouteTransferRules.resolve'),'previewが乗換ルールを渡していない');
          console.log('Transfer rules OK',rules.rules);
          ''')
          PY
      - name: Test transfer rules
        run: |
          node --check route-core.js
          node --check preview/transfer-guide/transfer-rules.js
          node --check preview/transfer-guide/preview.js
          node scripts/test_transfer_rules.js
          node scripts/test_route_preview_smoke.js
          node scripts/test_route_preview_ui.js
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add route-core.js preview/transfer-guide/transfer-rules.js preview/transfer-guide/preview.js preview/transfer-guide/index.html scripts/test_transfer_rules.js
          git commit -m "Add station-specific transfer time rules"
          git push
