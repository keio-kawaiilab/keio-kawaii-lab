name: Update Minatomirai timetables

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * 1'
  push:
    paths:
      - 'scripts/collect_minatomirai_official.py'
      - 'scripts/audit_minatomirai_downbound.py'
      - 'scripts/probe_minatomirai_ocr.py'
      - 'scripts/probe_minatomirai_ocr_v3.py'
      - '.github/workflows/update-minatomirai-timetables.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr
          pip install requests==2.32.5 Pillow==11.3.0 pytesseract==0.3.13 numpy==2.3.2
      - name: Collect official timetables in both directions
        run: python scripts/collect_minatomirai_official.py
      - name: Cross-check saved downbound source
        run: python scripts/audit_minatomirai_downbound.py
      - name: Save timetable snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/transit/yokohama-minatomirai/official-downbound-departures.json \
            data/transit/yokohama-minatomirai/official-upbound-departures.json \
            data/transit/yokohama-minatomirai/downbound-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Minatomirai official timetable snapshots"
          git pull --rebase origin main
          git push origin HEAD:main
