name: Generate transfer rules

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/transit/transfer-rule-sources.json'
      - 'data/transit/transfer-rule-sources.d/*.json'
      - 'scripts/build-transfer-rules.mjs'
      - '.github/workflows/generate-transfer-rules.yml'
  workflow_run:
    workflows:
      - 'Generate transfer candidates'
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: generate-transfer-rules
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build transfer rules
        run: node scripts/build-transfer-rules.mjs
      - name: Validate generated JSON
        run: node -e "JSON.parse(require('fs').readFileSync('data/transit/transfer-rules.json','utf8')); console.log('transfer-rules.json OK')"
      - name: Commit generated rules
        run: |
          if [ -z "$(git status --porcelain -- data/transit/transfer-rules.json)" ]; then
            echo 'No transfer-rule changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/transit/transfer-rules.json
          git commit -m 'Update curated transfer times'

          # Other site automation may push to main while this job is building.
          # Rebase our generated commit onto the latest main before pushing so
          # unrelated concurrent updates do not make transfer generation fail.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            echo "Push attempt ${attempt} failed; rebuilding on latest main..."
            git reset --hard origin/main
            node scripts/build-transfer-rules.mjs
            node -e "JSON.parse(require('fs').readFileSync('data/transit/transfer-rules.json','utf8'))"
            if [ -z "$(git status --porcelain -- data/transit/transfer-rules.json)" ]; then
              echo 'Latest main already contains generated transfer rules.'
              exit 0
            fi
            git add data/transit/transfer-rules.json
            git commit -m 'Update curated transfer times'
            sleep 2
          done
          echo 'Failed to push generated transfer rules after retries.'
          exit 1
