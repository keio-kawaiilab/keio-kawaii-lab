name: Diagnose remaining strict transit ambiguities

# Re-run after reviewed evidence / strict physical alignment changes.
on:
  push:
    paths:
      - '.github/workflows/diagnose-remaining-transit-ambiguities.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print complete unresolved inferred fragments
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v2=Path('data/transit-v2')
          coverage=json.loads((v2/'coverage.json').read_text(encoding='utf-8'))
          fragments={}
          for path in (v2/'fragments').glob('*.json'):
            payload=json.loads(path.read_text(encoding='utf-8'))
            for row in payload.get('fragments') or []:
              if isinstance(row,dict) and row.get('id'):
                fragments[str(row['id'])]=row
          rows=[u for u in coverage.get('unresolved') or [] if u.get('kind')=='ambiguous-boundary-fragment-alignment']
          print('TOTAL',len(rows))
          for i,u in enumerate(rows,1):
            src=fragments.get(str(u.get('fragment'))) or {}
            candidates=[fragments.get(str(x)) or {} for x in u.get('candidateFragments') or []]
            print('CASE',json.dumps({
              'n':i,
              'source':src,
              'nextRailway':u.get('nextRailway'),
              'candidates':candidates,
            },ensure_ascii=False,separators=(',',':')))
          PY
