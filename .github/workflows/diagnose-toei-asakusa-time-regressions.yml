name: Diagnose Toei Asakusa time regressions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_toei_asakusa_time_regressions.py'
      - '.github/workflows/diagnose-toei-asakusa-time-regressions.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print all raw time regressions
        run: python scripts/diagnose_toei_asakusa_time_regressions.py
