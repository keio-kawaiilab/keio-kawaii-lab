name: Verify schedule identity and official discovery

on:
  push:
    branches: [main]
    paths:
      - "scripts/performance_entities.py"
      - "scripts/test_performance_entities.py"
      - "scripts/update_live_events_v2.py"
      - "scripts/continuous_official_discovery.py"
      - "scripts/apply_known_schedule_corrections.py"
      - "scripts/test_apply_known_schedule_corrections.py"
      - "scripts/audit_discovery_publication.py"
      - "scripts/test_audit_discovery_publication.py"
      - "scripts/test_continuous_official_discovery.py"
      - "scripts/test_update_live_events_v2.py"
      - "schedule-card-dedupe-v2.js"
      - "ticket-flow-sync.js"
      - "scripts/test_ticket_flow_sync_aliases.js"
      - "scripts/test_schedule_card_identity.js"
      - "going-highlight-soften.js"
      - ".github/workflows/test-schedule-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official collector dependencies
        run: pip install -r scripts/requirements.txt
      - name: Verify public performance deduplication and headline discovery
        working-directory: scripts
        run: python -m unittest -v test_performance_entities test_update_live_events_v2 test_continuous_official_discovery test_apply_known_schedule_corrections test_audit_discovery_publication
      - name: Verify browser deduplication syntax
        run: |
          node --check schedule-card-dedupe-v2.js
          node scripts/test_schedule_card_identity.js
          node --check schedule-card-fixes.js
          node --check ticket-flow-sync.js
          node scripts/test_ticket_flow_sync_aliases.js
          node --check ticket-flow-dedupe.js
          node --check going-highlight-soften.js
