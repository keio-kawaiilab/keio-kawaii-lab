name: Schedule shell build regression

on:
  push:
    branches:
      - main
    paths:
      - "scripts/fix_schedule_shell.py"
      - "scripts/strip_schedule_explanations.py"
      - ".github/workflows/test-schedule-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify schedule shell post-processing chain
        run: |
          python scripts/fix_schedule_shell.py
          python scripts/strip_schedule_explanations.py
          node --check /tmp/schedule-inline.js
