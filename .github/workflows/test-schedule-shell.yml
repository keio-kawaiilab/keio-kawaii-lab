name: Schedule shell build regression

on:
  push:
    branches:
      - main
    paths:
      - "scripts/build_schedule_snapshot.py"
      - "scripts/verified_general_sales.py"
      - "data/verified-general-sales.json"
      - "scripts/test_general_sale_runtime.js"
      - "scripts/fix_schedule_shell.py"
      - "scripts/guard_performance_runtime.py"
      - "scripts/test_performance_runtime.js"
      - "scripts/test_guard_performance_runtime.py"
      - "scripts/fix_missing_application_start_ui.py"
      - "data/live-events.json"
      - "scripts/strip_schedule_explanations.py"
      - "scripts/test_schedule_band_grouping.js"
      - "scripts/test_schedule_scope_ui.js"
      - "schedule-shared-mark-dedupe.js"
      - "schedule-weather.js"
      - "schedule.html"
      - ".github/workflows/test-schedule-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build schedule snapshot
        run: python scripts/build_schedule_snapshot.py
      - name: Apply schedule shell guards
        run: python scripts/fix_schedule_shell.py
      - name: Strip schedule explanations
        run: python scripts/strip_schedule_explanations.py
      - name: Check inline JavaScript syntax
        run: node --check /tmp/schedule-inline.js
      - name: Test application band grouping
        run: node scripts/test_schedule_band_grouping.js
      - name: Test schedule scope UI
        run: node scripts/test_schedule_scope_ui.js
      - name: Test performance runtime
        run: node scripts/test_performance_runtime.js
      - name: Test verified general sales
        run: node scripts/test_general_sale_runtime.js
      - name: Test performance guard
        run: python -m unittest discover -s scripts -p test_guard_performance_runtime.py
