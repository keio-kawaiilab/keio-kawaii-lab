name: Schedule shell build regression

on:
  push:
    branches:
      - main
    paths:
      - "scripts/build_schedule_snapshot.py"
      - "scripts/fix_schedule_shell.py"
      - "scripts/strip_schedule_explanations.py"
      - "scripts/test_schedule_band_grouping.js"
      - "scripts/test_schedule_scope_ui.js"
      - "schedule-shared-mark-dedupe.js"
      - "schedule-weather.js"
      - "schedule.html"
      - ".github/workflows/test-schedule-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify complete public schedule build chain
        run: |
          python scripts/build_schedule_snapshot.py
          python scripts/fix_schedule_shell.py
          python scripts/strip_schedule_explanations.py
          node --check /tmp/schedule-inline.js
          node scripts/test_schedule_band_grouping.js
          node scripts/test_schedule_scope_ui.js
