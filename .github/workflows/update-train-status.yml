name: Update event-day train status

on:
  push:
    branches:
      - main
    paths:
      - "scripts/refresh_train_status.py"
      - "scripts/test_refresh_train_status.py"
      - "data/live-events.json"
      - "data/venues.json"
      - ".github/workflows/update-train-status.yml"
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-event-day-train-status
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Test train-status parser
        working-directory: scripts
        run: |
          python -m unittest -v test_refresh_train_status.py
          node test_train_status.js

      - name: Refresh event-day train status
        run: python scripts/refresh_train_status.py

      - name: Commit only changed train status
        shell: bash
        run: |
          if git diff --quiet -- data/train-status.json; then
            echo "No train status change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/train-status.json
          git commit -m "chore: refresh event-day train status"
          git pull --rebase
          git push
