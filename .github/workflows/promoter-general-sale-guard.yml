name: Promoter General Sale Fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/promoter_general_sale_guard.py"
      - "scripts/test_promoter_general_sale_guard.py"
      - ".github/workflows/promoter-general-sale-guard.yml"
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: promoter-general-sale-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Regression tests
        env:
          PYTHONPATH: scripts
        run: python -m unittest scripts/test_promoter_general_sale_guard.py scripts/test_verified_general_sales.py scripts/test_audit_ticket_sources.py

      - name: Discover promoter general sales from current performances
        env:
          PYTHONPATH: scripts
        run: python scripts/promoter_general_sale_guard.py

      - name: Archive verified ticket observations
        env:
          PYTHONPATH: scripts
        run: python scripts/archive_ticket_history.py

      - name: Rebuild public general-sale display
        run: |
          python scripts/build_schedule_snapshot.py
          python scripts/fix_schedule_shell.py
          python scripts/strip_schedule_explanations.py
          python scripts/build_live_runtime_fallback.py
          node scripts/test_general_sale_runtime.js

      - name: Commit recovered ticket history
        shell: bash
        run: |
          if git diff --quiet -- data/live-events.json data/ticket-history.json schedule.html live-runtime-fallback.js; then
            echo "No promoter ticket-history changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-events.json data/ticket-history.json schedule.html live-runtime-fallback.js
          git commit -m "Recover promoter general sale history"
          if git push origin HEAD:main; then
            exit 0
          fi
          for attempt in 1 2 3; do
            git fetch origin main
            retry_dir="$(mktemp -d /tmp/promoter-publish.XXXXXX)"
            git worktree add --detach "$retry_dir" origin/main
            if (
              set -euo pipefail
              cd "$retry_dir" || exit 1
              python scripts/promoter_general_sale_guard.py || exit 1
              python scripts/archive_ticket_history.py || exit 1
              python scripts/build_schedule_snapshot.py || exit 1
              python scripts/fix_schedule_shell.py || exit 1
              python scripts/strip_schedule_explanations.py || exit 1
              python scripts/build_live_runtime_fallback.py || exit 1
              node scripts/test_general_sale_runtime.js || exit 1
              git add data/live-events.json data/ticket-history.json schedule.html live-runtime-fallback.js || exit 1
              if git diff --cached --quiet; then exit 0; fi
              git commit -m "Recover promoter general sale history from latest main" || exit 1
              git push origin HEAD:main
            ); then
              exit 0
            fi
          done
          echo "Latest-main publication did not complete after three retries." >&2
          exit 1
