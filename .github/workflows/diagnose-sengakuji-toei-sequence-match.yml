name: Diagnose Sengakuji Toei sequence match

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_sengakuji_toei_sequence_match.py'
      - '.github/workflows/diagnose-sengakuji-toei-sequence-match.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: python -m pip install pdfplumber requests
      - name: Compare multi-station Toei sequences
        run: python scripts/diagnose_sengakuji_toei_sequence_match.py
