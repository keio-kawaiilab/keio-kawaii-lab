name: Apply canonical special-event entities

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-special-event-entities.yml"
      - "scripts/schedule_audit_corrections.py"
      - "scripts/ohanami_two_show_correction.py"
      - "scripts/performance_entities.py"
      - "scripts/install_performance_public_view.py"
      - "scripts/strip_schedule_explanations.py"
      - "scripts/fix_missing_application_start_ui.py"
      - "scripts/test_schedule_scope_ui.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-canonical-special-event-entities
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify canonical model
        working-directory: scripts
        run: |
          python -m unittest -v test_special_event_entities.py
          python -m unittest -v test_special_event_occurrence_details.py
          python -m unittest -v test_schedule_audit_corrections.py
          python -m unittest -v test_performance_entities.py
      - name: Migrate public data and rebuild schedule
        run: |
          python scripts/normalize_special_event_entities.py
          python scripts/schedule_audit_corrections.py --fail-on-conflict
          python scripts/build_schedule_snapshot.py
          python scripts/fix_schedule_shell.py
          python scripts/strip_schedule_explanations.py
          node --check /tmp/schedule-inline.js
          node scripts/test_schedule_band_grouping.js
          node scripts/test_schedule_scope_ui.js
          python scripts/normalize_special_event_entities.py --check
          python scripts/schedule_audit_corrections.py --check --fail-on-conflict
      - name: Commit canonical public data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rebuild_latest() {
            python scripts/normalize_special_event_entities.py
            python scripts/schedule_audit_corrections.py --fail-on-conflict
            python scripts/build_schedule_snapshot.py
            python scripts/fix_schedule_shell.py
            python scripts/strip_schedule_explanations.py
            node --check /tmp/schedule-inline.js
            node scripts/test_schedule_band_grouping.js
            node scripts/test_schedule_scope_ui.js
            python scripts/normalize_special_event_entities.py --check
            python scripts/schedule_audit_corrections.py --check --fail-on-conflict
          }

          commit_if_changed() {
            if [ -z "$(git status --porcelain -- data/live-events.json schedule.html)" ]; then
              echo "Public data is already canonical."
              return 1
            fi
            git add data/live-events.json schedule.html
            git commit -m "chore: migrate special events to canonical entities"
            return 0
          }

          if ! commit_if_changed; then
            exit 0
          fi

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Concurrent calendar writer detected on attempt ${attempt}; rebuilding from latest main instead of rebasing generated files."
            git fetch origin main
            git reset --hard origin/main
            rebuild_latest
            if ! commit_if_changed; then
              exit 0
            fi
          done

          echo "Unable to publish canonical public data after rebuilding latest main three times."
          exit 1
