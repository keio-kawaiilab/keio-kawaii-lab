name: Official X special-event health check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/check-official-x-special.yml"
      - "scripts/update_official_x_special_events_syndication.py"
      - "scripts/test_update_official_x_special_events_syndication.py"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Test CANDY TUNE multi-date release discovery
        working-directory: scripts
        run: python -m unittest -v test_update_official_x_special_events_syndication.py
      - name: Probe current official X syndication timelines
        run: python scripts/update_official_x_special_events_syndication.py --check
