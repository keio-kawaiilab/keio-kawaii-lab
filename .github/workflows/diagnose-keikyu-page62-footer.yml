name: Diagnose Keikyu footer geometry

on:
  push:
    branches:
      - work/keikyu-prev-page-evidence-20260906
    paths:
      - '.github/workflows/diagnose-keikyu-page62-footer.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Compare missing and normal footer geometry
        run: |
          python - <<'PY'
          import re, statistics, tempfile
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from keikyu_official_pdf import download_official_pdf, bbox_words
          from audit_keikyu_previous_publication_refs import detect_printed_page_number

          numeric = re.compile(r'^\d{1,3}$')
          with tempfile.TemporaryDirectory() as td:
              pdf = Path(td) / 'schedule_all.pdf'
              download_official_pdf(pdf)
              for page in (8, 37, 67, 68, 100):
                  width, height, words = bbox_words(pdf, page)
                  print('=== PDF_PAGE', page, 'SIZE', width, height, 'DETECTED', detect_printed_page_number(width, height, words), '===')
                  rows=[]
                  for w in words:
                      if not numeric.fullmatch(w.text):
                          continue
                      if w.y < height * 0.82:
                          continue
                      if not (w.x < width * 0.18 or w.x > width * 0.82):
                          continue
                      rows.append((w.text,w.x,w.y,w.y_max-w.y_min,w.x_min,w.x_max))
                  for row in sorted(rows, key=lambda r:(r[2],r[1])):
                      print('NUM', *row)
                  heights=[r[3] for r in rows]
                  if heights:
                      print('HEIGHTS min/median/max', min(heights), statistics.median(heights), max(heights))
          PY
