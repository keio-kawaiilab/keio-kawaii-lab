name: Fix JobanRapid transfer rules

on:
  push:
    paths:
      - '.github/workflows/fix-ueno-transfer-rule.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix JobanRapid railway ids
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'data/transit/transfer-rule-sources.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          let count = 0;
          for (const row of data.rules) {
            if ((row.place === '上野' || row.place === '日暮里') && row.railwayB === 'odpt.Railway:JR-East.Joban') {
              row.railwayB = 'odpt.Railway:JR-East.JobanRapid';
              row.railwayBName = '常磐線快速';
              count++;
            }
            if ((row.place === '上野' || row.place === '日暮里') && row.railwayA === 'odpt.Railway:JR-East.Joban') {
              row.railwayA = 'odpt.Railway:JR-East.JobanRapid';
              row.railwayAName = '常磐線快速';
              count++;
            }
          }
          if (count < 2) throw new Error(`Expected at least 2 Joban rules to fix, got ${count}`);
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          NODE
      - name: Rebuild transfer rules
        run: node scripts/build-transfer-rules.mjs
      - name: Validate generated JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/transit/transfer-rule-sources.json','utf8')); JSON.parse(require('fs').readFileSync('data/transit/transfer-rules.json','utf8'));"
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/transit/transfer-rule-sources.json data/transit/transfer-rules.json
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'Fix JobanRapid transfer rule ids'
          git push
