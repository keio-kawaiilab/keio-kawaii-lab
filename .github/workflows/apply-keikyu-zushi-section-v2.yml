name: Apply Keikyu Zushi section-aware V2 evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-keikyu-zushi-section-v2.yml'

permissions:
  contents: write

concurrency:
  group: transit-db-writer
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main under writer lock
        run: |
          git fetch origin main
          git checkout -B main origin/main
          echo "MATERIALIZE_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install strict PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pip install pdfplumber==0.11.7 PyMuPDF==1.26.4 requests==2.32.5
      - name: Compile and test V2 safety pipeline
        run: |
          python -m py_compile \
            scripts/keikyu_official_pdf.py \
            scripts/build_keikyu_official_stop_times.py \
            scripts/audit_keikyu_previous_publication_refs.py \
            scripts/build_keikyu_cross_page_identity_audit.py \
            scripts/verify_keikyu_cross_page_identity_audit.py \
            scripts/keikyu_schedule_all_zushi_evidence.py \
            scripts/keikyu_cross_page_zushi_evidence_v2.py \
            scripts/keikyu_internal_generated_evidence.py \
            scripts/merge_keikyu_zushi_section_v2.py \
            scripts/test_keikyu_section_aware_pdf.py \
            scripts/test_keikyu_section_local_consumer.py \
            scripts/test_keikyu_internal_generated_evidence.py
          python scripts/test_keikyu_section_aware_pdf.py
          python scripts/test_keikyu_section_local_consumer.py
          python scripts/test_keikyu_internal_generated_evidence.py
      - name: Download official full timetable once
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from keikyu_official_pdf import download_official_pdf
          download_official_pdf(Path('/tmp/keikyu-schedule-all.pdf'))
          PY
      - name: Rebuild section-local official dataset from scratch
        run: |
          python scripts/build_keikyu_official_stop_times.py \
            --pdf /tmp/keikyu-schedule-all.pdf \
            --output /tmp/keikyu-stop-times-v2.json
          python scripts/audit_keikyu_previous_publication_refs.py \
            --pdf /tmp/keikyu-schedule-all.pdf \
            --output /tmp/keikyu-previous-refs-v2.json
          python scripts/build_keikyu_cross_page_identity_audit.py \
            /tmp/keikyu-stop-times-v2.json \
            /tmp/keikyu-previous-refs-v2.json \
            --output /tmp/keikyu-cross-page-v2.json
          python scripts/verify_keikyu_cross_page_identity_audit.py \
            /tmp/keikyu-cross-page-v2.json
      - name: Freshly prove Zushi local V2 and diagnose cross-page V2
        run: |
          python scripts/keikyu_schedule_all_zushi_evidence.py \
            --official-stop-times /tmp/keikyu-stop-times-v2.json \
            --entries-output /tmp/zushi-section-v2-entries.json \
            --report /tmp/zushi-section-v2-report.json
          python scripts/keikyu_cross_page_zushi_evidence_v2.py \
            --official-stop-times /tmp/keikyu-stop-times-v2.json \
            --cross-page-audit /tmp/keikyu-cross-page-v2.json \
            --existing data/transit-v2/keikyu-internal-official-train-evidence.json \
            --output /tmp/evidence-cross-dry-run.json \
            --report /tmp/zushi-cross-v2-report.json
      - name: Require fresh strict local proofs and clean graph
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          local=json.loads(Path('/tmp/zushi-section-v2-report.json').read_text(encoding='utf-8'))
          graph=json.loads(Path('/tmp/keikyu-cross-page-v2.json').read_text(encoding='utf-8'))
          stop=json.loads(Path('/tmp/keikyu-stop-times-v2.json').read_text(encoding='utf-8'))
          matched=int(local.get('matchedSingleton') or 0)
          print('FRESH_V2_SECTIONS', stop['totals']['timetableSections'])
          print('FRESH_V2_FRAGMENTS', stop['totals']['trainColumnFragments'])
          print('FRESH_V2_ZUSHI_LOCAL_PROVEN', matched)
          print('FRESH_V2_GRAPH_EDGES', graph['materializedCandidateEdgeCount'])
          print('FRESH_V2_GRAPH_ISSUES', len(graph.get('issues') or []))
          if matched <= 0:
              raise SystemExit('no fresh section-local Zushi proofs; production DB left untouched')
          if graph.get('issues') or graph.get('branchingTargets') or graph.get('multiplePreviousSources') or graph.get('cycles'):
              raise SystemExit('section-aware explicit identity graph is not structurally clean')
          PY
      - name: Merge only fresh V2 local proofs
        run: |
          cp data/transit-v2/keikyu-internal-official-train-evidence.json /tmp/evidence-before-v2.json
          python scripts/merge_keikyu_zushi_section_v2.py \
            --existing /tmp/evidence-before-v2.json \
            --entries /tmp/zushi-section-v2-entries.json \
            --report /tmp/zushi-section-v2-report.json \
            --cross-report /tmp/zushi-cross-v2-report.json \
            --output data/transit-v2/keikyu-internal-official-train-evidence.json \
            --summary-output /tmp/zushi-section-v2-merge.json
      - name: Re-finalize and audit complete transit DB
        run: |
          python scripts/finalize_transit_v2.py
          python scripts/audit_transit_v2.py
      - name: Verify every fresh proof materialized and no deprecated proof survived
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ROOT=Path('data/transit-v2')
          marker='schedule-all-page-section-column-v2'
          deprecated={'schedule-all-page-column-v1','official-previous-publication-chain-two-exact-station-times-v1'}
          proof=json.loads(Path('/tmp/zushi-section-v2-entries.json').read_text(encoding='utf-8')).get('entries') or []
          pairs={(str(r.get('fromFragment') or ''),str(r.get('toFragment') or '')) for r in proof}
          ids={str(r.get('id') or '') for r in proof}
          evidence=json.loads((ROOT/'keikyu-internal-official-train-evidence.json').read_text(encoding='utf-8'))
          ev_entries=evidence.get('entries') or []
          v2=[r for r in ev_entries if marker in {str(v) for v in r.get('evidence') or []}]
          old=[r for r in ev_entries if deprecated & {str(v) for v in r.get('evidence') or []}]
          edges=json.loads((ROOT/'same-train-edges.json').read_text(encoding='utf-8')).get('edges') or []
          materialized={(str(r.get('fromFragment') or ''),str(r.get('toFragment') or '')) for r in edges if r.get('classification')=='same-train'}
          unresolved=json.loads((ROOT/'coverage.json').read_text(encoding='utf-8')).get('unresolved') or []
          lingering={str(r.get('fragment') or '') for r in unresolved if r.get('kind')=='missing-boundary-train-identity-evidence'}
          rejected={str(r.get('evidenceId') or '') for r in unresolved if r.get('kind')=='keikyu-internal-generated-evidence-rejected'}
          missing=sorted(pairs-materialized)
          still=sorted({a for a,_b in pairs}&lingering)
          bad=sorted(ids&rejected)
          summary=evidence.get('summary') or {}
          print('V2_PROVEN',len(pairs))
          print('V2_EVIDENCE_ENTRIES',len(v2))
          print('V2_MATERIALIZED',len(pairs&materialized))
          print('V2_STILL_UNRESOLVED',len(still))
          print('V2_REJECTED',len(bad))
          print('DEPRECATED_UNBANDED_REMAINING',len(old))
          print('TOTAL_KEIKYU_EVIDENCE_ENTRIES',len(ev_entries))
          print('SUMMARY_MATCHED_SINGLETON',summary.get('matchedSingleton'))
          if not pairs:
              raise SystemExit('fresh V2 proof set is empty')
          if len(v2) != len(pairs):
              raise SystemExit(f'V2 evidence count mismatch entries={len(v2)} proof={len(pairs)}')
          if missing:
              raise SystemExit(f'fresh V2 proven edges missing after finalize: {missing[:5]}')
          if still:
              raise SystemExit(f'fresh V2 proven sources still unresolved: {still[:5]}')
          if bad:
              raise SystemExit(f'fresh V2 evidence rejected by consumer: {bad[:5]}')
          if old:
              raise SystemExit('deprecated unbanded evidence survived merge')
          if int(summary.get('matchedSingleton') or -1) != len(ev_entries):
              raise SystemExit('summary matchedSingleton does not equal actual evidence entry count')
          PY
      - name: Commit only verified generated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/transit-v2/keikyu-internal-official-train-evidence.json \
            data/transit-v2/same-train-edges.json \
            data/transit-v2/runtime-same-train.json \
            data/transit-v2/coverage.json \
            data/transit-v2/index.json \
            data/transit-v2/unresolved-summary.json
          if git diff --cached --quiet; then
            echo "Section-aware V2 evidence already materialized"
            exit 0
          fi
          git fetch origin main
          remote="$(git rev-parse origin/main)"
          if [ "$MATERIALIZE_BASE" != "$remote" ]; then
            echo "main moved during fresh V2 proof; refusing stale generated DB commit"
            exit 1
          fi
          git commit -m "Apply strict Keikyu Zushi section V2 evidence"
          git push origin HEAD:main
