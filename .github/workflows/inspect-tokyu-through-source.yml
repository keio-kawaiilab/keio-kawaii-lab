name: Inspect Tokyu through-train source (manual probe)

# transfer.navitime.biz/tokyu is linked from Tokyu's timetable experience and
# exposes exact one-train stop sequences, but it currently returns HTTP 403 to
# GitHub-hosted Azure runners. Keep this as an explicit diagnostic only; it must
# not create recurring red CI or be treated as the automated production source.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explain source status
        run: |
          echo 'Manual diagnostic only: Tokyu-linked per-train source blocks GitHub-hosted runners with HTTP 403.'
          echo 'Current automated Line 13 collection therefore uses reachable current official sources.'
      - name: Validate probe syntax
        run: python -m py_compile scripts/inspect_tokyu_through_train_detail_source.py
