name: Fast SUKISUKI ticket refresh

on:
  push:
    branches:
      - main
    paths:
      - "scripts/update_sukisuki_events.py"
      - "scripts/test_update_sukisuki_events.py"
      - "scripts/resolve_source_priority.py"
      - "scripts/test_resolve_source_priority.py"
      - ".github/workflows/update-sukisuki-fast.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-live-ticket-calendar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-sukisuki:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Test SUKISUKI discovery and sale-round retention
        working-directory: scripts
        run: python -m unittest -v test_update_sukisuki_events.py test_resolve_source_priority.py

      - name: Refresh SUKISUKI public data
        run: |
          python scripts/update_sukisuki_events.py
          python scripts/resolve_source_priority.py
          python scripts/build_schedule_snapshot.py
          python scripts/fix_schedule_shell.py
          node --check /tmp/schedule-inline.js

      - name: Commit when SUKISUKI data changed
        shell: bash
        run: |
          if git diff --quiet -- data/live-events.json schedule.html; then
            echo "No SUKISUKI changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-events.json schedule.html
          git commit -m "chore: refresh SUKISUKI ticket data"
          git push
