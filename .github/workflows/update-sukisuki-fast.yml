name: Fast SUKISUKI ticket refresh

on:
  push:
    branches:
      - main
    paths:
      - "scripts/update_sukisuki_events.py"
      - "scripts/test_update_sukisuki_events.py"
      - "scripts/audit_schedule_release.py"
      - "scripts/audit_schedule_release_grouped.py"
      - "scripts/test_audit_schedule_release.py"
      - "scripts/test_audit_schedule_release_grouped.py"
      - "scripts/prepare_release_candidate.py"
      - "scripts/test_prepare_release_candidate.py"
      - "scripts/resolve_source_priority.py"
      - "scripts/test_resolve_source_priority.py"
      - "data/schedule-control.json"
      - ".github/workflows/update-sukisuki-fast.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-live-ticket-calendar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-sukisuki:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read emergency freeze control
        id: control
        shell: bash
        run: |
          frozen="$(python - <<'PY'
          import json
          with open('data/schedule-control.json', encoding='utf-8') as f:
              print(str(bool(json.load(f).get('freeze'))).lower())
          PY
          )"
          echo "frozen=$frozen" >> "$GITHUB_OUTPUT"
          if [ "$frozen" = "true" ]; then
            echo "Fast SUKISUKI auto-publication is FROZEN."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Test SUKISUKI discovery and release gate
        working-directory: scripts
        run: >-
          python -m unittest -v
          test_update_sukisuki_events.py
          test_resolve_source_priority.py
          test_audit_schedule_release.py
          test_audit_schedule_release_grouped.py
          test_prepare_release_candidate.py
          test_schedule_scope.py

      - name: Refresh SUKISUKI candidate data
        if: steps.control.outputs.frozen != 'true'
        run: |
          cp data/live-events.json /tmp/live-events-last-good.json
          python scripts/update_sukisuki_events.py
          python scripts/resolve_source_priority.py
          python scripts/apply_event_scopes.py
          python scripts/prepare_release_candidate.py --previous /tmp/live-events-last-good.json

      - name: Fail-closed SUKISUKI release audit
        if: steps.control.outputs.frozen != 'true'
        run: |
          python scripts/audit_schedule_release_grouped.py \
            --previous /tmp/live-events-last-good.json \
            --candidate data/live-events.json \
            --report data/schedule-health.json

      - name: Build public schedule only after audit passes
        if: steps.control.outputs.frozen != 'true'
        run: |
          python scripts/build_schedule_snapshot.py
          python scripts/fix_schedule_shell.py
          python scripts/strip_schedule_explanations.py
          node --check /tmp/schedule-inline.js
          node scripts/test_schedule_scope_ui.js

      - name: Open incident when release audit blocks publication
        if: failure() && steps.control.outputs.frozen != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="🚨 SUKISUKI schedule refresh blocked"
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          {
            echo "@keio-kawaiilab"
            echo
            echo "SUKISUKI高速更新で取得失敗または監査エラーを検出したため、SUKISUKI部分は前回正常版を維持しています。"
            echo
            if [ -f data/schedule-health.json ]; then
              echo '```json'
              cat data/schedule-health.json
              echo '```'
            fi
            echo
            echo "Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/sukisuki-incident.md
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/sukisuki-incident.md
          else
            gh issue create --title "$title" --body-file /tmp/sukisuki-incident.md --assignee "keio-kawaiilab"
          fi

      - name: Close resolved SUKISUKI incident
        if: success() && steps.control.outputs.frozen != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="🚨 SUKISUKI schedule refresh blocked"
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "SUKISUKI取得と監査が正常に通過したため、高速更新を再開しました。"
          fi

      - name: Commit only audited SUKISUKI changes
        if: steps.control.outputs.frozen != 'true'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/live-events.json data/schedule-health.json schedule.html)" ]; then
            echo "No audited SUKISUKI changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-events.json data/schedule-health.json schedule.html
          git commit -m "chore: publish audited SUKISUKI ticket data"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push attempt ${attempt} was rejected; rebasing onto latest main."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Concurrent calendar output overlaps this refresh; refusing to overwrite it."
              exit 1
            fi
          done
          exit 1
