name: Inspect blocked special-event announcements

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-special-parse-failures.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect official pages
        shell: bash
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          urls = [
            'https://fruitszipper.asobisystem.com/news/detail/87361',
            'https://morestar.asobisystem.com/news/detail/87393',
            'https://morestar.asobisystem.com/news/detail/87047',
          ]
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          for url in urls:
              print('\n===',url,'===')
              r=s.get(url,timeout=25); print('status',r.status_code,'bytes',len(r.content)); r.raise_for_status()
              soup=BeautifulSoup(r.text,'html.parser')
              title=soup.title.get_text(' ',strip=True) if soup.title else ''
              text='\n'.join(x.strip() for x in soup.get_text('\n',strip=True).splitlines() if x.strip())
              print('TITLE:',title)
              print('TEXT:')
              print(text[:7000])
              print('LINKS:')
              for a in soup.find_all('a',href=True):
                  href=a.get('href',''); label=' '.join(a.stripped_strings)
                  if any(k in (href+' '+label) for k in ['リリ','特典','live_information','goods-order','HMV','楽天','tower']):
                      print(label[:120],'=>',href[:300])
          PY
