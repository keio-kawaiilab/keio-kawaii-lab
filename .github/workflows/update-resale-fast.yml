name: Update official resale tickets

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_resale_events.py"
      - "scripts/test_update_resale_events.py"
      - "ticket-resale-ui.js"
      - "going-highlight-soften.js"
      - ".github/workflows/update-resale-fast.yml"
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# This workflow writes live-events.json/schedule.html too. Serialize it with
# the main distributed calendar publisher so one valid refresh cannot make the
# other fail at the final git push/rebase step.
concurrency:
  group: distributed-live-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Finalize resale parser and cache chain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = "202608300345"

          collector = Path("scripts/update_resale_events.py")
          text = collector.read_text(encoding="utf-8")

          # A resale window must be read from the window row itself. Looking ahead
          # into subsequent rows can accidentally consume the next performance date.
          text = text.replace(
              '        segment = " ".join(lines[index:index + 3])\n        values = date_matches(segment, article_year)',
              '        segment = line\n        values = date_matches(segment, article_year)',
          )

          # When the matched schedule source is a tour-wide event, copy the exact
          # venue/times for this performance date so the resale attaches to the
          # existing performance card rather than creating a second generic card.
          old_return = '''    candidates.sort(key=lambda row: row[0], reverse=True)\n    return dict(candidates[0][1]) if candidates else None\n'''
          new_return = '''    candidates.sort(key=lambda row: row[0], reverse=True)\n    if not candidates:\n        return None\n    chosen = dict(candidates[0][1])\n    for schedule_row in chosen.get("schedule") or []:\n        if not isinstance(schedule_row, dict) or clean(schedule_row.get("date"))[:10] != day:\n            continue\n        chosen["eventDate"] = day\n        chosen["venue"] = schedule_row.get("venue") or chosen.get("venue")\n        chosen["openTime"] = schedule_row.get("openTime") or chosen.get("openTime")\n        chosen["startTime"] = schedule_row.get("startTime") or chosen.get("startTime")\n        break\n    return chosen\n'''
          if old_return in text:
              text = text.replace(old_return, new_return, 1)
          collector.write_text(text, encoding="utf-8")

          loader = Path("going-highlight-soften.js")
          text = loader.read_text(encoding="utf-8")
          text = re.sub(r'var version="\d+";', f'var version="{version}";', text)
          loader.write_text(text, encoding="utf-8")

          train = Path("train-status.js")
          text = train.read_text(encoding="utf-8")
          text = re.sub(r'going-highlight-soften\.js\?v=\d+', f'going-highlight-soften.js?v={version}', text)
          train.write_text(text, encoding="utf-8")

          builder = Path("scripts/build_schedule_snapshot.py")
          text = builder.read_text(encoding="utf-8")
          text = re.sub(r'train-status\.js\?v=\d+', f'train-status.js?v={version}', text)
          builder.write_text(text, encoding="utf-8")

          schedule = Path("schedule.html")
          text = schedule.read_text(encoding="utf-8")
          text = re.sub(r'train-status\.js\?v=\d+', f'train-status.js?v={version}', text)
          schedule.write_text(text, encoding="utf-8")
          PY

      - name: Test resale parser and browser scripts
        shell: bash
        run: |
          cd scripts
          python -m unittest -v test_update_resale_events.py
          cd ..
          python -m py_compile scripts/update_resale_events.py
          node --check ticket-resale-ui.js
          node --check going-highlight-soften.js
          node --check ticket-flow.js
          node --check ticket-flow-sync.js

      - name: Collect announced official resale windows
        shell: bash
        run: |
          set -euo pipefail
          cp data/live-events.json /tmp/live-events-before-resale.json
          python scripts/update_resale_events.py
          python scripts/enrich_event_metadata.py
          python scripts/apply_event_scopes.py
          python scripts/archive_ticket_history.py
          python scripts/prepare_release_candidate.py --previous /tmp/live-events-before-resale.json
          python scripts/audit_schedule_release_grouped.py \
            --previous /tmp/live-events-before-resale.json \
            --candidate data/live-events.json \
            --report data/schedule-health.json
          python scripts/build_schedule_snapshot.py
          python scripts/fix_schedule_shell.py
          python scripts/strip_schedule_explanations.py
          node --check /tmp/schedule-inline.js

      - name: Commit resale data and UI cache update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/update_resale_events.py \
            scripts/build_schedule_snapshot.py \
            going-highlight-soften.js \
            train-status.js \
            data/live-events.json \
            data/ticket-history.json \
            data/schedule-health.json \
            schedule.html
          if git diff --cached --quiet; then
            echo "No resale changes."
            exit 0
          fi
          git commit -m "chore: publish official resale tickets"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1
