name: Update official resale tickets

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_resale_events.py"
      - "scripts/test_update_resale_events.py"
      - "ticket-resale-ui.js"
      - "going-highlight-soften.js"
      - ".github/workflows/update-resale-fast.yml"
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-official-resale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Finalize persistent resale support and cache chain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = "202608300300"

          collector = Path("scripts/update_resale_events.py")
          text = collector.read_text(encoding="utf-8")
          text = text.replace(
              '        "sourcePublishedAt": article_date,\n        "applicationStatus": status,',
              '        "sourcePublishedAt": article_date,\n        "eventScope": base_event.get("eventScope"),\n        "participants": base_event.get("participants") or [],\n        "applicationStatus": status,',
          )
          text = text.replace(
              '        if event_day < today.isoformat() or end < now:\n            continue',
              '        if event_day < today.isoformat():\n            continue',
          )
          text = text.replace(
              '''    excluded = {str(article_date or "")[:10]}\n    for _, start, end in windows:\n        excluded.add(start[:10])\n        excluded.add(end[:10])\n''',
              '''    # Window rows are skipped below, so a performance date must not be discarded\n    # just because it happens to equal another resale window's start/end date.\n    excluded = {str(article_date or "")[:10]}\n''',
          )
          old = '''        if not ("日程" in line or "公演" in line or "会場" in line or re.match(r"^[\\s　【\\[（(]*20?\\d{0,4}年?\\s*\\d{1,2}[月/.-]\\s*\\d{1,2}", line)):\n            continue\n'''
          new = '''        first = base.DATE_ANY_RE.search(line)\n        date_near_start = bool(first and first.start() <= 8)\n        if not ("日程" in line or "公演" in line or "会場" in line or date_near_start):\n            continue\n'''
          if old not in text:
              raise SystemExit("resale event-date guard not found")
          text = text.replace(old, new, 1)
          collector.write_text(text, encoding="utf-8")

          train = Path("train-status.js")
          text = train.read_text(encoding="utf-8")
          text = re.sub(r'going-highlight-soften\.js\?v=\d+', f'going-highlight-soften.js?v={version}', text)
          train.write_text(text, encoding="utf-8")

          builder = Path("scripts/build_schedule_snapshot.py")
          text = builder.read_text(encoding="utf-8")
          text = re.sub(r'train-status\.js\?v=\d+', f'train-status.js?v={version}', text)
          builder.write_text(text, encoding="utf-8")

          schedule = Path("schedule.html")
          text = schedule.read_text(encoding="utf-8")
          text = re.sub(r'train-status\.js\?v=\d+', f'train-status.js?v={version}', text)
          schedule.write_text(text, encoding="utf-8")
          PY

      - name: Test resale parser and browser scripts
        shell: bash
        run: |
          cd scripts
          python -m unittest -v test_update_resale_events.py
          cd ..
          python -m py_compile scripts/update_resale_events.py
          node --check ticket-resale-ui.js
          node --check going-highlight-soften.js
          node --check ticket-flow.js
          node --check ticket-flow-sync.js

      - name: Collect announced official resale windows
        shell: bash
        run: |
          set -euo pipefail
          cp data/live-events.json /tmp/live-events-before-resale.json
          python scripts/update_resale_events.py
          python scripts/enrich_event_metadata.py
          python scripts/apply_event_scopes.py
          python scripts/archive_ticket_history.py
          python scripts/prepare_release_candidate.py --previous /tmp/live-events-before-resale.json
          python scripts/audit_schedule_release_grouped.py \
            --previous /tmp/live-events-before-resale.json \
            --candidate data/live-events.json \
            --report data/schedule-health.json
          python scripts/build_schedule_snapshot.py
          python scripts/fix_schedule_shell.py
          python scripts/strip_schedule_explanations.py
          node --check /tmp/schedule-inline.js

      - name: Commit resale data and UI cache update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/update_resale_events.py \
            scripts/build_schedule_snapshot.py \
            train-status.js \
            data/live-events.json \
            data/ticket-history.json \
            data/schedule-health.json \
            schedule.html
          if git diff --cached --quiet; then
            echo "No resale changes."
            exit 0
          fi
          git commit -m "chore: publish official resale tickets"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1
