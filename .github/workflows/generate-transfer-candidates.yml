name: Generate transfer candidates

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-transfer-candidates.yml'
      - 'scripts/build-transfer-candidates.mjs'
      - 'data/transit/manifest.json'
      - 'data/transit/*/entities.json'
      - 'data/transit/*/timetable-index.json'
  workflow_run:
    workflows:
      - 'Update transit timetables'
      - 'Collect Keisei timetables'
      - 'Update Minatomirai timetables'
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: generate-transfer-candidates
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build transfer candidates
        run: node scripts/build-transfer-candidates.mjs
      - name: Upload generated audit
        uses: actions/upload-artifact@v4
        with:
          name: transfer-candidates
          path: data/transit/transfer-candidates.json
      - name: Commit generated data
        run: |
          if git diff --quiet -- data/transit/transfer-candidates.json; then
            echo 'No transfer-candidate changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/transit/transfer-candidates.json
          git commit -m 'Update transfer candidate data'
          git push
