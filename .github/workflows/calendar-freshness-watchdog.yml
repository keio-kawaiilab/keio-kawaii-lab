name: Calendar freshness watchdog

on:
  # Do not rely on GitHub's scheduler alone. Any main-branch activity is an
  # additional heartbeat that can notice a stale public calendar.
  push:
    branches:
      - main
  schedule:
    # Offset away from the top-of-hour minute boundary to reduce scheduler
    # contention while keeping a 10-minute target cadence.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_run:
    # Independent workflows provide extra wake-ups if this workflow's own
    # scheduled event is delayed or omitted.
    workflows:
      - "Distributed live ticket calendar"
      - "Update event-day train status"
      - "Archive verified ticket history"
      - "Update upcoming event weather"
      - "Update official resale tickets"
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: calendar-freshness-watchdog
  cancel-in-progress: true

jobs:
  recover-stale-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check published calendar freshness
        id: freshness
        shell: bash
        run: |
          set -euo pipefail

          # The user-visible timestamp is the source of truth.
          published_at="$(jq -r '.checkedAt // .updatedAt // empty' data/live-events.json)"
          now="$(date -u +%s)"
          stale=true
          age_minutes="999999.0"

          if [ -n "$published_at" ]; then
            published_epoch="$(date -u -d "$published_at" +%s)"
            age_seconds="$((now - published_epoch))"
            if [ "$age_seconds" -lt 0 ]; then age_seconds=0; fi
            age_minutes="$(awk -v seconds="$age_seconds" 'BEGIN { printf "%.1f", seconds / 60 }')"

            # The primary ingestion targets 15-minute starts. Recover before
            # two full expected cycles can pass without a public observation.
            if [ "$age_seconds" -le 1500 ]; then
              stale=false
            fi
          fi

          echo "stale=$stale" >> "$GITHUB_OUTPUT"
          echo "age_minutes=$age_minutes" >> "$GITHUB_OUTPUT"
          echo "updated_at=${published_at:-missing}" >> "$GITHUB_OUTPUT"
          echo "Published calendar timestamp: ${published_at:-missing} (${age_minutes} minutes ago)."

      - name: Recover stale distributed calendar
        id: recovery
        if: steps.freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AGE_MINUTES: ${{ steps.freshness.outputs.age_minutes }}
        shell: bash
        run: |
          set -euo pipefail

          load_runs() {
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow update-live-calendar-distributed.yml \
              --limit 30 \
              --json databaseId,status,conclusion,createdAt,updatedAt,event
          }

          runs="$(load_runs)"
          now="$(date -u +%s)"
          cancelled=0

          # A queued run is not proof that ingestion is making progress. Old
          # queued runs can otherwise keep the watchdog saying "active" while
          # the public timestamp remains frozen.
          mapfile -t old_queued_ids < <(jq -r --argjson now "$now" '.[]
            | select(.status == "queued")
            | select(($now - (.createdAt | fromdateiso8601)) >= 300)
            | .databaseId' <<<"$runs")
          for run_id in "${old_queued_ids[@]}"; do
            [ -n "$run_id" ] || continue
            echo "Cancelling queued distributed run ${run_id} older than 5 minutes."
            gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
            cancelled=1
          done

          # The distributed workflow already has bounded collector/publish
          # jobs. A run still in progress after 20 minutes is no longer allowed
          # to block recovery indefinitely.
          mapfile -t stuck_running_ids < <(jq -r --argjson now "$now" '.[]
            | select(.status == "in_progress")
            | select(($now - (.createdAt | fromdateiso8601)) >= 1200)
            | .databaseId' <<<"$runs")
          for run_id in "${stuck_running_ids[@]}"; do
            [ -n "$run_id" ] || continue
            echo "Cancelling stuck distributed run ${run_id} older than 20 minutes."
            gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
            cancelled=1
          done

          if [ "$cancelled" = "1" ]; then
            sleep 2
            runs="$(load_runs)"
            now="$(date -u +%s)"
          fi

          # Only a genuinely executing run may suppress a recovery dispatch.
          # Queued work is tracked separately and receives only a short grace.
          fresh_running="$(jq --argjson now "$now" '[.[]
            | select(.status == "in_progress")
            | select(($now - (.createdAt | fromdateiso8601)) < 1200)] | length' <<<"$runs")"
          if [ "$fresh_running" -gt 0 ]; then
            echo "Published calendar is ${AGE_MINUTES} minutes stale, but ${fresh_running} distributed refresh run(s) are genuinely executing."
            echo "action=running" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          very_fresh_queue="$(jq --argjson now "$now" '[.[]
            | select(.status == "queued")
            | select(($now - (.createdAt | fromdateiso8601)) < 180)] | length' <<<"$runs")"
          if [ "$very_fresh_queue" -gt 0 ]; then
            echo "A distributed refresh has just queued; allowing at most a 3-minute queue grace."
            echo "action=queue-grace" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Avoid retry storms after a just-completed deterministic failure.
          recent_completed="$(jq --argjson now "$now" '[.[]
            | select(.status == "completed")
            | select(($now - (.createdAt | fromdateiso8601)) < 300)] | length' <<<"$runs")"
          if [ "$recent_completed" -gt 0 ]; then
            echo "A distributed attempt completed within the last 5 minutes; allowing one short cooldown."
            echo "action=cooldown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Published calendar has been stale for ${AGE_MINUTES} minutes; dispatching recovery refresh."
          gh workflow run update-live-calendar-distributed.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "action=dispatched" >> "$GITHUB_OUTPUT"

      - name: Summarize watchdog decision
        if: always()
        env:
          STALE: ${{ steps.freshness.outputs.stale }}
          AGE_MINUTES: ${{ steps.freshness.outputs.age_minutes }}
          UPDATED_AT: ${{ steps.freshness.outputs.updated_at }}
          RECOVERY_ACTION: ${{ steps.recovery.outputs.action }}
        shell: bash
        run: |
          {
            echo "## Calendar freshness watchdog"
            echo "- published timestamp: ${UPDATED_AT:-missing}"
            echo "- age: ${AGE_MINUTES:-unknown} minutes"
            echo "- stale: ${STALE:-unknown}"
            echo "- recovery action: ${RECOVERY_ACTION:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record stale-calendar incident
        if: steps.freshness.outputs.stale == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          AGE_MINUTES: ${{ steps.freshness.outputs.age_minutes }}
          UPDATED_AT: ${{ steps.freshness.outputs.updated_at }}
          RECOVERY_ACTION: ${{ steps.recovery.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          title="🚨 Calendar freshness watchdog active"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          body="公演情報の公開更新時刻が一定時間進んでいないため、自動復旧を実行しています。\n\npublished timestamp: ${UPDATED_AT}\nage: ${AGE_MINUTES} minutes\naction: ${RECOVERY_ACTION:-unknown}\nwatchdog run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Report healthy calendar and close watchdog incident
        if: steps.freshness.outputs.stale != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          AGE_MINUTES: ${{ steps.freshness.outputs.age_minutes }}
          UPDATED_AT: ${{ steps.freshness.outputs.updated_at }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Published calendar is healthy (${AGE_MINUTES} minutes since ${UPDATED_AT})."
          title="🚨 Calendar freshness watchdog active"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "公演情報の公開更新時刻が正常に進んだことを確認したため、自動復旧監視を通常状態へ戻しました。"
          fi
