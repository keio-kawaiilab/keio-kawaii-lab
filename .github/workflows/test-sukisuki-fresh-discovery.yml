name: SUKISUKI fresh discovery check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-sukisuki-fresh-discovery.yml"
      - "scripts/update_sukisuki_events.py"
      - "scripts/update_sukisuki_events_parallel.py"
      - "scripts/test_update_sukisuki_events.py"
      - "scripts/test_update_sukisuki_events_parallel.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Run SUKISUKI parser tests
        working-directory: scripts
        run: python -m unittest -v test_update_sukisuki_events.py test_update_sukisuki_events_parallel.py
      - name: Probe current SUKISUKI goods without publishing
        run: |
          cp data/live-events.json /tmp/live-events-before-probe.json
          python scripts/update_sukisuki_events_parallel.py --workers 5
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/live-events.json').read_text(encoding='utf-8'))
          rows=[]
          for event in data.get('events', []):
              if event.get('sourceType') != 'sukisuki':
                  continue
              rows.append({
                  'group': event.get('group'),
                  'eventDate': event.get('eventDate'),
                  'startTime': event.get('startTime'),
                  'title': event.get('title'),
                  'url': event.get('url'),
              })
          print(json.dumps({'sukisukiRowsAfterProbe': rows}, ensure_ascii=False, indent=2))
          PY
          cp /tmp/live-events-before-probe.json data/live-events.json
