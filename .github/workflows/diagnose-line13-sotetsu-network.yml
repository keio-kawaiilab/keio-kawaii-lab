name: Diagnose Line 13 Sotetsu network directions
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/diagnose_line13_sotetsu_network.mjs'
      - '.github/workflows/diagnose-line13-sotetsu-network.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact Sotetsu network direction records
        run: node scripts/diagnose_line13_sotetsu_network.mjs
