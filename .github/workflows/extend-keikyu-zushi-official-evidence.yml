name: Extend strict Keikyu official evidence to Zushi Line

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extend-keikyu-zushi-official-evidence.yml'

permissions:
  contents: read

concurrency:
  group: keikyu-zushi-proof-reader
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install strict PDF parsers
        run: pip install pdfplumber==0.11.7 PyMuPDF==1.26.4 requests==2.32.5
      - name: Test fragmented-boundary resolver
        run: |
          python -m py_compile scripts/keikyu_missing_boundary_evidence.py
          python scripts/test_keikyu_missing_boundary_evidence.py
          python scripts/test_keikyu_internal_generated_evidence.py
      - name: Build strict Zushi proof without mutating production
        run: |
          python scripts/keikyu_missing_boundary_evidence.py \
            --boundary-id keikyu-main-zushi-kanazawahakkei \
            --output /tmp/keikyu-internal-official-train-evidence.json \
            --report /tmp/zushi-current-evidence-report.json
          cat /tmp/zushi-current-evidence-report.json
      - name: Summarize independent official proof
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/zushi-current-evidence-report.json').read_text(encoding='utf-8'))
          print('ZUSHI_ELIGIBLE', int(report.get('eligibleUnresolvedSources') or 0))
          print('ZUSHI_SEARCH_CANDIDATES', int(report.get('candidatePairsAfterDestinationAndTimeSearch') or 0))
          print('ZUSHI_OFFICIAL_PROVEN', int(report.get('matchedSingleton') or 0))
          print('ZUSHI_DIRECTIONS', json.dumps(report.get('directions') or {}, ensure_ascii=False, sort_keys=True))
          print('ZUSHI_CALENDARS', json.dumps(report.get('calendars') or {}, ensure_ascii=False, sort_keys=True))
          print('ZUSHI_REASONS', json.dumps(report.get('reasons') or {}, ensure_ascii=False, sort_keys=True))
          if int(report.get('eligibleUnresolvedSources') or 0) <= 0:
              raise SystemExit('no current Zushi unresolved sources selected')
          PY
