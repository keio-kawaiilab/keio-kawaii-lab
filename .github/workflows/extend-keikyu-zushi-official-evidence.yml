name: Extend strict Keikyu official evidence to Zushi Line

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extend-keikyu-zushi-official-evidence.yml'

permissions:
  contents: read

concurrency:
  group: transit-db-zushi-writer
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose current Keikyu Zushi missing-boundary geometry
        run: python scripts/diagnose_keikyu_current_missing_boundaries.py
