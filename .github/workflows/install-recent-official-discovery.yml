name: Install recent official body discovery hook

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/install-recent-official-discovery.yml"
      - "scripts/augment_recent_official_news.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-recent-official-discovery
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add body-level discovery to distributed collectors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/update-live-calendar-distributed.yml')
          text = path.read_text(encoding='utf-8')

          ticket_anchor = '''            mark_degraded "group-official-news"\n          fi\n\n          cp data/live-events.json /tmp/live-events-before-pia.json\n'''
          ticket_replacement = '''            mark_degraded "group-official-news"\n          fi\n\n          # Read the newest official article bodies as a second discovery path.\n          # This catches announcements whose list-page title does not contain\n          # obvious ticket keywords while reusing the same strict parser.\n          if ! timeout --signal=TERM --kill-after=10s 90s python scripts/augment_recent_official_news.py --mode ticket; then\n            echo "::warning::Recent official article body discovery failed; deep title scan remains available."\n            mark_degraded "recent-official-body"\n          fi\n\n          cp data/live-events.json /tmp/live-events-before-pia.json\n'''

          special_anchor = '''            degraded="special-events"\n          fi\n\n          cp data/live-events.json /tmp/live-events-before-official-x.json\n'''
          special_replacement = '''            degraded="special-events"\n          fi\n\n          # Independently inspect newest article bodies for large-benefit and\n          # release-event announcements whose list title is generic.\n          if ! timeout --signal=TERM --kill-after=10s 90s python scripts/augment_recent_official_news.py --mode special; then\n            echo "::warning::Recent official special-event body discovery failed; retaining other special-event results."\n            degraded="${degraded}${degraded:+,}recent-official-special-body"\n          fi\n\n          cp data/live-events.json /tmp/live-events-before-official-x.json\n'''

          changed = False
          if 'augment_recent_official_news.py --mode ticket' not in text:
              if ticket_anchor not in text:
                  raise SystemExit('ticket insertion anchor not found')
              text = text.replace(ticket_anchor, ticket_replacement, 1)
              changed = True
          if 'augment_recent_official_news.py --mode special' not in text:
              if special_anchor not in text:
                  raise SystemExit('special insertion anchor not found')
              text = text.replace(special_anchor, special_replacement, 1)
              changed = True

          if changed:
              path.write_text(text, encoding='utf-8')
              print('installed body-level discovery hooks')
          else:
              print('hooks already installed')
          PY

      - name: Commit hook installation
        shell: bash
        run: |
          if git diff --quiet -- .github/workflows/update-live-calendar-distributed.yml; then
            echo "No workflow change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/update-live-calendar-distributed.yml
          git commit -m "Run body-level official news discovery"
          git pull --rebase origin main
          git push origin HEAD:main
