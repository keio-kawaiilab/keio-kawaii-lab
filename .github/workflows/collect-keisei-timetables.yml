name: Collect Keisei timetables

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-keisei-timetables
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install requests==2.32.5 beautifulsoup4==4.13.5
      - name: Discover all Keisei station pages and trains
        run: python scripts/collect_keisei_timetables.py --discover
