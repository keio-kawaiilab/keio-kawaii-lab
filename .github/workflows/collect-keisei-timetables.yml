name: Collect Keisei timetables

on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Rediscover the current official timetable and refetch every train'
        required: false
        type: boolean
        default: false
  schedule:
    # 04:17 JST every Monday. The odd minute avoids GitHub's top-of-hour congestion.
    - cron: '17 19 * * 0'
  push:
    paths:
      - 'scripts/collect_keisei_timetables.py'
      - 'scripts/build_keisei_official_timetables.py'
      - 'scripts/build_keisei_network_timetable.py'
      - '.github/workflows/collect-keisei-timetables.yml'

permissions:
  contents: write

concurrency:
  group: collect-keisei-timetables
  cancel-in-progress: false

jobs:
  collect-details:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CHUNK_SIZE: '300'
      KEISEI_WORKERS: '6'
      KEISEI_REQUEST_INTERVAL_SECONDS: '0.35'
      FULL_REFRESH: ${{ github.event_name == 'schedule' || inputs.full_refresh == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: pip install requests==2.32.5 beautifulsoup4==4.13.5

      - name: Configure checkpoint commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Collect every detailed train timetable with checkpoints
        shell: bash
        run: |
          set -euo pipefail

          checkpoint() {
            local label="$1"
            if [ -z "$(git status --porcelain -- data/transit/keisei)" ]; then
              return 0
            fi
            git add data/transit/keisei
            git commit -m "$label"
            for push_attempt in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                return 0
              fi
              sleep $((push_attempt * 3))
            done
            return 1
          }

          if [ "$FULL_REFRESH" = "true" ]; then
            echo "Full refresh: rediscovering the current official Keisei timetable."
            python scripts/collect_keisei_timetables.py --discover
            checkpoint "Refresh Keisei official train discovery"
          else
            echo "Resume mode: using the saved discovery and completed train chunks."
          fi

          TOTAL=$(python - <<'PY'
          import json
          with open('data/transit/keisei/collector-state.json', encoding='utf-8') as f:
              print(len(json.load(f)['trainRefs']))
          PY
          )
          CHUNKS=$(( (TOTAL + CHUNK_SIZE - 1) / CHUNK_SIZE ))
          echo "Collecting $TOTAL trains in $CHUNKS chunks of $CHUNK_SIZE"

          for ((chunk=0; chunk<CHUNKS; chunk++)); do
            echo "=== Keisei detail chunk $chunk/$((CHUNKS-1)) ==="
            if [ "$FULL_REFRESH" = "true" ]; then
              rm -f "data/transit/keisei/train-detail-chunks/chunk-$(printf '%03d' "$chunk").json"
            fi
            success=0
            for attempt in 1 2 3; do
              set +e
              python scripts/collect_keisei_timetables.py \
                --collect-chunk "$chunk" \
                --chunk-size "$CHUNK_SIZE" \
                --workers "$KEISEI_WORKERS"
              status=$?
              set -e
              checkpoint "Checkpoint Keisei train details chunk $(printf '%03d' "$chunk") attempt $attempt"
              if [ "$status" -eq 0 ]; then
                success=1
                break
              fi
              echo "Chunk $chunk attempt $attempt incomplete; retrying only missing trains."
              sleep $((attempt * 5))
            done
            if [ "$success" -ne 1 ]; then
              echo "Chunk $chunk remains incomplete after retries."
              exit 1
            fi
          done

          # Remove obsolete chunk files if a future timetable contains fewer trains.
          if [ -d data/transit/keisei/train-detail-chunks ]; then
            for path in data/transit/keisei/train-detail-chunks/chunk-*.json; do
              [ -e "$path" ] || continue
              number=${path##*chunk-}
              number=${number%.json}
              index=$((10#$number))
              if [ "$index" -ge "$CHUNKS" ]; then
                rm -f "$path"
              fi
            done
          fi

          python scripts/collect_keisei_timetables.py --merge-chunks --chunk-size "$CHUNK_SIZE"
          checkpoint "Merge all Keisei official train details"

      - name: Validate discovery and detail counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('data/transit/keisei')
          state = json.loads((root/'collector-state.json').read_text(encoding='utf-8'))
          merged = json.loads((root/'official-train-details.json').read_text(encoding='utf-8'))
          expected = int(state['trainReferenceCount'])
          by_dw = state.get('trainReferencesByDw') or {}
          assert 3000 <= expected <= 7000, expected
          assert merged['trainCount'] == expected, (merged['trainCount'], expected)
          assert merged['weekdayCount'] == int(by_dw.get('0', 0)), (merged['weekdayCount'], by_dw)
          assert merged['holidayCount'] == int(by_dw.get('1', 0)), (merged['holidayCount'], by_dw)
          assert merged['weekdayCount'] + merged['holidayCount'] == expected
          assert all(len(train.get('stops') or []) >= 2 for train in merged['trains'])
          print('Validated Keisei trains:', merged['trainCount'])
          print('Validated weekday/holiday:', merged['weekdayCount'], merged['holidayCount'])
          print('Validated stop rows:', merged['stopRowCount'])
          PY

      - name: Build compact Keisei app timetables
        run: python scripts/build_keisei_official_timetables.py

      - name: Build exact Keisei through network timetable
        run: python scripts/build_keisei_network_timetable.py

      - name: Validate and publish compact Keisei timetable database
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('data/transit/keisei')
          state = json.loads((root/'collector-state.json').read_text(encoding='utf-8'))
          index = json.loads((root/'timetable-index.json').read_text(encoding='utf-8'))
          report = json.loads((root/'official-conversion-report.json').read_text(encoding='utf-8'))
          network = json.loads((root/'official-network-report.json').read_text(encoding='utf-8'))
          expected = int(state['trainReferenceCount'])
          assert len(index.get('lines') or {}) == 8, index
          assert report['sourceTrainCount'] == expected, (report['sourceTrainCount'], expected)
          assert report['compactTripCount'] > 0, report
          assert report['compactConnectionCount'] > 0, report
          assert index.get('network', {}).get('timeBasis') == 'train-timetable-network', index
          assert network['sourceTrainCount'] == expected, (network['sourceTrainCount'], expected)
          assert network['networkTripCount'] + network['skippedUnderTwoMappedStops'] == expected, network
          assert network['unresolvedPairCount'] == 0, network
          assert (root/index['network']['file']).exists(), index['network']
          for railway_id, row in index['lines'].items():
              assert row['trips'] > 0, (railway_id, row)
              assert (root/row['file']).exists(), (railway_id, row['file'])
          print('Keisei compact trips:', report['compactTripCount'])
          print('Keisei compact connections:', report['compactConnectionCount'])
          print('Keisei exact network trips:', network['networkTripCount'])
          print('Cross-line skipped pairs covered by network:', report['crossLineSkippedPairCount'])
          PY
          git add data/transit/keisei/timetable-index.json \
                  data/transit/keisei/timetables \
                  data/transit/keisei/official-conversion-report.json \
                  data/transit/keisei/official-network-report.json \
                  data/transit/manifest.json
          if git diff --cached --quiet; then
            echo "No compact timetable changes."
            exit 0
          fi
          git commit -m "Publish Keisei official timetable database"
          for push_attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((push_attempt * 3))
          done
          exit 1
