name: Collect Keisei timetables

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/collect_keisei_timetables.py'
      - '.github/workflows/collect-keisei-timetables.yml'

permissions:
  contents: write

concurrency:
  group: collect-keisei-timetables
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: pip install requests==2.32.5 beautifulsoup4==4.13.5

      - name: Probe Keisei timetable HTML structure
        run: python scripts/collect_keisei_timetables.py --probe

      - name: Commit probe snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/transit/keisei/collector-probe.json; then
            echo "No probe changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transit/keisei/collector-probe.json
          git commit -m "Probe Keisei timetable source"
          git push origin HEAD:main
