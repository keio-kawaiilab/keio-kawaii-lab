name: Probe official Keikyu timetable layout

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_keikyu_official_timetable.py'
      - 'scripts/probe_keikyu_timetable_geometry.py'
      - 'scripts/probe_keikyu_station_rows.py'
      - 'scripts/keikyu_official_pdf.py'
      - 'scripts/audit_keikyu_official_columns.py'
      - 'scripts/audit_keikyu_station_time_resolution.py'
      - 'scripts/build_keikyu_official_stop_times.py'
      - 'scripts/verify_keikyu_official_stop_times.py'
      - 'scripts/test_keikyu_official_stop_times.py'
      - '.github/workflows/probe-keikyu-official-timetable.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure PDF text tools
        run: |
          if ! command -v pdftotext >/dev/null || ! command -v pdfinfo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Probe current official timetable
        run: python scripts/probe_keikyu_official_timetable.py
      - name: Probe train-column geometry
        run: python scripts/probe_keikyu_timetable_geometry.py
      - name: Probe station row semantics
        run: python scripts/probe_keikyu_station_rows.py
      - name: Audit all official train-column pages
        run: python scripts/audit_keikyu_official_columns.py
      - name: Audit all station-time semantics
        run: python scripts/audit_keikyu_station_time_resolution.py
      - name: Run stop-time fragment regressions
        run: python scripts/test_keikyu_official_stop_times.py
      - name: Build official page-local stop times
        run: python scripts/build_keikyu_official_stop_times.py --output /tmp/keikyu-official-stop-times.json
      - name: Verify official page-local stop times
        run: python scripts/verify_keikyu_official_stop_times.py /tmp/keikyu-official-stop-times.json
      - name: Remove raw generated timetable dataset
        if: always()
        run: rm -f /tmp/keikyu-official-stop-times.json
