name: Recent official body discovery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/recent-official-body-discovery.yml"
      - "scripts/augment_recent_official_news.py"
      - "scripts/test_augment_recent_official_news.py"
  schedule:
    # Offset from the primary :00/:15/:30/:45 distributed refresh.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Share the primary calendar lock so the two publishers never overwrite each other.
concurrency:
  group: distributed-live-calendar
  cancel-in-progress: false

jobs:
  discover-audit-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Test non-destructive body discovery merge
        working-directory: scripts
        run: python -m unittest -v test_augment_recent_official_news.py

      - name: Preserve last-good public data
        shell: bash
        run: |
          cp data/live-events.json /tmp/live-events-before-body-discovery.json
          cp data/official-schedule-index.json /tmp/official-schedule-index-before-body-discovery.json

      - name: Read newest official article bodies
        shell: bash
        run: |
          set -euo pipefail
          python scripts/augment_recent_official_news.py --mode ticket
          python scripts/augment_recent_official_news.py --mode special

      - name: Detect substantive discovery changes
        id: diff
        shell: bash
        run: |
          changed="$(python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path('/tmp/live-events-before-body-discovery.json').read_text(encoding='utf-8'))
          after = json.loads(Path('data/live-events.json').read_text(encoding='utf-8'))
          keys = ('events', 'pendingReview')
          print('true' if any(before.get(k) != after.get(k) for k in keys) else 'false')
          PY
          )"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" != "true" ]; then
            cp /tmp/live-events-before-body-discovery.json data/live-events.json
            echo "No new or changed authoritative event information found in recent article bodies."
          fi

      - name: Normalize and audit discovered rows
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/resolve_source_priority.py
          python scripts/enrich_event_metadata.py
          python scripts/apply_event_scopes.py
          python scripts/prepare_release_candidate.py --previous /tmp/live-events-before-body-discovery.json
          python scripts/reconcile_official_schedule_index.py \
            --data data/live-events.json \
            --index data/official-schedule-index.json \
            --report /tmp/body-official-index-reconcile.json
          python scripts/audit_schedule_release_grouped.py \
            --previous /tmp/live-events-before-body-discovery.json \
            --candidate data/live-events.json \
            --report data/schedule-health.json
          python scripts/audit_official_schedule_coverage.py \
            --previous-index /tmp/official-schedule-index-before-body-discovery.json

      - name: Build public schedule
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          python scripts/build_schedule_snapshot.py
          python scripts/fix_schedule_shell.py
          python scripts/strip_schedule_explanations.py
          node --check /tmp/schedule-inline.js
          node scripts/test_schedule_band_grouping.js
          node scripts/test_schedule_scope_ui.js

      - name: Publish audited body discoveries
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/live-events.json data/official-schedule-index.json data/schedule-health.json schedule.html)" ]; then
            echo "No audited public changes after normalization."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-events.json data/official-schedule-index.json data/schedule-health.json schedule.html
          git commit -m "chore: publish official body discoveries"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push attempt ${attempt} rejected; rebasing body discovery onto latest main."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Concurrent calendar output overlaps this discovery; refusing overwrite and relying on the next automatic scan."
              exit 1
            fi
          done
          exit 1
