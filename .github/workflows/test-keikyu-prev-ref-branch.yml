name: Temporary Keikyu previous-reference branch tests

on:
  push:
    branches:
      - work/keikyu-prev-page-evidence-20260906

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pdfplumber==0.11.7 requests==2.32.5
      - name: Compile and run previous-publication parser tests
        run: |
          python -m py_compile scripts/audit_keikyu_previous_publication_refs.py scripts/test_keikyu_previous_publication_refs.py
          python scripts/test_keikyu_previous_publication_refs.py
