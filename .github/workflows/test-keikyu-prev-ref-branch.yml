name: Temporary Keikyu previous-reference branch tests

on:
  push:
    branches:
      - work/keikyu-prev-page-evidence-20260906
    paths:
      - 'scripts/audit_keikyu_previous_publication_refs.py'
      - 'scripts/test_keikyu_previous_publication_refs.py'
      - '.github/workflows/test-keikyu-prev-ref-branch.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install pdfplumber==0.11.7 requests==2.32.5
      - name: Compile parsers
        run: |
          python -m py_compile \
            scripts/keikyu_official_pdf.py \
            scripts/audit_keikyu_official_columns.py \
            scripts/audit_keikyu_station_time_resolution.py \
            scripts/build_keikyu_official_stop_times.py \
            scripts/verify_keikyu_official_stop_times.py \
            scripts/test_keikyu_official_stop_times.py \
            scripts/audit_keikyu_previous_publication_refs.py \
            scripts/test_keikyu_previous_publication_refs.py
      - name: Run stop-time unit regressions
        run: python scripts/test_keikyu_official_stop_times.py
      - name: Run previous-publication unit regressions
        run: python scripts/test_keikyu_previous_publication_refs.py
      - name: Build full official stop-time audit dataset
        run: python scripts/build_keikyu_official_stop_times.py --output /tmp/keikyu-official-stop-times.json
      - name: Verify full official stop-time audit dataset
        run: python scripts/verify_keikyu_official_stop_times.py /tmp/keikyu-official-stop-times.json
      - name: Audit explicit previous-publication references
        run: python scripts/audit_keikyu_previous_publication_refs.py --output /tmp/keikyu-previous-publication-refs.json
      - name: Enforce zero runtime promotion and write summary
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          stop_times = json.loads(Path('/tmp/keikyu-official-stop-times.json').read_text(encoding='utf-8'))
          refs = json.loads(Path('/tmp/keikyu-previous-publication-refs.json').read_text(encoding='utf-8'))
          assert stop_times['identityPolicy']['runtimeSameTrainPromotions'] == 0
          assert refs['identityPolicy']['runtimeSameTrainPromotions'] == 0
          assert refs['identityPolicy']['crossPageIdentityEstablished'] is False
          assert refs['fragmentCount'] > 0
          missing_printed = [row['pdfPage'] for row in refs['pages'] if row.get('printedPage') is None]
          unresolved_refs = [
              {
                  'pdfPage': row['pdfPage'],
                  'printedPage': row.get('printedPage'),
                  'column': row['column'],
                  'currentTrainNumber': row.get('currentTrainNumber'),
                  'previousPrintedPage': row.get('previousPrintedPage'),
                  'previousTrainNumber': row.get('previousTrainNumber'),
                  'targetStatus': row.get('targetStatus'),
              }
              for row in refs['fragments']
              if row.get('targetStatus') not in {'no-reference', 'unique-explicit-reference-candidate'}
          ]
          summary = {
              'version': 1,
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'sourceSha256': refs['source']['sha256'],
              'pdfPages': refs['source']['pdfPages'],
              'stopTimeTotals': stop_times['totals'],
              'pagesAudited': refs['pagesAudited'],
              'fragments': refs['fragmentCount'],
              'completePreviousReferences': refs['completePreviousReferenceCount'],
              'uniqueExplicitReferenceCandidates': refs['uniqueExplicitReferenceCandidateCount'],
              'pagesWithoutPrintedPageNumber': refs['pagesWithoutDetectedPrintedPageNumber'],
              'pagesWithoutPrintedPageNumberList': missing_printed,
              'duplicatePrintedPageMappings': refs['duplicatePrintedPageMappings'],
              'targetStatusCounts': refs['targetStatusCounts'],
              'unresolvedReferenceDetails': unresolved_refs,
              'runtimeSameTrainPromotions': 0,
              'note': 'Audit-only snapshot. Unique explicit references are candidates, not runtime same-train promotions.'
          }
          path = Path('docs/transit/keikyu-previous-publication-audit.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Commit audit summary to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/transit/keikyu-previous-publication-audit.json
          if git diff --cached --quiet; then
            echo "No audit summary change."
            exit 0
          fi
          git commit -m "Record Keikyu previous-reference audit summary"
          git pull --rebase origin work/keikyu-prev-page-evidence-20260906
          git push origin HEAD:work/keikyu-prev-page-evidence-20260906
