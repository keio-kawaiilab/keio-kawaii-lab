name: Probe official X public endpoints

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-official-x.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public endpoints
        shell: bash
        run: |
          set +e
          url='https://x.com/SWEET_STEADY'
          echo "=== $url ==="
          curl -L --compressed --max-time 20 -A 'Mozilla/5.0' -sS -D /tmp/headers "$url" -o /tmp/body
          head -n 10 /tmp/headers
          echo "bytes=$(wc -c </tmp/body)"
          echo '--- target terms ---'
          grep -aoE '.{0,100}(SWEET STEP|サッポロファクトリー|リリースイベント).{0,180}' /tmp/body | head -n 30 || true
          echo '--- status urls ---'
          grep -aoE 'https://x.com/SWEET_STEADY/status/[0-9]+' /tmp/body | head -n 20 || true
          echo '--- encoded status hints ---'
          grep -aoE 'SWEET_STEADY.{0,120}status.{0,120}' /tmp/body | head -n 20 || true
