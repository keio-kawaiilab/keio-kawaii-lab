name: Legacy playguide fallback

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-live-ticket-calendar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manual-playguide-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Refresh and audit playguides
        shell: bash
        run: |
          set -euo pipefail
          cp data/live-events.json /tmp/live-events-last-good.json
          python scripts/update_playguide_events_parallel.py --workers 10
          python scripts/audit_playguide_collection.py
          python scripts/resolve_source_priority.py
          python scripts/enrich_event_metadata.py
          python scripts/apply_event_scopes.py
          python scripts/prepare_release_candidate.py --previous /tmp/live-events-last-good.json
          python scripts/audit_schedule_release_grouped.py \
            --previous /tmp/live-events-last-good.json \
            --candidate data/live-events.json \
            --report data/schedule-health.json
          python scripts/build_schedule_snapshot.py
          python scripts/fix_schedule_shell.py
          python scripts/strip_schedule_explanations.py
          node --check /tmp/schedule-inline.js
      - name: Publish fallback result
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/live-events.json data/schedule-health.json schedule.html)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-events.json data/schedule-health.json schedule.html
          git commit -m "chore: publish manual playguide fallback"
          git push
