name: Birthday event fallback refresh

on:
  push:
    branches:
      - main
    paths:
      - "scripts/update_promoter_birthday_events.py"
      - "scripts/test_update_promoter_birthday_events.py"
      - "scripts/update_official_birthday_news.py"
      - "scripts/update_official_x_birthday_events.py"
      - "scripts/test_update_official_x_birthday_events.py"
      - "scripts/apply_event_scopes.py"
      - "scripts/test_schedule_scope.py"
      - ".github/workflows/update-birthday-events.yml"
  schedule:
    # Runs between the main distributed refresh slots.
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: birthday-event-fallback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  birthday-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read emergency freeze control
        id: control
        shell: bash
        run: |
          frozen="$(python - <<'PY'
          import json
          with open('data/schedule-control.json', encoding='utf-8') as f:
              print(str(bool(json.load(f).get('freeze'))).lower())
          PY
          )"
          echo "frozen=$frozen" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.control.outputs.frozen != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        if: steps.control.outputs.frozen != 'true'
        run: pip install -r scripts/requirements.txt

      - name: Test birthday collectors and public dedupe
        if: steps.control.outputs.frozen != 'true'
        working-directory: scripts
        run: |
          python -m py_compile update_official_birthday_news.py
          python -m unittest -v test_update_promoter_birthday_events.py test_update_official_x_birthday_events.py test_schedule_scope.py

      - name: Collect birthday announcements and ticket windows
        if: steps.control.outputs.frozen != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp data/live-events.json /tmp/live-events-before-birthday.json

          if ! timeout --signal=TERM --kill-after=10s 300s python scripts/update_promoter_birthday_events.py; then
            echo "::warning::Promoter birthday collector failed; retaining previous known-good rows and continuing to official sources."
            cp /tmp/live-events-before-birthday.json data/live-events.json
          fi

          # Primary enrichment path: official KAWAII LAB./group INFORMATION pages.
          # This avoids making ticket completeness depend on X availability.
          timeout --signal=TERM --kill-after=10s 180s python scripts/update_official_birthday_news.py || \
            echo "::warning::Official birthday news collector failed; keeping promoter/previous birthday data."

          # X syndication remains a redundant fallback. Endpoint failures must not
          # delete already-good official-news ticket windows.
          timeout --signal=TERM --kill-after=10s 180s python scripts/update_official_x_birthday_events.py || \
            echo "::warning::Official X birthday fallback failed; keeping official-news/promoter/previous birthday data."

          # Consolidate a stale schedule-only shadow into the richer FC/general
          # birthday row before audit/publication, while preserving distinct sale rounds.
          python scripts/apply_event_scopes.py
          python scripts/prepare_release_candidate.py --previous /tmp/live-events-before-birthday.json
          python scripts/audit_schedule_release_grouped.py \
            --previous /tmp/live-events-before-birthday.json \
            --candidate data/live-events.json \
            --report data/schedule-health.json

      - name: Build public schedule
        if: steps.control.outputs.frozen != 'true'
        shell: bash
        run: |
          python scripts/build_schedule_snapshot.py
          python scripts/fix_schedule_shell.py
          python scripts/strip_schedule_explanations.py
          node --check /tmp/schedule-inline.js
          node scripts/test_schedule_band_grouping.js
          node scripts/test_schedule_scope_ui.js

      - name: Publish audited birthday refresh
        if: steps.control.outputs.frozen != 'true'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/live-events.json data/schedule-health.json schedule.html)" ]; then
            echo "No birthday refresh changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-events.json data/schedule-health.json schedule.html
          git commit -m "chore: publish birthday event fallback refresh"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1
