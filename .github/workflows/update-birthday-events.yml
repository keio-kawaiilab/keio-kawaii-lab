name: Birthday event fallback refresh

on:
  push:
    branches:
      - main
    paths:
      - "scripts/update_official_birthday_news.py"
      - "scripts/update_official_x_birthday_events.py"
      - "scripts/test_update_official_x_birthday_events.py"
      - "scripts/reconcile_birthday_ticket_rows.py"
      - "scripts/guard_birthday_year_consistency.py"
      - "scripts/apply_event_scopes.py"
      - "scripts/test_schedule_scope.py"
      - ".github/workflows/update-birthday-events.yml"
  schedule:
    # Runs between the main distributed refresh slots.
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Share the same lock as the main distributed publisher. Both workflows write
# live-events.json/schedule.html, so running them concurrently creates avoidable
# rebase conflicts and can discard an otherwise valid birthday refresh.
concurrency:
  group: distributed-live-calendar
  cancel-in-progress: false

jobs:
  birthday-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read emergency freeze control
        id: control
        shell: bash
        run: |
          frozen="$(python - <<'PY'
          import json
          with open('data/schedule-control.json', encoding='utf-8') as f:
              print(str(bool(json.load(f).get('freeze'))).lower())
          PY
          )"
          echo "frozen=$frozen" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.control.outputs.frozen != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        if: steps.control.outputs.frozen != 'true'
        run: pip install -r scripts/requirements.txt

      - name: Test birthday collectors and public dedupe
        if: steps.control.outputs.frozen != 'true'
        working-directory: scripts
        run: |
          python -m py_compile update_official_birthday_news.py reconcile_birthday_ticket_rows.py guard_birthday_year_consistency.py
          python -m unittest -v test_update_official_x_birthday_events.py test_schedule_scope.py

      - name: Collect birthday announcements and ticket windows
        if: steps.control.outputs.frozen != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp data/live-events.json /tmp/live-events-before-birthday.json

          # Remove impossible stale rows before matching. An explicit year in a
          # birthday title is authoritative for the physical performance year,
          # and ticket applications may never start after that event ended.
          python scripts/guard_birthday_year_consistency.py

          # Primary path: official KAWAII LAB./group INFORMATION pages. This is
          # independent of X and supplies the displayed official URL and window.
          timeout --signal=TERM --kill-after=10s 180s python scripts/update_official_birthday_news.py || \
            echo "::warning::Official birthday news collector failed; keeping previous birthday data."

          # X syndication is only a redundant fallback. HTTP 429 must never erase
          # the official-news result.
          timeout --signal=TERM --kill-after=10s 90s python scripts/update_official_x_birthday_events.py || \
            echo "::warning::Official X birthday fallback failed; keeping official-news/previous birthday data."

          # Reject any impossible cross-year row produced by a source before it
          # can be reconciled into the stable public event identity.
          python scripts/guard_birthday_year_consistency.py

          # Fold a verified official ticket row into the stable physical-event row
          # so an old '現在受付なし' shadow cannot be restored by continuity guards.
          python scripts/reconcile_birthday_ticket_rows.py
          python scripts/guard_birthday_year_consistency.py
          python scripts/apply_event_scopes.py
          python scripts/prepare_release_candidate.py --previous /tmp/live-events-before-birthday.json
          python scripts/audit_schedule_release_grouped.py \
            --previous /tmp/live-events-before-birthday.json \
            --candidate data/live-events.json \
            --report data/schedule-health.json

      - name: Build public schedule
        if: steps.control.outputs.frozen != 'true'
        shell: bash
        run: |
          python scripts/build_schedule_snapshot.py
          python scripts/fix_schedule_shell.py
          python scripts/strip_schedule_explanations.py
          node --check /tmp/schedule-inline.js
          node scripts/test_schedule_band_grouping.js
          node scripts/test_schedule_scope_ui.js

      - name: Publish audited birthday refresh
        if: steps.control.outputs.frozen != 'true'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/live-events.json data/schedule-health.json schedule.html)" ]; then
            echo "No birthday refresh changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-events.json data/schedule-health.json schedule.html
          git commit -m "chore: publish birthday event fallback refresh"
          git push origin HEAD:main
