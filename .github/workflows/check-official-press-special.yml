name: Official press release special-event health check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/check-official-press-special.yml"
      - "scripts/update_official_press_release_events.py"
      - "scripts/test_update_official_press_release_events.py"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Test release-plan parser
        working-directory: scripts
        run: python -m unittest -v test_update_official_press_release_events.py
      - name: Inspect PR TIMES RSS
        run: |
          python - <<'PY'
          import re, requests
          u='https://prtimes.jp/index.rdf'
          r=requests.get(u, timeout=20, headers={'User-Agent':'Mozilla/5.0'})
          print('status=', r.status_code, 'length=', len(r.text), 'type=', r.headers.get('content-type'))
          links=re.findall(r'https://prtimes\.jp/main/html/rd/p/\d+\.\d+\.html', r.text)
          print('release links=', len(links), 'sample=', links[:10])
          own=[x for x in links if '.000017258.html' in x]
          print('asobisystem=', len(own), own[:20])
          print('head=', r.text[:1800].replace('\n',' '))
          PY
      - name: Probe current ASOBISYSTEM press releases
        run: python scripts/update_official_press_release_events.py --check
