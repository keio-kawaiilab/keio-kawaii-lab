name: Apply single calendar timestamp

on:
  push:
    paths:
      - ".github/workflows/oneoff-single-calendar-timestamp.yml"

permissions:
  contents: write

concurrency:
  group: oneoff-single-calendar-timestamp
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace double public timestamp with one
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('schedule.html')
          text = path.read_text(encoding='utf-8')
          old = "document.getElementById('status').textContent='最終確認: '+(data.checkedAt||'不明')+' ／ 最終データ更新: '+(data.updatedAt||'不明');render()"
          new = "document.getElementById('status').textContent='最終更新: '+(data.checkedAt||data.updatedAt||'不明');render()"
          if new in text:
              print('Already uses one public timestamp.')
          elif old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          else:
              raise SystemExit('Expected timestamp renderer not found')
          PY

      - name: Commit public page
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- schedule.html; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.html
          git commit -m "Show one calendar update time"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1
