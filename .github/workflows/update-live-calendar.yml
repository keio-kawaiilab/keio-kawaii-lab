name: Update live ticket calendar

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/update-live-calendar.yml"
      - "data/live-events.json"
      - "live*.js"
      - "calendar-*.js"
      - "live.html"
      - "schedule.html"
  push:
    branches:
      - "main"
      - "feature/live-ticket-calendar"
    paths:
      - "scripts/**"
      - ".github/workflows/update-live-calendar.yml"
      - "live*.js"
      - "calendar-*.js"
      - "live.html"
      - "schedule.html"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-live-ticket-calendar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check frontend JavaScript syntax
        run: |
          node --check live.js
          node --check live-runtime-fallback.js
          node --check calendar-performance-dates.js
          node --check calendar-readable-labels.js
          node --check calendar-scroll-detail.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run parser, retention, deadline, sanitizer, metadata and source priority tests
        working-directory: scripts
        run: python -m unittest -v test_update_live_events.py test_update_live_events_v2.py test_update_pia_events.py test_reconcile_pia_retention.py test_harden_pia_events.py test_sanitize_live_events.py test_update_sukisuki_events.py test_enrich_event_metadata.py test_resolve_source_priority.py

      - name: Check public sources on pull requests
        if: github.event_name == 'pull_request'
        run: |
          python scripts/update_live_events_v2.py --check
          python scripts/update_pia_events.py --check
          python scripts/update_sukisuki_events.py --check
          python scripts/harden_pia_events.py --check
          python scripts/build_schedule_snapshot.py
          git diff --exit-code -- schedule.html || true

      - name: Update calendar data from public sources
        if: github.event_name != 'pull_request'
        run: |
          python scripts/update_live_events_v2.py
          cp data/live-events.json /tmp/live-events-before-pia.json
          python scripts/update_pia_events.py
          python scripts/reconcile_pia_retention.py --previous /tmp/live-events-before-pia.json
          python scripts/update_sukisuki_events.py
          python scripts/harden_pia_events.py
          python scripts/resolve_source_priority.py
          python scripts/sanitize_live_events.py
          python scripts/enrich_event_metadata.py
          python scripts/harden_pia_events.py --check
          python scripts/build_schedule_snapshot.py

      - name: Commit when data or static schedule changed
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- data/live-events.json schedule.html; then
            echo "No calendar changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-events.json schedule.html
          git commit -m "chore: update live ticket calendar"
          git push
