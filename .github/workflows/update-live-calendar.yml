name: Update live ticket calendar

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/update-live-calendar.yml"
      - "data/live-events.json"
  push:
    branches:
      - "feature/live-ticket-calendar"
    paths:
      - "scripts/**"
      - ".github/workflows/update-live-calendar.yml"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-live-ticket-calendar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run parser and sanitizer tests
        working-directory: scripts
        run: python -m unittest -v test_update_live_events.py test_sanitize_live_events.py

      - name: Check official public sources on pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/update_live_events.py --check

      - name: Update calendar data from official public sources
        if: github.event_name != 'pull_request'
        run: |
          python scripts/update_live_events.py
          python scripts/sanitize_live_events.py

      - name: Commit when data changed
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- data/live-events.json; then
            echo "No calendar data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-events.json
          git commit -m "chore: update live ticket calendar"
          git push
