name: Legacy calendar core fallback

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Manual emergency fallback only. The distributed workflow owns automatic refreshes.
concurrency:
  group: update-live-ticket-calendar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  legacy-core-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read emergency freeze control
        id: control
        shell: bash
        run: |
          frozen="$(python - <<'PY'
          import json
          with open('data/schedule-control.json', encoding='utf-8') as f:
              print(str(bool(json.load(f).get('freeze'))).lower())
          PY
          )"
          echo "frozen=$frozen" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run legacy full refresh
        if: steps.control.outputs.frozen != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp data/live-events.json /tmp/live-events-last-good.json
          if [ -f data/official-schedule-index.json ]; then
            cp data/official-schedule-index.json /tmp/official-schedule-index-last-good.json
          else
            echo '{"rows":[]}' > /tmp/official-schedule-index-last-good.json
          fi

          python scripts/update_live_events_v2.py
          cp data/live-events.json /tmp/live-events-before-pia.json
          python scripts/clean_pia_refresh.py --drop-all
          python scripts/sanitize_live_events.py
          python scripts/enrich_official_performance_times.py
          python scripts/enrich_event_metadata.py
          python scripts/update_pia_events.py
          python scripts/reconcile_pia_retention.py --previous /tmp/live-events-before-pia.json
          python scripts/harden_pia_events.py
          python scripts/update_playguide_events_parallel.py --workers 10
          python scripts/audit_playguide_collection.py
          python scripts/update_sukisuki_events.py
          python scripts/update_special_events.py
          python scripts/update_official_x_special_events.py
          python scripts/resolve_source_priority.py
          python scripts/enrich_event_metadata.py
          python scripts/update_official_schedule.py
          python scripts/apply_event_scopes.py
          python scripts/prepare_release_candidate.py --previous /tmp/live-events-last-good.json

          python scripts/audit_schedule_release_grouped.py \
            --previous /tmp/live-events-last-good.json \
            --candidate data/live-events.json \
            --report data/schedule-health.json
          python scripts/audit_official_schedule_coverage.py \
            --previous-index /tmp/official-schedule-index-last-good.json

          python scripts/build_schedule_snapshot.py
          python scripts/fix_schedule_shell.py
          python scripts/strip_schedule_explanations.py
          node --check /tmp/schedule-inline.js
          node scripts/test_schedule_band_grouping.js
          node scripts/test_schedule_scope_ui.js

      - name: Publish audited fallback release
        if: steps.control.outputs.frozen != 'true'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/live-events.json data/official-schedule-index.json data/schedule-health.json schedule.html)" ]; then
            echo "No legacy fallback changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-events.json data/official-schedule-index.json data/schedule-health.json schedule.html
          git commit -m "chore: publish legacy fallback calendar"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
          done
          exit 1
