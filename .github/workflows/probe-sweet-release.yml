name: Probe SWEET STEADY release details

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-sweet-release.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Inspect current official information feed
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          headers={"User-Agent":"Mozilla/5.0"}
          urls=[
            "https://sweetsteady.asobisystem.com/news/1/",
            "https://sweetsteady.asobisystem.com/live_information/detail/43897",
            "https://sweetsteady.asobisystem.com/live_information/detail/43899",
            "https://sweetsteady.asobisystem.com/live_information/detail/43900",
          ]
          for url in urls:
            r=requests.get(url,timeout=20,headers=headers)
            print("\n===",url,"HTTP",r.status_code,"===")
            soup=BeautifulSoup(r.text,"html.parser")
            text=[" ".join(x.split()) for x in soup.get_text("\n",strip=True).splitlines() if " ".join(x.split())]
            for line in text[:120]: print("TEXT",line)
            for a in soup.find_all("a",href=True):
              href=urljoin(url,a.get("href"))
              label=" ".join(a.get_text(" ",strip=True).split())
              if "/news/detail/" in href or "/live_information/detail/" in href:
                print("LINK",href,"|",label)
          PY