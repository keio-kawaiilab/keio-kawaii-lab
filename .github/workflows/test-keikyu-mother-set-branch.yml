name: Temporary Keikyu independent mother-set audit

on:
  push:
    branches:
      - work/keikyu-mother-set-20260906
    paths:
      - 'scripts/build_keikyu_independent_mother_set_audit.py'
      - 'scripts/verify_keikyu_independent_mother_set_audit.py'
      - 'scripts/test_keikyu_independent_mother_set_audit.py'
      - 'scripts/audit_keikyu_empty_fragments.py'
      - '.github/workflows/test-keikyu-mother-set-branch.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install pdfplumber==0.11.7 requests==2.32.5
      - name: Compile and unit test
        run: |
          python -m py_compile \
            scripts/build_keikyu_official_stop_times.py \
            scripts/audit_keikyu_previous_publication_refs.py \
            scripts/build_keikyu_cross_page_identity_audit.py \
            scripts/verify_keikyu_cross_page_identity_audit.py \
            scripts/build_keikyu_independent_mother_set_audit.py \
            scripts/verify_keikyu_independent_mother_set_audit.py \
            scripts/test_keikyu_independent_mother_set_audit.py \
            scripts/audit_keikyu_empty_fragments.py
          python scripts/test_keikyu_independent_mother_set_audit.py
      - name: Build official page-local stop times
        run: python scripts/build_keikyu_official_stop_times.py --output /tmp/keikyu-stop-times.json
      - name: Build official previous-publication references
        run: python scripts/audit_keikyu_previous_publication_refs.py --output /tmp/keikyu-previous-refs.json
      - name: Build and verify exact-reference graph
        run: |
          python scripts/build_keikyu_cross_page_identity_audit.py \
            /tmp/keikyu-stop-times.json \
            /tmp/keikyu-previous-refs.json \
            --output /tmp/keikyu-identity-graph.json
          python scripts/verify_keikyu_cross_page_identity_audit.py /tmp/keikyu-identity-graph.json
      - name: Classify zero-time grid fragments
        run: |
          python scripts/audit_keikyu_empty_fragments.py \
            /tmp/keikyu-stop-times.json \
            /tmp/keikyu-identity-graph.json \
            --output /tmp/keikyu-empty-fragments.json
      - name: Build and verify independent mother set
        run: |
          python scripts/build_keikyu_independent_mother_set_audit.py \
            /tmp/keikyu-stop-times.json \
            /tmp/keikyu-identity-graph.json \
            --output /tmp/keikyu-mother-set.json
          python scripts/verify_keikyu_independent_mother_set_audit.py /tmp/keikyu-mother-set.json
      - name: Write compact audit summaries
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          data = json.loads(Path('/tmp/keikyu-mother-set.json').read_text(encoding='utf-8'))
          empty = json.loads(Path('/tmp/keikyu-empty-fragments.json').read_text(encoding='utf-8'))
          summary = {
              'version': 2,
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'sourceSha256': data['sourceSha256'],
              'localFragmentCount': data['localFragmentCount'],
              'officialCrossPageEdgeCount': data['officialCrossPageEdgeCount'],
              'candidatePhysicalTrainCountBeforeBlankClassification': data['candidatePhysicalTrainCount'],
              'joinedPhysicalTrainCandidateCount': data['joinedPhysicalTrainCandidateCount'],
              'singletonPhysicalTrainCandidateCountBeforeBlankClassification': data['singletonPhysicalTrainCandidateCount'],
              'componentSizeHistogramBeforeBlankClassification': data['componentSizeHistogram'],
              'resolvedTimeCells': data['resolvedTimeCells'],
              'unresolvedTimeCells': data['unresolvedTimeCells'],
              'sourceTimeCells': data['sourceTimeCells'],
              'emptyLocalFragmentCount': data['emptyLocalFragmentCount'],
              'emptyClassification': {
                  'counts': empty['emptyCounts'],
                  'positions': empty['emptyPositionCounts'],
                  'pagesWithEmptyFragments': empty['pagesWithEmptyFragments'],
                  'nonemptyAnonymousFragmentCount': empty['nonemptyAnonymousFragmentCount'],
                  'evidenceBearingEmptyFragmentCount': empty['evidenceBearingEmptyFragmentCount'],
                  'structuralBlankCandidateCount': empty['structuralBlankCandidateCount'],
                  'evidenceBearingExamples': empty['evidenceBearingEmptyFragments'][:50],
                  'structuralBlankExamples': empty['structuralBlankCandidates'][:50],
              },
              'issues': data['issues'],
              'runtimeSameTrainPromotions': data['identityPolicy']['runtimeSameTrainPromotions'],
              'note': 'Audit-only. Zero-time anonymous unreferenced grid slots are classified separately and are not yet accepted as physical trains.'
          }
          path = Path('docs/transit/keikyu-independent-mother-set-audit.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - name: Commit audit summary to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/transit/keikyu-independent-mother-set-audit.json
          if git diff --cached --quiet; then
            echo "No audit summary change."
            exit 0
          fi
          git commit -m "Record Keikyu independent mother-set audit"
          git pull --rebase origin work/keikyu-mother-set-20260906
          git push origin HEAD:work/keikyu-mother-set-20260906
