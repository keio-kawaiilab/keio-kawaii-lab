name: Apply Keikyu Zushi explicit cross-page evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extend-keikyu-zushi-cross-page.yml'

permissions:
  contents: read

jobs:
  prove:
    name: prove-explicit-cross-page-zushi
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      matched: ${{ steps.summary.outputs.matched }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install strict PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pip install pdfplumber==0.11.7 PyMuPDF==1.26.4 requests==2.32.5
      - name: Test cross-page generator and consumer
        run: |
          python -m py_compile \
            scripts/keikyu_cross_page_zushi_evidence.py \
            scripts/keikyu_internal_generated_evidence.py
          python scripts/test_keikyu_cross_page_zushi_evidence.py
          python scripts/test_keikyu_internal_generated_evidence.py
          python scripts/test_keikyu_previous_publication_refs.py
          python scripts/test_keikyu_cross_page_identity_audit.py
      - name: Download official full timetable once
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from keikyu_official_pdf import download_official_pdf
          download_official_pdf(Path('/tmp/keikyu-schedule-all.pdf'))
          PY
      - name: Build explicit official cross-page identity graph
        run: |
          python scripts/build_keikyu_official_stop_times.py \
            --pdf /tmp/keikyu-schedule-all.pdf \
            --output /tmp/keikyu-stop-times.json
          python scripts/audit_keikyu_previous_publication_refs.py \
            --pdf /tmp/keikyu-schedule-all.pdf \
            --output /tmp/keikyu-previous-refs.json
          python scripts/build_keikyu_cross_page_identity_audit.py \
            /tmp/keikyu-stop-times.json \
            /tmp/keikyu-previous-refs.json \
            --output /tmp/keikyu-cross-page-audit.json
          python scripts/verify_keikyu_cross_page_identity_audit.py \
            /tmp/keikyu-cross-page-audit.json
      - name: Prove remaining Zushi pairs only through explicit previous-page chains
        run: |
          cp data/transit-v2/keikyu-internal-official-train-evidence.json /tmp/evidence-before.json
          python scripts/keikyu_cross_page_zushi_evidence.py \
            --official-stop-times /tmp/keikyu-stop-times.json \
            --cross-page-audit /tmp/keikyu-cross-page-audit.json \
            --existing /tmp/evidence-before.json \
            --output /tmp/evidence-after.json \
            --report /tmp/cross-page-report.json
      - name: Summarize genuinely new explicit proofs
        id: summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          marker='official-previous-publication-chain-two-exact-station-times-v1'
          before=json.loads(Path('/tmp/evidence-before.json').read_text(encoding='utf-8'))
          after=json.loads(Path('/tmp/evidence-after.json').read_text(encoding='utf-8'))
          report=json.loads(Path('/tmp/cross-page-report.json').read_text(encoding='utf-8'))
          old_ids={str(r.get('id') or '') for r in before.get('entries') or []}
          fresh=[r for r in after.get('entries') or [] if str(r.get('id') or '') not in old_ids and marker in [str(v) for v in r.get('evidence') or []]]
          Path('/tmp/cross-page-fresh.json').write_text(json.dumps({'entries':fresh},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          matched=int(report.get('matchedSingleton') or 0)
          if matched != len(fresh):
              raise SystemExit(f'report/fresh proof mismatch: report={matched} fresh={len(fresh)}')
          print('CROSS_PAGE_ELIGIBLE', int(report.get('eligibleUnresolvedSources') or 0))
          print('CROSS_PAGE_OFFICIAL_EDGES', int(report.get('officialCrossPageEdges') or 0))
          print('CROSS_PAGE_NEW_PROVEN', len(fresh))
          print('CROSS_PAGE_DIRECTIONS', json.dumps(report.get('directions') or {},ensure_ascii=False,sort_keys=True))
          print('CROSS_PAGE_CALENDARS', json.dumps(report.get('calendars') or {},ensure_ascii=False,sort_keys=True))
          print('CROSS_PAGE_REASONS', json.dumps(report.get('reasons') or {},ensure_ascii=False,sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write(f'matched={len(fresh)}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zushi-explicit-cross-page-proof
          path: |
            /tmp/cross-page-report.json
            /tmp/cross-page-fresh.json
          retention-days: 7
          if-no-files-found: error

  materialize:
    name: materialize-explicit-cross-page-zushi
    needs: prove
    if: needs.prove.outputs.matched != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    concurrency:
      group: transit-db-writer
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync to latest main after writer lock
        run: |
          git fetch origin main
          git checkout -B main origin/main
          echo "MATERIALIZE_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install strict PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pip install pdfplumber==0.11.7 PyMuPDF==1.26.4 requests==2.32.5
      - name: Re-test cross-page safety rules on latest main
        run: |
          python scripts/test_keikyu_cross_page_zushi_evidence.py
          python scripts/test_keikyu_internal_generated_evidence.py
          python scripts/test_keikyu_previous_publication_refs.py
          python scripts/test_keikyu_cross_page_identity_audit.py
      - name: Download official full timetable once
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from keikyu_official_pdf import download_official_pdf
          download_official_pdf(Path('/tmp/keikyu-schedule-all.pdf'))
          PY
      - name: Rebuild official explicit identity graph on latest main
        run: |
          python scripts/build_keikyu_official_stop_times.py \
            --pdf /tmp/keikyu-schedule-all.pdf \
            --output /tmp/keikyu-stop-times.json
          python scripts/audit_keikyu_previous_publication_refs.py \
            --pdf /tmp/keikyu-schedule-all.pdf \
            --output /tmp/keikyu-previous-refs.json
          python scripts/build_keikyu_cross_page_identity_audit.py \
            /tmp/keikyu-stop-times.json \
            /tmp/keikyu-previous-refs.json \
            --output /tmp/keikyu-cross-page-audit.json
          python scripts/verify_keikyu_cross_page_identity_audit.py \
            /tmp/keikyu-cross-page-audit.json
      - name: Re-prove and write only fresh cross-page evidence
        id: fresh
        run: |
          cp data/transit-v2/keikyu-internal-official-train-evidence.json /tmp/evidence-before.json
          python scripts/keikyu_cross_page_zushi_evidence.py \
            --official-stop-times /tmp/keikyu-stop-times.json \
            --cross-page-audit /tmp/keikyu-cross-page-audit.json \
            --existing /tmp/evidence-before.json \
            --output data/transit-v2/keikyu-internal-official-train-evidence.json \
            --report /tmp/cross-page-report.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          marker='official-previous-publication-chain-two-exact-station-times-v1'
          before=json.loads(Path('/tmp/evidence-before.json').read_text(encoding='utf-8'))
          after=json.loads(Path('data/transit-v2/keikyu-internal-official-train-evidence.json').read_text(encoding='utf-8'))
          report=json.loads(Path('/tmp/cross-page-report.json').read_text(encoding='utf-8'))
          old_ids={str(r.get('id') or '') for r in before.get('entries') or []}
          fresh=[r for r in after.get('entries') or [] if str(r.get('id') or '') not in old_ids and marker in [str(v) for v in r.get('evidence') or []]]
          Path('/tmp/cross-page-fresh.json').write_text(json.dumps({'entries':fresh},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          matched=int(report.get('matchedSingleton') or 0)
          if matched != len(fresh):
              raise SystemExit(f'fresh latest-main proof mismatch: report={matched} fresh={len(fresh)}')
          if not fresh:
              raise SystemExit('cross-page proofs disappeared on latest main; refusing DB change')
          print('FRESH_CROSS_PAGE_PROVEN', len(fresh))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write(f'matched={len(fresh)}\n')
          PY
      - name: Re-finalize and audit strict transit DB
        run: |
          python scripts/finalize_transit_v2.py
          python scripts/audit_transit_v2.py
      - name: Verify every fresh cross-page proof materialized and cleared
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ROOT=Path('data/transit-v2')
          proof=json.loads(Path('/tmp/cross-page-fresh.json').read_text(encoding='utf-8')).get('entries') or []
          pairs={(str(r.get('fromFragment') or ''),str(r.get('toFragment') or '')) for r in proof}
          ids={str(r.get('id') or '') for r in proof}
          edges=json.loads((ROOT/'same-train-edges.json').read_text(encoding='utf-8')).get('edges') or []
          materialized={(str(r.get('fromFragment') or ''),str(r.get('toFragment') or '')) for r in edges if r.get('classification')=='same-train'}
          unresolved=json.loads((ROOT/'coverage.json').read_text(encoding='utf-8')).get('unresolved') or []
          lingering={str(r.get('fragment') or '') for r in unresolved if r.get('kind')=='missing-boundary-train-identity-evidence'}
          rejected={str(r.get('evidenceId') or '') for r in unresolved if r.get('kind')=='keikyu-internal-generated-evidence-rejected'}
          missing=sorted(pairs-materialized)
          still=sorted({a for a,_b in pairs}&lingering)
          bad=sorted(ids&rejected)
          print('CROSS_PAGE_PROVEN',len(pairs))
          print('CROSS_PAGE_MATERIALIZED',len(pairs&materialized))
          print('CROSS_PAGE_STILL_UNRESOLVED',len(still))
          print('CROSS_PAGE_REJECTED',len(bad))
          if not pairs or missing or still or bad:
              raise SystemExit(f'cross-page verification failed missing={missing[:3]} still={still[:3]} rejected={bad[:3]}')
          PY
      - name: Commit only fresh generated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/transit-v2/keikyu-internal-official-train-evidence.json \
            data/transit-v2/same-train-edges.json \
            data/transit-v2/runtime-same-train.json \
            data/transit-v2/coverage.json \
            data/transit-v2/index.json \
            data/transit-v2/unresolved-summary.json
          if git diff --cached --quiet; then
            echo "No fresh explicit cross-page DB changes"
            exit 0
          fi
          git fetch origin main
          remote="$(git rev-parse origin/main)"
          if [ "$MATERIALIZE_BASE" != "$remote" ]; then
            echo "main moved during fresh cross-page proof; refusing stale commit"
            exit 1
          fi
          git commit -m "Apply explicit Keikyu Zushi cross-page evidence"
          git push origin HEAD:main
