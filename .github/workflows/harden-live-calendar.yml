name: Harden live calendar

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/harden-live-calendar.yml"
      - "scripts/guard_birthday_year_consistency.py"
      - "scripts/harden_ticket_semantics.py"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove impossible birthday rows and correct ticket semantics
        shell: bash
        run: |
          set -euo pipefail
          python scripts/guard_birthday_year_consistency.py --data data/live-events.json
          python scripts/harden_ticket_semantics.py --data data/live-events.json
          python -m json.tool data/live-events.json >/dev/null

      - name: Publish hardened data immediately
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/live-events.json; then
            echo "No calendar data changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-events.json
          git commit -m "Harden live calendar data"
          git pull --rebase origin main
          git push origin HEAD:main
