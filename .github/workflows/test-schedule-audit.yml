name: Test schedule audit fixes

on:
  pull_request:
    paths:
      - "scripts/**"
      - "data/live-events.json"
      - "schedule.html"
      - ".github/workflows/test-schedule-audit.yml"
      - ".github/workflows/apply-special-event-entities.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run schedule audit regression tests
        working-directory: scripts
        run: |
          python -m unittest -v test_special_event_entities.py
          python -m unittest -v test_special_event_occurrence_details.py
          python -m unittest -v test_schedule_audit_corrections.py
          python -m unittest -v test_performance_entities.py
          python -m unittest -v test_guard_schedule_latest_data_loading.py
      - name: Rebuild schedule through release boundary
        run: |
          python scripts/normalize_special_event_entities.py
          python scripts/schedule_audit_corrections.py --fail-on-conflict
          python scripts/build_schedule_snapshot.py
          python scripts/fix_schedule_shell.py
          python scripts/install_performance_public_view.py
          python scripts/strip_schedule_explanations.py
          node --check /tmp/schedule-inline.js
          node scripts/test_schedule_band_grouping.js
          node scripts/test_schedule_scope_ui.js
          node scripts/test_schedule_latest_data_guard.js
          python scripts/normalize_special_event_entities.py --check
          python scripts/schedule_audit_corrections.py --check --fail-on-conflict
      - name: Verify one CANDY TUNE Sendai performance owns every ticket offer
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import date, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          payload = json.loads(Path("data/live-events.json").read_text(encoding="utf-8"))
          public = payload.get("publicEvents") or []
          today = datetime.now(ZoneInfo("Asia/Tokyo")).date()
          if date(2026, 10, 8) < today:
              html = Path("schedule.html").read_text(encoding="utf-8")
              assert "data.publicEvents||data.events" in html
              assert "function hasRequiredCandyTuneTour(data)" in html
              assert "if(!hasRequiredCandyTuneTour(data))throw new Error('integrity')" in html
              assert "e.entityType!=='special-event'&&e.entityType!=='performance'" in html
              raise SystemExit(0)

          sendai = [
              e for e in public
              if e.get("entityType") == "performance"
              and e.get("group") == "CANDY TUNE"
              and str(e.get("eventDate") or "")[:10] == "2026-10-08"
              and str(e.get("startTime") or "") == "18:30"
          ]
          assert len(sendai) == 1, f"expected one public Sendai performance, got {len(sendai)}"
          event = sendai[0]
          assert "仙台サンプラザホール" in str(event.get("venue") or "")
          assert event.get("openTime") == "17:30"
          offers = event.get("offers") or []
          ticket_types = {str(o.get("ticketType") or "") for o in offers if isinstance(o, dict)}
          event_day = datetime.fromisoformat(str(event.get("eventDate"))[:10]).date()
          today = datetime.now(ZoneInfo("Asia/Tokyo")).date()
          if event_day >= today:
              assert any("一般発売" in value for value in ticket_types), ticket_types

          html = Path("schedule.html").read_text(encoding="utf-8")
          cards = re.findall(
              r'<article class="card[^>]*data-group="CANDY TUNE"[^>]*>.*?2026/10/8.*?</article>',
              html,
              re.S,
          )
          matches = [card for card in cards if "仙台サンプラザホール" in card and "JAPAN TOUR 2026" in card]
          assert len(matches) == 1, f"expected one static Sendai tour card, got {len(matches)}"
          if event_day >= today:
              assert "一般発売" in matches[0]
          assert "data.publicEvents||data.events" in html
          assert "function hasRequiredCandyTuneTour(data)" in html
          assert "if(!hasRequiredCandyTuneTour(data))throw new Error('integrity')" in html
          assert "e.entityType!=='special-event'&&e.entityType!=='performance'" in html
          PY
      - name: Verify Christmas SESSION Day1 has one confirmed venue fact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("data/live-events.json").read_text(encoding="utf-8"))
          token = "KAWAII LAB. Christmas SESSION 2026"
          day = "2026-12-12"
          venue = "有明アリーナ"
          audit_id = "P0-christmas-session-2026-day1-venue"

          def title(e):
              return " ".join(str(e.get(k) or "") for k in ("displayTitle", "eventTitle", "title"))

          def compatible(open_time, start_time):
              return (not open_time or str(open_time).strip() == "15:00") and (not start_time or str(start_time).strip() == "17:00")

          authoritative = [
              e for e in (payload.get("publicEvents") or [])
              if e.get("group") == "KAWAII LAB.合同"
              and str(e.get("eventDate") or "")[:10] == day
              and token.lower() in title(e).lower()
          ]
          assert len(authoritative) == 1, f"expected one canonical public Christmas SESSION Day1 row, got {len(authoritative)}"
          event = authoritative[0]
          assert event.get("venue") == venue
          assert compatible(event.get("openTime"), event.get("startTime"))
          PY
      - name: Verify SWEET STEP is rendered as date-scoped occurrences
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import date, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          html = Path("schedule.html").read_text(encoding="utf-8")
          today = datetime.now(ZoneInfo("Asia/Tokyo")).date()
          if date(2026, 9, 14) < today:
              assert "function expandSpecialOccurrences(raw)" in html
              assert "function occurrenceSpecialDetails(event)" in html
              raise SystemExit(0)

          payload = json.loads(Path("data/live-events.json").read_text(encoding="utf-8"))
          matches = [
              e for e in payload.get("events", [])
              if e.get("group") == "SWEET STEADY"
              and e.get("eventCategory") == "release-event"
              and "SWEET STEP" in str(e.get("displayTitle") or e.get("title") or "")
              and {"2026-09-05", "2026-09-07", "2026-09-14"}.issubset(set(e.get("eventDates") or []))
          ]
          assert len(matches) == 1, f"expected one canonical SWEET STEP series, got {len(matches)}"
          event = matches[0]
          assert event.get("displayByOccurrence") is True
          for key in ("salesStartTime", "gatheringTime", "startTime", "numberedCallTimes", "purchaseMethod"):
              assert key not in event, f"cross-date parent field leaked: {key}"
          details = event["occurrenceDetails"]
          assert details["2026-09-05"]["salesStartTime"] == "10:10"
          assert details["2026-09-05"]["gatheringTime"] == "13:20"
          assert details["2026-09-05"]["startTime"] == "14:00"
          assert details["2026-09-07"]["salesStartTime"] == "12:00"
          assert details["2026-09-07"]["gatheringTime"] == "16:00"
          assert details["2026-09-07"]["startTime"] == "16:30"
          assert details["2026-09-14"]["specialDetailsStatus"] == "awaiting-details"
          assert "startTime" not in details["2026-09-14"]

          html = Path("schedule.html").read_text(encoding="utf-8")
          parent_id = re.escape(str(event.get("id")))
          match = re.search(
              rf'<article[^>]+data-event-id="{parent_id}--2026-09-14(?:-\d+)?".*?</article>',
              html,
              re.S,
          )
          assert match, "missing future date-scoped rendered card for 2026-09-14"
          card = match.group(0)
          assert "公式の詳細発表待ちです。開催日と会場のみ確認済みです。" in card
          assert "<b>会場販売開始</b>" not in card
          assert "<b>集合</b>" not in card
          assert "<b>イベント開始</b>" not in card
          assert "整理番号別の集合・呼び出し目安" not in card
          assert "function expandSpecialOccurrences(raw)" in html
          PY
