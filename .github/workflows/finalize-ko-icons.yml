name: Finalize KO site icons

on:
  push:
    paths:
      - 'icon-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build KO icons and wire metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import base64, io, json, re

          src_b64 = Path('apple-touch-icon-ko-base64.txt').read_text(encoding='utf-8').strip()
          src = Image.open(io.BytesIO(base64.b64decode(src_b64))).convert('RGB')
          bg = src.getpixel((0, 0))

          def save(name, size, pad=0.0):
              canvas = Image.new('RGB', (size, size), bg)
              inner = int(size * (1 - 2 * pad))
              img = ImageOps.contain(src, (inner, inner), Image.Resampling.LANCZOS) if pad else src.resize((size, size), Image.Resampling.LANCZOS)
              canvas.paste(img, ((size - img.width) // 2, (size - img.height) // 2))
              canvas.save(name, 'PNG', optimize=True)

          save('apple-touch-icon.png', 180)
          save('favicon-32.png', 32)
          save('icon-192.png', 192)
          save('icon-512.png', 512)
          save('icon-maskable-512.png', 512, 0.10)

          manifest = {
              'name': '慶應カワラボ同好会',
              'short_name': '慶應カワラボ',
              'description': '慶應義塾大学登録学生団体 KAWAII LAB.同好会 公式サイト',
              'start_url': '/keio-kawaii-lab/',
              'scope': '/keio-kawaii-lab/',
              'display': 'standalone',
              'background_color': '#fefbf6',
              'theme_color': '#14386f',
              'icons': [
                  {'src':'./icon-192.png','sizes':'192x192','type':'image/png','purpose':'any'},
                  {'src':'./icon-512.png','sizes':'512x512','type':'image/png','purpose':'any'},
                  {'src':'./icon-maskable-512.png','sizes':'512x512','type':'image/png','purpose':'maskable'},
                  {'src':'./site-icon.svg','sizes':'any','type':'image/svg+xml','purpose':'any'}
              ]
          }
          Path('site.webmanifest').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          icon_block = (
              '<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">\n'
              '<link rel="icon" type="image/svg+xml" sizes="any" href="./site-icon.svg">\n'
              '<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">\n'
              '<link rel="manifest" href="./site.webmanifest">\n'
              '<meta name="theme-color" content="#14386f">\n'
              '<meta name="application-name" content="慶應カワラボ同好会">\n'
              '<meta name="apple-mobile-web-app-title" content="慶應カワラボ">'
          )

          for page in Path('.').glob('*.html'):
              text = page.read_text(encoding='utf-8')
              text = re.sub(r'\n?<link rel="icon"[^>]*>', '', text)
              text = re.sub(r'\n?<link rel="apple-touch-icon"[^>]*>', '', text)
              text = re.sub(r'\n?<link rel="manifest"[^>]*>', '', text)
              text = re.sub(r'\n?<meta name="theme-color"[^>]*>', '', text)
              text = re.sub(r'\n?<meta name="application-name"[^>]*>', '', text)
              text = re.sub(r'\n?<meta name="apple-mobile-web-app-title"[^>]*>', '', text)
              marker = re.search(r'<meta name="viewport"[^>]*>', text)
              if marker:
                  pos = marker.end()
                  text = text[:pos] + '\n' + icon_block + text[pos:]
              elif '</head>' in text:
                  text = text.replace('</head>', icon_block + '\n</head>', 1)
              page.write_text(text, encoding='utf-8')

          # The JS fallback remains useful for any future page that omits static metadata.
          for js_name in ('script.js', 'train-status.js'):
              p = Path(js_name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              text = text.replace('ensureLink("icon", "./site-icon.svg", { type: "image/svg+xml", sizes: "any" });',
                                  'ensureLink("icon", "./favicon-32.png", { type: "image/png", sizes: "32x32" });')
              text = text.replace('ensureLink("icon","./site-icon.svg",{type:"image/svg+xml",sizes:"any"});',
                                  'ensureLink("icon","./favicon-32.png",{type:"image/png",sizes:"32x32"});')
              p.write_text(text, encoding='utf-8')

          # One-off source/trigger/workflow cleanup after successful generation.
          for cleanup in ('apple-touch-icon-ko-base64.txt', 'icon-trigger.txt', '.github/workflows/finalize-ko-icons.yml'):
              p = Path(cleanup)
              if p.exists():
                  p.unlink()
          PY

      - name: Verify icon files
        run: |
          file apple-touch-icon.png favicon-32.png icon-192.png icon-512.png icon-maskable-512.png
          python - <<'PY'
          from PIL import Image
          expected = {
            'apple-touch-icon.png': (180,180),
            'favicon-32.png': (32,32),
            'icon-192.png': (192,192),
            'icon-512.png': (512,512),
            'icon-maskable-512.png': (512,512),
          }
          for p, size in expected.items():
              assert Image.open(p).size == size, (p, Image.open(p).size)
          print('KO icon sizes verified')
          PY

      - name: Commit generated icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Fix KO site icons across devices [skip ci]'
          git push
