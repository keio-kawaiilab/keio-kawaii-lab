<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#26305c">
  <title>乗り換え案内 β | KAWAII LAB.同好会</title>
  <style>
    :root{
      --navy:#26305c;--navy-ink:#1d2547;--red:#a93b4f;--gold:#b9974a;
      --navy-pale:#eceff8;--red-pale:#f9ecef;--gold-pale:#f6efdc;
      --bg:#fdfcf8;--card:#fff;--line:#e7e3d8;--muted:#6b7089;
      --green:#287a54;--green-pale:#eaf6ef;--orange:#a86119;--orange-pale:#fff3df;
      --radius:20px;--shadow:0 8px 28px rgba(38,48,92,.09);--maxw:780px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--navy-ink);background:linear-gradient(180deg,#fdfcf8 0,#f8f7f2 100%);line-height:1.6;-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .wrap{width:min(calc(100% - 28px),var(--maxw));margin:0 auto}
    .topbar{position:sticky;top:0;z-index:30;background:rgba(253,252,248,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(231,227,216,.85)}
    .topbar-inner{height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{font-weight:800;letter-spacing:.02em;font-size:.93rem;color:var(--navy)}
    .beta{font-size:.68rem;font-weight:800;letter-spacing:.08em;color:#fff;background:var(--red);padding:4px 9px;border-radius:999px}
    .hero{padding:28px 0 18px}
    .eyebrow{margin:0 0 8px;font-size:.78rem;font-weight:800;letter-spacing:.12em;color:var(--red)}
    h1{margin:0;font-size:clamp(1.65rem,7vw,2.35rem);line-height:1.25;letter-spacing:-.02em}
    .lead{margin:10px 0 0;color:var(--muted);font-size:.93rem}
    .notice{margin-top:18px;padding:12px 14px;border:1px solid #eadbb7;background:var(--gold-pale);border-radius:14px;font-size:.8rem;color:#705d2e}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .search-card{padding:18px;margin-bottom:18px}
    .field{margin-bottom:15px}
    .field:last-of-type{margin-bottom:0}
    label,.label{display:block;margin:0 0 7px;font-size:.78rem;font-weight:800;color:var(--navy)}
    .input,.select{width:100%;height:50px;border:1.5px solid #d9d8d1;border-radius:14px;background:#fff;color:var(--navy-ink);padding:0 14px;outline:none;transition:.16s}
    .input:focus,.select:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(38,48,92,.09)}
    .station-row{display:grid;grid-template-columns:1fr 46px 1fr;align-items:end;gap:8px}
    .swap{height:46px;border:1px solid var(--line);border-radius:14px;background:var(--navy-pale);color:var(--navy);font-weight:900;font-size:1.1rem}
    .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
    .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;color:var(--navy-ink);font-size:.74rem;font-weight:700}
    .chip:hover{background:var(--navy-pale)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .primary{width:100%;height:54px;border:0;border-radius:16px;background:var(--navy);color:#fff;font-weight:900;letter-spacing:.02em;margin-top:18px;box-shadow:0 8px 18px rgba(38,48,92,.2)}
    .primary:active{transform:translateY(1px)}
    .saved{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;margin-top:12px;border-top:1px dashed var(--line);font-size:.77rem;color:var(--muted)}
    .text-btn{border:0;background:transparent;color:var(--red);font-weight:800;padding:4px}
    .result{display:none;margin-bottom:30px}
    .result.is-show{display:block}
    .summary{padding:18px;margin-bottom:12px;overflow:hidden;position:relative}
    .summary:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--red)}
    .summary-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .result-kicker{font-size:.7rem;font-weight:900;letter-spacing:.1em;color:var(--red);margin-bottom:4px}
    .result-title{font-size:1.15rem;font-weight:900;line-height:1.35}
    .demo-tag{flex:none;border-radius:999px;background:var(--orange-pale);color:var(--orange);font-size:.68rem;font-weight:900;padding:5px 9px}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}
    .metric{background:#faf9f5;border-radius:12px;padding:10px 8px;text-align:center}
    .metric b{display:block;font-size:1.03rem;color:var(--navy)}
    .metric span{display:block;margin-top:2px;color:var(--muted);font-size:.66rem}
    .route-card{padding:18px;margin-bottom:12px}
    .route-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
    .route-head h2,.status-card h2{font-size:.97rem;margin:0}
    .route-note{font-size:.68rem;color:var(--muted)}
    .timeline{position:relative}
    .leg{display:grid;grid-template-columns:30px 1fr;gap:10px;position:relative;padding-bottom:16px}
    .leg:last-child{padding-bottom:0}
    .leg:not(:last-child):before{content:"";position:absolute;left:14px;top:22px;bottom:-1px;width:2px;background:#d9dce8}
    .dot{width:14px;height:14px;border:3px solid var(--navy);background:#fff;border-radius:50%;margin:5px auto 0;z-index:1}
    .leg-content{min-width:0}
    .station{font-weight:900;font-size:.94rem}
    .line{margin-top:5px;display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:9px;background:var(--navy-pale);font-size:.74rem;font-weight:800}
    .line-dot{width:8px;height:8px;border-radius:50%;background:var(--navy)}
    .walk{background:#f2f2ee;color:#565a68}
    .leg-meta{margin-top:4px;font-size:.7rem;color:var(--muted)}
    .status-card{padding:18px;margin-bottom:12px}
    .status-list{display:grid;gap:8px;margin-top:12px}
    .status-item{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;border-radius:12px;background:var(--green-pale);font-size:.77rem}
    .status-item.warn{background:var(--red-pale);color:#7b2e3e}
    .status-icon{font-size:.95rem;line-height:1.3}
    .status-item b{display:block;margin-bottom:1px}
    .footer-note{padding:16px 4px 34px;color:var(--muted);font-size:.72rem;text-align:center}
    .empty{padding:18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:.8rem;text-align:center}
    @media(max-width:560px){
      .wrap{width:min(calc(100% - 20px),var(--maxw))}
      .hero{padding-top:22px}
      .search-card,.summary,.route-card,.status-card{padding:15px}
      .station-row{grid-template-columns:1fr 42px 1fr;gap:6px}
      .input,.select{height:48px;padding:0 10px;font-size:.9rem}
      .metrics{gap:6px}.metric{padding:9px 4px}.metric b{font-size:.95rem}.metric span{font-size:.62rem}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">KAWAII LAB.同好会</div>
      <div class="beta">TRANSIT β</div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <p class="eyebrow">LIVE DAY TRANSIT</p>
      <h1>ライブに間に合う<br>乗り換え案内</h1>
      <p class="lead">会場の最寄駅まで、なるべくシンプルに。運行情報も同じ画面で確認できます。</p>
      <div class="notice"><b>プレビュー版</b>：経路計算は小規模なデモ路線網による概算です。正確な時刻表・運賃APIはまだ接続していません。</div>
    </section>

    <section class="card search-card" aria-label="乗り換え検索">
      <div class="station-row">
        <div class="field">
          <label for="from">出発駅</label>
          <select id="from" class="select"></select>
        </div>
        <button class="swap" id="swap" type="button" aria-label="出発駅と到着駅を入れ替え">⇄</button>
        <div class="field">
          <label for="to">到着駅</label>
          <select id="to" class="select"></select>
        </div>
      </div>

      <div class="field">
        <span class="label">よく使いそうな到着先</span>
        <div class="chips" id="venue-chips"></div>
      </div>

      <div class="grid2">
        <div class="field">
          <label for="date">日付</label>
          <input id="date" class="input" type="date">
        </div>
        <div class="field">
          <label for="arrival">到着したい時刻</label>
          <input id="arrival" class="input" type="time" value="17:00">
        </div>
      </div>

      <button class="primary" id="search" type="button">この条件で経路を見る</button>
      <div class="saved">
        <span id="saved-label">いつもの出発駅を端末に保存できます</span>
        <button class="text-btn" id="save-home" type="button">出発駅を保存</button>
      </div>
    </section>

    <section class="result" id="result" aria-live="polite">
      <article class="card summary">
        <div class="summary-top">
          <div>
            <div class="result-kicker">RECOMMENDED ROUTE</div>
            <div class="result-title" id="result-title"></div>
          </div>
          <span class="demo-tag">概算デモ</span>
        </div>
        <div class="metrics">
          <div class="metric"><b id="metric-time">—</b><span>所要目安</span></div>
          <div class="metric"><b id="metric-transfer">—</b><span>乗換</span></div>
          <div class="metric"><b id="metric-depart">—</b><span>出発目安</span></div>
        </div>
      </article>

      <article class="card route-card">
        <div class="route-head">
          <h2>経路</h2>
          <span class="route-note">時刻表未接続</span>
        </div>
        <div class="timeline" id="timeline"></div>
      </article>

      <article class="card status-card">
        <h2>この経路の運行情報</h2>
        <div class="status-list" id="status-list"></div>
      </article>
    </section>

    <p class="footer-note">このページはデザイン・操作感確認用の非公開導線プレビューです。検索エンジンには掲載しない設定です。</p>
  </main>

  <script>
  (function(){
    'use strict';

    var STATIONS = ['八潮','北千住','秋葉原','岩本町','上野','東京','大手町','九段下','新宿','渋谷','横浜','桜木町','新高島','新横浜','浜松町','天空橋','豊洲','新豊洲','有明','国際展示場','大宮'];
    var GRAPH = {};
    function edge(a,b,min,line,type){
      (GRAPH[a]||(GRAPH[a]=[])).push({to:b,min:min,line:line,type:type||'train'});
      (GRAPH[b]||(GRAPH[b]=[])).push({to:a,min:min,line:line,type:type||'train'});
    }
    edge('八潮','北千住',7,'つくばエクスプレス');
    edge('北千住','秋葉原',11,'つくばエクスプレス');
    edge('北千住','上野',9,'東京メトロ日比谷線');
    edge('上野','秋葉原',4,'JR山手線');
    edge('秋葉原','東京',4,'JR京浜東北線');
    edge('秋葉原','岩本町',6,'徒歩','walk');
    edge('岩本町','九段下',6,'都営新宿線');
    edge('東京','大手町',6,'徒歩','walk');
    edge('大手町','九段下',5,'東京メトロ半蔵門線');
    edge('新宿','九段下',9,'都営新宿線');
    edge('新宿','渋谷',7,'JR山手線');
    edge('渋谷','横浜',28,'東急東横線');
    edge('東京','横浜',27,'JR東海道線');
    edge('横浜','桜木町',4,'JR根岸線');
    edge('横浜','新高島',3,'みなとみらい線');
    edge('横浜','新横浜',12,'横浜市営地下鉄ブルーライン');
    edge('東京','浜松町',7,'JR京浜東北線');
    edge('浜松町','天空橋',18,'東京モノレール');
    edge('東京','豊洲',14,'東京メトロ有楽町線');
    edge('豊洲','新豊洲',3,'ゆりかもめ');
    edge('新豊洲','有明',5,'ゆりかもめ');
    edge('有明','国際展示場',5,'徒歩','walk');
    edge('大宮','上野',27,'JR宇都宮線');

    var VENUE_STATION = {
      '日本武道館':'九段下','有明アリーナ':'新豊洲','東京ガーデンシアター':'有明',
      'ぴあアリーナMM':'桜木町','横浜アリーナ':'新横浜','Kアリーナ横浜':'新高島',
      'Zepp Haneda (TOKYO)':'天空橋'
    };

    var from=document.getElementById('from');
    var to=document.getElementById('to');
    var date=document.getElementById('date');
    var arrival=document.getElementById('arrival');
    var result=document.getElementById('result');
    var trainStatus=[];

    function optionList(select,selected){
      select.innerHTML=STATIONS.map(function(s){return '<option value="'+s+'"'+(s===selected?' selected':'')+'>'+s+'</option>';}).join('');
    }

    function todayString(){
      var d=new Date();
      return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    }

    function dijkstra(start,goal){
      var dist={},prev={},used={};
      STATIONS.forEach(function(s){dist[s]=Infinity;});
      dist[start]=0;
      while(true){
        var u=null,best=Infinity;
        Object.keys(dist).forEach(function(s){if(!used[s]&&dist[s]<best){best=dist[s];u=s;}});
        if(u===null||u===goal)break;
        used[u]=true;
        (GRAPH[u]||[]).forEach(function(e){
          var transferPenalty=0;
          var alt=dist[u]+e.min+transferPenalty;
          if(alt<dist[e.to]){dist[e.to]=alt;prev[e.to]={station:u,edge:e};}
        });
      }
      if(!isFinite(dist[goal]))return null;
      var nodes=[],cur=goal;
      while(cur!==start){
        var p=prev[cur]; if(!p)return null;
        nodes.push({from:p.station,to:cur,min:p.edge.min,line:p.edge.line,type:p.edge.type});
        cur=p.station;
      }
      nodes.reverse();
      return {minutes:Math.round(dist[goal]),legs:nodes};
    }

    function transferCount(legs){
      var lines=legs.filter(function(l){return l.type!=='walk';}).map(function(l){return l.line;});
      var count=0;
      for(var i=1;i<lines.length;i++)if(lines[i]!==lines[i-1])count++;
      return count;
    }

    function minusMinutes(time,min){
      var p=(time||'17:00').split(':').map(Number);
      var total=p[0]*60+p[1]-min;
      while(total<0)total+=1440;
      return String(Math.floor(total/60)%24).padStart(2,'0')+':'+String(total%60).padStart(2,'0');
    }

    function lineColor(line){
      if(/つくば/.test(line))return '#2d63b8';
      if(/東海道/.test(line))return '#f28e2b';
      if(/京浜東北|根岸/.test(line))return '#22a6c7';
      if(/山手/.test(line))return '#80b918';
      if(/新宿線/.test(line))return '#7fb34d';
      if(/半蔵門/.test(line))return '#8d63a9';
      if(/東横/.test(line))return '#d43f65';
      if(/みなとみらい/.test(line))return '#2864ad';
      if(/モノレール/.test(line))return '#1989b7';
      if(/有楽町/.test(line))return '#b89a3d';
      if(/ゆりかもめ/.test(line))return '#3f94a3';
      if(/宇都宮/.test(line))return '#f08a2e';
      return '#26305c';
    }

    function renderRoute(route){
      document.getElementById('result-title').textContent=from.value+' → '+to.value;
      document.getElementById('metric-time').textContent='約'+route.minutes+'分';
      document.getElementById('metric-transfer').textContent=transferCount(route.legs)+'回';
      document.getElementById('metric-depart').textContent=minusMinutes(arrival.value,route.minutes+8);

      var html='';
      route.legs.forEach(function(leg,i){
        if(i===0){
          html+='<div class="leg"><div class="dot"></div><div class="leg-content"><div class="station">'+leg.from+'</div></div></div>';
        }
        html+='<div class="leg"><div class="dot"></div><div class="leg-content">'+
          '<div class="station">'+leg.to+'</div>'+
          '<div class="line '+(leg.type==='walk'?'walk':'')+'"><span class="line-dot" style="background:'+lineColor(leg.line)+'"></span>'+leg.line+'</div>'+
          '<div class="leg-meta">'+leg.min+'分（デモ用概算）</div></div></div>';
      });
      document.getElementById('timeline').innerHTML=html;
      renderStatus(route.legs);
      result.classList.add('is-show');
      setTimeout(function(){result.scrollIntoView({behavior:'smooth',block:'start'});},80);
    }

    function normalizeLine(s){return String(s||'').replace(/JR|東京メトロ|都営地下鉄|都営|横浜市営地下鉄/g,'').replace(/[\s　()（）\[\]～〜・]/g,'').toLowerCase();}

    function renderStatus(legs){
      var box=document.getElementById('status-list');
      var lines=[];
      legs.filter(function(l){return l.type!=='walk';}).forEach(function(l){if(lines.indexOf(l.line)<0)lines.push(l.line);});
      var hits=[];
      lines.forEach(function(line){
        var n=normalizeLine(line);
        trainStatus.forEach(function(row){
          var r=normalizeLine(row.name);
          if((n&&r&&(n.indexOf(r)>=0||r.indexOf(n)>=0)) || (/京浜東北/.test(n)&&/京浜東北/.test(r)) || (/根岸/.test(n)&&/根岸/.test(r))){
            if(!hits.some(function(h){return h.name===row.name;}))hits.push(row);
          }
        });
      });
      if(!hits.length){
        box.innerHTML='<div class="status-item"><span class="status-icon">✓</span><div><b>掲載中の異常情報なし</b><span>現在の運行情報データ上、この経路に一致する異常は見つかっていません。</span></div></div>';
        return;
      }
      box.innerHTML=hits.map(function(h){return '<div class="status-item warn"><span class="status-icon">!</span><div><b>'+h.name+'：'+h.status+'</b><span>最終更新 '+String(h.updatedAt||'').replace(' ',' ' )+'</span></div></div>';}).join('');
    }

    function search(){
      var route=dijkstra(from.value,to.value);
      if(!route){
        document.getElementById('timeline').innerHTML='<div class="empty">このデモ路線網では経路を作れませんでした。</div>';
        document.getElementById('result-title').textContent=from.value+' → '+to.value;
        document.getElementById('metric-time').textContent='—';
        document.getElementById('metric-transfer').textContent='—';
        document.getElementById('metric-depart').textContent='—';
        document.getElementById('status-list').innerHTML='<div class="empty">経路がないため確認できません。</div>';
        result.classList.add('is-show');
        return;
      }
      renderRoute(route);
    }

    function addVenueChips(){
      var box=document.getElementById('venue-chips');
      Object.keys(VENUE_STATION).forEach(function(name){
        var b=document.createElement('button');
        b.type='button';b.className='chip';b.textContent=name;
        b.addEventListener('click',function(){to.value=VENUE_STATION[name];search();});
        box.appendChild(b);
      });
    }

    optionList(from,localStorage.getItem('klabTransitHome')||'八潮');
    optionList(to,'九段下');
    date.value=todayString();
    addVenueChips();

    document.getElementById('search').addEventListener('click',search);
    document.getElementById('swap').addEventListener('click',function(){var x=from.value;from.value=to.value;to.value=x;});
    document.getElementById('save-home').addEventListener('click',function(){
      localStorage.setItem('klabTransitHome',from.value);
      document.getElementById('saved-label').textContent='「'+from.value+'」をいつもの出発駅として保存しました';
    });

    fetch('../../data/train-status.json',{cache:'no-store'})
      .then(function(r){return r.ok?r.json():{routes:[]};})
      .then(function(data){trainStatus=Array.isArray(data.routes)?data.routes:[];})
      .catch(function(){trainStatus=[];});

    fetch('../../data/venues.json',{cache:'no-store'})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(data){
        if(!data||!Array.isArray(data.venues))return;
        var map={};
        data.venues.forEach(function(v){if(VENUE_STATION[v.name])map[v.name]=VENUE_STATION[v.name];});
        if(Object.keys(map).length)VENUE_STATION=map;
      }).catch(function(){});
  })();
  </script>
</body>
</html>
