.preview-ribbon{background:#fff1c9;border-bottom:1px solid #ead28a;color:#745b18;text-align:center;padding:9px 16px;font-size:.82rem;font-weight:700}.live-page-head{background:linear-gradient(135deg,var(--navy-pale),var(--red-pale))}.live-lead{max-width:48rem;margin:14px auto 0;color:var(--muted);font-size:.95rem}.source-note{max-width:930px;margin:0 auto 18px;padding:13px 16px;border-radius:14px;background:#eef7f1;border:1px solid #b8d8c4;color:#315e43;font-size:.84rem}.live-filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:28px}.live-filter{border:1.5px solid var(--line);background:#fff;color:var(--navy-ink);border-radius:999px;padding:9px 13px;font:inherit;font-size:.78rem;font-weight:800;cursor:pointer}.live-filter.is-active[data-group="all"]{background:var(--navy);color:#fff}.live-filter.is-active[data-group="FRUITS ZIPPER"]{background:var(--fz);color:#fff}.live-filter.is-active[data-group="CANDY TUNE"]{background:var(--ct);color:#fff}.live-filter.is-active[data-group="SWEET STEADY"]{background:var(--ss);color:#fff}.live-filter.is-active[data-group="CUTIE STREET"]{background:var(--cs);color:#493f11}.live-filter.is-active[data-group="MORE STAR"]{background:var(--ms);color:#fff}.calendar-toolbar{max-width:930px;margin:0 auto 12px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:12px}.calendar-toolbar>div{text-align:center}.calendar-nav{width:44px;height:44px;border:1.5px solid var(--line);border-radius:50%;background:#fff;color:var(--navy);font-size:1.65rem;cursor:pointer}.calendar-nav:disabled{opacity:.25;cursor:default}.calendar-month{font-weight:900;color:var(--navy);font-size:1.2rem}.calendar-help{font-size:.73rem;color:var(--muted)}.calendar-scroll{max-width:980px;margin:0 auto;overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow)}.calendar-shell{min-width:880px}.weekdays,.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{background:var(--navy-pale);border-bottom:1px solid var(--line)}.weekdays div{padding:9px;text-align:center;font-size:.75rem;font-weight:800;color:var(--muted)}.week{position:relative;min-height:145px;border-bottom:1px solid var(--line)}.day{padding:7px 8px;border-right:1px solid var(--line);background:#fff}.day:last-child{border-right:0}.day.other{background:#fafafa}.day.today{background:#fff8d9}.num{font-size:.77rem;font-weight:800;color:var(--muted)}.event-bar{position:absolute;height:52px;border:0;border-radius:8px;padding:5px 7px;text-align:left;color:#fff;background:var(--group);cursor:pointer;overflow:hidden;box-shadow:0 2px 8px rgba(29,37,71,.12)}.event-bar.group-cutie{color:#493f11}.event-bar strong{display:block;font-size:.76rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-bar span{display:block;font-size:.64rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.milestone{position:absolute;height:29px;border:1px solid var(--line);border-radius:7px;padding:3px 7px;background:#fff;color:var(--navy-ink);font-size:.67rem;font-weight:800;line-height:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-shadow:inset 4px 0 0 var(--group),0 1px 5px rgba(29,37,71,.08)}.detail{max-width:930px;margin:14px auto 0;padding:14px 16px;background:var(--navy-pale);border-radius:12px;font-size:.84rem}.detail strong{display:block;color:var(--navy);margin-bottom:4px}.detail span{display:block;color:var(--muted);margin-top:2px}.detail a{display:inline-block;margin-top:7px;font-weight:800}.legend{max-width:930px;margin:10px auto 0;display:flex;gap:12px;flex-wrap:wrap;font-size:.72rem;color:var(--muted)}.summary{max-width:860px;margin:44px auto 16px;padding:13px 16px;background:var(--gold-pale);border-radius:12px;text-align:center;font-size:.87rem}.cards{max-width:860px;margin:0 auto;display:grid;gap:14px}.card{border:1px solid var(--line);border-left:6px solid var(--group);border-radius:14px;padding:18px;background:#fff;box-shadow:var(--shadow);scroll-margin-top:90px}.card-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.event-date{display:inline-block;padding:4px 9px;border-radius:999px;background:#f6f6f6;font-weight:900;font-size:.8rem}.group{margin-top:6px;font-size:.75rem;font-weight:900}.card h3{margin-top:4px;color:var(--navy);font-size:1rem;line-height:1.5}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin-top:13px}.meta div{border-top:1px dashed var(--line);padding-top:8px}.meta dt{font-size:.7rem;color:var(--muted);font-weight:700}.meta dd{font-size:.86rem;font-weight:600}.status{font-size:.72rem;font-weight:900}.source-link{display:inline-block;margin-top:12px;font-weight:900;font-size:.82rem}.group-fruits{--group:var(--fz)}.group-candy{--group:var(--ct)}.group-sweet{--group:var(--ss)}.group-cutie{--group:var(--cs)}.group-more{--group:var(--ms)}.group-lab{--group:var(--lab)}@media(max-width:640px){.meta{grid-template-columns:1fr}.live-filter{font-size:.72rem;padding:8px 9px}}
